<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Abriendo el documento…</title>
<style>body{font:16px system-ui,sans-serif;background:#1b1c20;color:#eee;display:grid;place-items:center;min-height:90vh;margin:0;text-align:center}a{color:#E8834F}</style></head>
<body><p>Abriendo el documento…<br><small><a id="l" href="#">Si no se abre, tocá acá</a></small></p>
<script>
/* Salto a una parte de un Google Doc sin que el iPhone abra la app de Docs (que ignora el salto) */
var u = decodeURIComponent(location.hash.slice(1));
if (/^https:\/\/docs\.google\.com\/document\/d\/[\w-]+\/mobilebasic#h\.\w+$/.test(u)) {
  document.getElementById('l').href = u;
  setTimeout(function () { location.replace(u); }, 60);
} else document.body.innerHTML = '<p>Link no válido</p>';
</script></body></html>
