<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula de Ajuste Elástico</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ajuste Elástico">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111214">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Tema oscuro, en la línea del Área de Miembros, con los colores de Ajuste Elástico */
  --fondo:#111214; --sup:#1B1C20; --sup2:#24262B; --linea:#2E3036;
  --tinta:#EDEEF0; --gris:#9DA2AC; --blanco:#FFFFFF;
  --azul:#5D7BB6; --azul-txt:#A9BEE8; --azul-osc:#3A4F7A; --azul-claro:#22304A; --azul-velo:#1A2232;
  --oxido:#E2643A; --oxido-txt:#F29A78; --oxido-claro:#3A2219; --naranja:#E8834F; --naranja-claro:#33241B;
  --papel:var(--fondo);
  --radio-s:6px; --radio-m:12px;
  --sans:'Source Sans 3', system-ui, sans-serif; --display:'Poppins', system-ui, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);color-scheme:dark;font:400 17px/1.55 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul-txt);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--naranja);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;margin:0;letter-spacing:-.01em}
.suave{color:var(--gris)} .chico{font-size:14px}
.link{color:var(--azul-txt);text-decoration:underline;text-underline-offset:3px}
.link.suave{color:var(--gris)}
.primario{background:#FFFFFF;color:#111214;padding:11px 22px;border-radius:8px;font-weight:600}
.primario:hover{background:#E4E5E8}
.secundario,.boton{display:inline-block;border:1px solid #4A4D55;color:var(--tinta);padding:8px 16px;border-radius:8px;font-weight:600;text-decoration:none;background:var(--sup2);font-size:15px}
.secundario:hover,.boton:hover{background:var(--azul-velo)}

/* Barra */
.barra{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:var(--fondo);border-bottom:1px solid var(--linea)}
.marca svg{height:64px;width:auto;display:block}
.barra-der{display:flex;gap:14px;align-items:center;font-size:15px}
.quien{font-weight:600}
.firma{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.02em;color:#3A4F7A;white-space:nowrap}
.salir-pie{margin:26px 0 8px;text-align:center;font-size:14px;color:var(--gris)}
.registro-adm{margin:18px 0 26px;padding:16px 18px;border:1px solid var(--linea);border-radius:var(--radio-m);background:var(--sup)}
.registro-adm .reg-cab{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.registro-adm h2{font-size:18px}
.registro-adm p{margin:4px 0 0;max-width:62ch}
.registro-adm textarea{width:100%;margin:12px 0 10px}
.registro-adm .reg-mods{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.registro-adm .reg-mod{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--linea);border-left:4px solid var(--c);border-radius:10px;cursor:pointer}
.registro-adm .reg-mod span{display:flex;flex-direction:column;font-weight:700;font-size:14px}
.registro-adm .reg-mod small{font-weight:400;opacity:.7;font-size:12px}
.registro-adm .reg-para{margin:6px 0 0}
.marca-ajustar{display:block;font-size:13px;color:var(--azul-txt);font-weight:600}
.aviso-ajustar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:10px 0 14px;padding:12px 14px;border:1.5px solid var(--azul);border-radius:var(--radio-s);background:var(--azul-velo)}
.aviso-ajustar p{margin:0}
@media (max-width:600px){.firma{font-size:14px}.registro-adm .reg-cab,.aviso-ajustar{flex-direction:column;align-items:stretch}}

/* Entrada */
.entrada{max-width:460px;margin:8vh auto 60px;padding:0 20px}
.entrada h1{font-size:30px;margin-bottom:10px}
.entrada form{display:grid;gap:10px;margin:26px 0}
.entrada label{font-weight:600}
.entrada input{padding:12px 14px;border:1.5px solid var(--linea);border-radius:var(--radio-s);background:var(--sup);font-size:18px}
.entrada .primario{justify-self:start}
.error{color:var(--oxido-txt);margin:0}
.demo{border-left:3px solid var(--naranja);padding:4px 0 4px 16px;margin-top:30px}
.demo ul{margin:6px 0 12px;padding-left:20px}

/*CSS_ALUMNO*/
.como{font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.como-listo,.como-casi{background:var(--azul-claro);color:var(--azul-txt)}
.como-cuesta{background:var(--oxido-claro);color:var(--oxido-txt)}
.acceso{margin:18px 0;padding:14px;border:1px solid var(--linea);border-radius:var(--radio-s);background:var(--sup2)}
.acceso-cab{display:grid;gap:2px;margin-bottom:10px}
.acceso-cab h3{font-size:16px}
.acceso-cab .suave{font-size:15px}
.bloque-email{display:grid;gap:4px;font-weight:600;font-size:15px;margin-bottom:10px}
.bloque-email input{padding:8px 10px;border:1.5px solid var(--linea);border-radius:var(--radio-s);background:var(--sup);font-weight:400}
.link-inv textarea{width:100%;border:1px solid var(--linea);border-radius:var(--radio-s);padding:10px;font-size:15px;background:var(--sup);resize:vertical}
.link-inv p{margin:0 0 6px}
.fila-botones{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* Aviso de guardado */
#aviso{position:fixed;right:16px;bottom:16px;background:var(--tinta);color:var(--fondo);font-weight:600;padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9}
#aviso.visible{opacity:1;transform:none}
#aviso.error{background:var(--oxido);color:var(--blanco)}

/* Panel de Andy */
.admin{max-width:1240px;margin:0 auto;padding:6px 20px 80px}
.admin h2{font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.admin .cuenta{font:600 13px var(--sans);background:var(--naranja);color:#111;border-radius:999px;padding:2px 9px}
.por-ver{margin:8px 0 34px}
.tarjetas-video{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tarjeta-video{display:flex;gap:12px;align-items:center;text-align:left;background:var(--sup);border:1px solid var(--linea);border-radius:var(--radio-m);padding:10px;color:var(--tinta);cursor:pointer}
.tarjeta-video:hover{border-color:var(--naranja)}
.tv-mini{position:relative;width:64px;height:84px;flex:none;border-radius:8px;overflow:hidden;background:#000;display:grid;place-items:center}
.tv-mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tv-play{position:relative;width:30px;height:30px}
.tv-txt{display:grid;gap:2px;min-width:0}
.tv-txt strong{font-size:16px}
.tv-txt span{font-size:14.5px;line-height:1.3}
.tv-txt small{color:var(--gris);font-size:13px}
.adm-top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.volver-adm{font-weight:600}
.revision{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;margin:18px 0 8px;align-items:start}
.rev-video{display:grid;gap:12px}
.rev-video>.chico{margin:-4px 0 0}
.rev-player{height:min(64vh,640px);background:#000;border-radius:var(--radio-m);overflow:hidden;display:grid;place-items:center}
.rev-player iframe{width:100%;height:100%;border:0}
.rev-info{display:grid;gap:6px}
.rev-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rev-info p{margin:0}
.rev-paso{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:17px}
.rev-info .fila-botones{margin-top:6px;align-items:center}
.visto{display:inline-flex;align-items:center;gap:6px;color:#5BD49A;font-weight:600}
.visto svg{width:18px;height:18px}
.rev-otros h4{font-size:14px;color:var(--gris);margin:0 0 8px;font-weight:600}
.rev-otros>div{display:flex;flex-wrap:wrap;gap:8px}
.chip-video{border:1px solid var(--linea);background:var(--sup);color:var(--tinta);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip-video small{color:var(--gris)}
.chip-video.nuevo{border-color:var(--naranja)}
.chip-video.sel{background:var(--tinta);color:var(--fondo)}
.chip-video.sel small{color:var(--fondo)}
.rev-msg .mensaje{margin:0;position:sticky;top:12px}
.rev-vacio{background:var(--sup);border-radius:var(--radio-m);padding:22px}
.det-resto{margin-top:10px}
.det-resto .links-adm{margin-top:18px}
.lista-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lista-cab h1{font-size:26px}
.lista-botones{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.barra-der>*{white-space:nowrap}
.chip-prueba::first-letter,.barra-der [data-accion=volver-admin]::first-letter{text-transform:uppercase}
.chip-prueba{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--naranja-claro);color:var(--naranja);border:1px solid var(--naranja)}
@media (max-width:600px){.barra-der{gap:10px;font-size:14px}.barra-der .solo-pc{display:none}}
.lista table{width:100%;border-collapse:collapse;background:var(--sup);border-radius:var(--radio-m);overflow:hidden;font-size:16px}
.lista th{text-align:left;font-weight:600;font-size:14px;color:var(--gris);padding:10px 12px;border-bottom:1px solid var(--linea)}
.lista td{padding:12px;border-bottom:1px solid var(--linea);vertical-align:top}
.lista tr[data-elegir]{cursor:pointer}
.lista tr[data-elegir]:hover td{background:var(--azul-velo)}
.lista tr.sel td{background:var(--azul-claro)}
.lista td.nw{white-space:nowrap}
.etapa-completa .etapa-cab{padding:12px 0;border-bottom:1px solid var(--linea);margin:0}
.etapa-completa h3::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--azul);margin-right:10px;vertical-align:middle}
.marca-prob{display:block;font-size:13px;color:var(--oxido-txt);font-weight:600}
.marca-video{display:block;font-size:13px;color:var(--naranja);font-weight:600}
.vids-adm{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.vids-adm li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.vids-adm li.nuevo button{color:var(--naranja)}
.estado-chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--azul-claro);color:var(--azul-txt)}
.estado-chip.t-meterle{background:var(--oxido-claro);color:var(--oxido-txt)}
.estado-chip.t-adelantado,.estado-chip.t-m2{background:var(--naranja-claro);color:var(--naranja)}
.estado-chip.t-pausa{background:var(--papel);color:var(--gris);border:1px solid var(--linea)}
.detalle{background:var(--sup);border-radius:var(--radio-m);padding:22px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.vacio{margin:30px 0}
.det-cab{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.det-cab h2{font-size:24px}
.mensaje{margin:18px 0;padding:14px;border:1.5px solid var(--azul-claro);border-radius:var(--radio-s);background:var(--azul-velo)}
.mensaje-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mensaje-cab h3,.bloque h3{font-size:16px}
.mensaje-cab span{display:flex;gap:8px}
.mensaje textarea{width:100%;border:1px solid var(--linea);border-radius:var(--radio-s);padding:10px;font-size:15px;line-height:1.45;background:var(--sup);resize:vertical}
.form-admin{display:grid;gap:12px}
.form-admin label,.bloque{display:grid;gap:4px;font-weight:600;font-size:15px}
.form-admin input,.form-admin select,.bloque textarea,.fila-extra input{padding:8px 10px;border:1.5px solid var(--linea);border-radius:var(--radio-s);background:var(--sup);font-weight:400;font-size:16px}
.form-admin label.check{display:flex;gap:8px;align-items:center;font-weight:400}
.ajustes{display:grid;gap:14px;margin-bottom:4px}
.aj-fila{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:end}
@media (max-width:600px){.aj-fila{grid-template-columns:1fr}}
.contador{display:inline-flex;align-items:center;gap:10px}
.contador button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--linea);background:var(--sup2);color:inherit;font-size:22px;font-weight:700;cursor:pointer;line-height:1}
.contador button:disabled{opacity:.35;cursor:default}
.contador b{font-size:22px;min-width:74px;text-align:center}
.contador small{font-size:13px;font-weight:400;opacity:.7}
.sec-adm{border:1px solid var(--linea);border-radius:var(--radio-m);background:var(--sup);margin:10px 0}
.sec-adm>summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px}
.sec-adm>summary::-webkit-details-marker{display:none}
.sec-adm>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);opacity:.6;transition:transform .2s}
.sec-adm[open]>summary::after{transform:rotate(-135deg)}
.sec-adm>summary span{display:flex;align-items:center;gap:8px}
.sec-cuerpo{padding:2px 18px 18px}
.sec-cuerpo .revision{margin-top:4px}
.sec-cuerpo .acceso{margin:0}
.punto-sec{width:8px;height:8px;border-radius:50%;background:#E8834F;display:inline-block}
.lista-busca{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lista-busca input{margin-left:auto;padding:9px 12px;border:1.5px solid var(--linea);border-radius:var(--radio-s);background:var(--sup);color:inherit;font-size:16px;min-width:240px}
.avance-adm .av-etapa{font-weight:700;font-size:14px;padding:12px 0 4px;margin-top:6px;border-top:1px dashed var(--linea);display:block}
.ajustes label.check{grid-column:1/-1}
.segmentado{display:inline-flex;border:1.5px solid var(--linea);border-radius:999px;overflow:hidden;justify-self:start}
.segmentado button{padding:6px 14px;font-weight:600}
.segmentado button.sel{background:var(--azul);color:var(--blanco)}
.bloque{margin-top:20px}
.extras-adm,.probs-adm,.avance-adm{list-style:none;margin:6px 0 0;padding:0;font-weight:400}
.extras-adm li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--linea)}
.extras-adm li>span{flex:1;min-width:0}
.extras-adm li.hecha strong{text-decoration:line-through;color:var(--gris)}
.fila-extra{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;margin-top:8px}
.probs-adm li{padding:4px 0}
.avance-adm li{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:15px}
.avance-adm li span:nth-child(2){flex:1}
.ya-hecho{margin:6px 0 14px;padding:10px 14px;border:1px solid var(--linea);border-radius:var(--radio-s)}
.ya-hecho summary{cursor:pointer;font-weight:600}
.nh-mod{margin:12px 0 0;padding:6px 0 0;border:0;border-top:1px solid var(--linea)}
.nh-mod legend{padding:0}
.nh-mod legend strong{color:var(--mc)}
.nh-mod>.check{display:flex;gap:8px;margin:4px 0 0 22px;font-weight:400}
.avance-adm li.av-mod{justify-content:space-between}
.av-tit{flex:1;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.av-tit:hover{color:var(--azul-txt)}
.avance-adm li.av-mod{margin-top:14px;padding-top:6px;font:600 12.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mc);border-top:1px solid var(--linea)}
.avance-adm li.av-mod:first-child{margin-top:0;border-top:0}
.mini-nodo{cursor:pointer;position:relative}
.mini-nodo[aria-pressed=true]::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.extras-adm .mini-nodo[aria-pressed=true]{background:var(--azul);border-color:var(--azul-txt)}
.mini-nodo{width:18px;height:18px;border-radius:50%;border:2px solid var(--linea);background:var(--sup);flex:none}
.avance-adm .est-listo .mini-nodo,.avance-adm .est-casi .mini-nodo{background:var(--azul);border-color:var(--azul-txt)}
.avance-adm .est-cuesta .mini-nodo{background:var(--oxido-claro);border-color:var(--oxido-txt)}
.links-adm{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.links-adm p{width:100%;margin:0}

@media (max-width:900px){
  .revision{grid-template-columns:1fr}
  .rev-player{height:min(78vh,640px)}
  .rev-msg .mensaje{position:static}
  .lista th:nth-child(4),.lista td:nth-child(4),.lista th:nth-child(5),.lista td:nth-child(5){display:none}
}
@media (max-width:560px){
  body{font-size:16.5px}
  .barra{padding:12px 16px}
  .marca svg{height:48px}
  .ajustes{grid-template-columns:1fr}
  .fila-extra{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.instalar-app{display:flex;align-items:center;gap:12px;margin:0 0 22px;padding:12px 14px;background:var(--sup);border:1px solid var(--linea);border-radius:14px}
.instalar-app img{width:40px;height:40px;border-radius:10px;flex:none}
.instalar-app p{margin:0;flex:1;font-size:15px;line-height:1.35;color:var(--gris)}
.instalar-app p b{color:var(--tinta);display:block;font-size:15.5px}
.instalar-app a,.instalar-app button.ia-si{flex:none;font:600 14.5px var(--sans);color:var(--fondo);background:var(--tinta);border:0;border-radius:10px;padding:8px 12px;text-decoration:none}
.instalar-app .ia-no{flex:none;background:none;border:0;color:var(--gris);font-size:20px;line-height:1;padding:4px}
.modulos-adm{display:grid;gap:8px}
.mod-tg{display:flex;align-items:center;gap:12px;text-align:left;background:var(--sup2);border:1px solid var(--linea);border-radius:12px;padding:10px 14px;color:var(--tinta);cursor:pointer}
.mod-tg strong{display:block;font-size:15.5px}
.mod-tg small{color:var(--gris);font-size:13.5px}
.mod-sw{width:40px;height:24px;border-radius:999px;background:#3A3D45;position:relative;flex:none;transition:background .15s}
.mod-sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.mod-tg.on .mod-sw{background:#34C759}
.mod-tg.on .mod-sw i{transform:translateX(16px)}
</style>
</head>
<body>
<div id="app" aria-live="off"></div>
<div id="aviso" role="status"></div>
<script>
const LOGO = `/*LOGO*/`;
/*JS*/
</script>
</body>
</html>
