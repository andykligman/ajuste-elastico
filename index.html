.paso-wa{margin:4px 0 8px}
.mat .mat-mini{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;margin:-3px 4px -3px -7px;flex:none;background:#000;border:1px solid rgba(232,131,79,.35)}
@media (max-width:560px){.mat .mat-mini{width:80px}}
.vg-grab{fill:#3a3b41}
.vg-voz{fill:none;stroke:var(--naranja);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:320;stroke-dashoffset:320;animation:vgDibuja 2.4s .3s ease forwards}
.vg-fila-no{fill:rgba(226,112,90,.18);stroke:#E2705A;stroke-width:1.5;opacity:0;animation:vgAparece 5s ease infinite;animation-delay:calc(var(--k)*.55s)}
.vg-bloque{fill:none;stroke:#4a4b51;stroke-width:2;stroke-dasharray:5 5}
.vg-trozo{fill:var(--azul);opacity:.25;animation:vgTrozo 4s ease-in-out infinite;animation-delay:calc(var(--k)*.7s)}
@keyframes vgTrozo{0%,100%{opacity:.25}15%,30%{opacity:1}}
.vg-paso{fill:#5a5b61}.vg-paso.mal{fill:#E2705A}
.vg-salto{fill:none;stroke:var(--naranja);stroke-width:3;stroke-linecap:round;stroke-dasharray:220;stroke-dashoffset:220;animation:vgDibuja 1.2s .5s ease forwards}
.vg-parlante{fill:var(--azul)}
.vg-arco{fill:none;stroke:var(--naranja);stroke-width:3;stroke-linecap:round;animation:vgParpadeo 1.8s ease-in-out infinite;animation-delay:calc(var(--k)*.3s)}
.vg-compas{fill:none;stroke:#5a5b61;stroke-width:2}.vg-compas.inicio{stroke:var(--naranja);fill:rgba(232,131,79,.2)}
.vg-bandera{fill:var(--naranja);stroke:var(--naranja);stroke-width:2;stroke-linejoin:round}
.vg-dedo{fill:#2b2c31;stroke:var(--azul);stroke-width:2;animation:vgDedo 2.4s steps(1) infinite;animation-delay:calc(var(--k)*.6s)}
@keyframes vgDedo{0%,24%{fill:var(--azul)}25%,100%{fill:#2b2c31}}
.vg-num{fill:var(--tinta);font:700 16px var(--display);text-anchor:middle}
.vg-grado{fill:var(--azul);opacity:0;animation:vgAparece 5s ease infinite;animation-delay:calc(var(--k)*.35s)}
.vg-motivo{fill:none;stroke:var(--naranja);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:vgAparece 5s ease infinite;animation-delay:calc(var(--k)*.6s)}

/* Testimonios: tapa opaca con la miniatura mientras no suena (tapa el título, "Ver más tarde" y "Compartir" de YouTube) */
.ev-play{background:var(--poster) center/auto var(--poster-alto) no-repeat,#0D1220}
.ev-play::before{content:"";position:absolute;inset:0;background:rgba(9,13,24,.45);z-index:-1}
.ev-play{isolation:isolate}
.ev-arranco:not(.ev-sonando) .ev-play{background:var(--poster) center/auto var(--poster-alto) no-repeat,#0D1220}
.ev-sonando .ev-play{display:flex;opacity:1;pointer-events:none;transition:opacity .35s ease}
.ev-sonando .ev-play>*{visibility:hidden}
.ev-sonando.ev-ver .ev-play{opacity:0}
/* Ver en grande */
.ev-agrandar{display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 12px 7px 9px;background:rgba(9,13,24,.72);color:#fff;font:700 13px var(--sans);cursor:pointer}
.ev-agrandar svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ev-sonando .ev-agrandar span{display:none}
.ev-achicar{display:none}
.ev-simple .ev-agrandar{display:none}
.emb.ev-grande{position:fixed;inset:0;z-index:300;background:#000;display:grid;place-items:center;margin:0;max-width:none;width:auto}
.emb.ev-grande:fullscreen{width:100%;height:100%}
.emb.ev-grande .emb-eti{display:none}
.emb.ev-grande .emb-marco{border-radius:10px;border:0;box-shadow:none;max-width:none}
.emb.ev-grande .ev-agrandar{display:none}
.emb.ev-grande .ev-achicar{display:grid;place-items:center;position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:6;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font:700 20px var(--sans);cursor:pointer}
/* Final de la llamada: WhatsApp */
.llp-wa{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.llp-wa svg{width:26px;height:26px}
.llp-cerrar{margin-top:6px;border:0;background:transparent;color:#A9BEE8;font:600 16px var(--sans);text-decoration:underline;cursor:pointer;padding:10px}
.ll-fin-wa{align-self:center;margin-top:10px}
[data-accion="reiniciar-llamada"].seguro{color:#E8834F;font-weight:700}

/* Mientras un video está en grande, los contenedores de arriba no pueden tener transform ni quedar abajo de otras cosas
   (si no, en el iPhone el video y la cruz quedan corridos y se ven tildes de los pasos por encima) */
.ev-sube{transform:none!important;animation:none!important;filter:none!important;z-index:400!important}
body.hay-grande #consulta,body.hay-grande .barra,body.hay-grande #panel-video{visibility:hidden}

/* barra para moverse en el video: zona de toque más grande que la línea */
.ev-barra::before{content:"";position:absolute;left:0;right:0;bottom:0;height:30px}
.ev-barra i{position:relative;pointer-events:none}
.ev-barra b{display:none}
.ev-arranco .ev-barra i::after{content:"";position:absolute;right:-7px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#E8834F;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.ev-tiempo{position:absolute;left:10px;bottom:16px;z-index:6;padding:3px 8px;border-radius:6px;background:rgba(9,13,24,.72);color:#fff;font:700 13px var(--sans);display:none;pointer-events:none}
.ev-arrastrando .ev-tiempo{display:block}

/* Mandar otro video, cuando ya mandó uno: dos links, sin recuadro */
.envio.envio-ok:has(.otro-video){flex-wrap:wrap;width:100%;justify-content:flex-start;row-gap:6px}
.otro-video{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;width:100%}
.otro-btn{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:6px 0;color:var(--azul-txt);font:700 15.5px var(--sans);cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(169,190,232,.35)}
.otro-btn:hover{color:#fff;text-decoration-color:currentColor}
.otro-btn i{width:10px;height:10px;border-radius:50%;background:#E8834F;display:inline-block}
.otro-btn svg{width:17px;height:17px}
/* En la compu entra todo en una sola línea: lo mandado a la izquierda, las acciones a la derecha */
@media (min-width:1000px){
  .envio.envio-ok:has(.otro-video){flex-wrap:nowrap;align-items:center}
  .envio.envio-ok:has(.otro-video) .vids{width:auto;margin:0}
  .otro-video{width:auto;margin-left:auto;flex-wrap:nowrap}
  .otro-btn{font-size:16px}
}

/* Testimonios: tocar a la izquierda / derecha = -15 s / +15 s, al medio = pausa */
.ev-sonando .ev-capa{display:block}
.ev-zona-izq{right:auto!important;width:32%}.ev-zona-der{left:auto!important;width:32%}.ev-zona-med{left:32%!important;right:32%!important}
.ev-aviso-salto{position:absolute;top:50%;left:18%;z-index:6;white-space:nowrap;transform:translate(-50%,-50%);padding:10px 16px;border-radius:999px;background:rgba(9,13,24,.75);color:#fff;font:700 18px var(--sans);opacity:0;pointer-events:none}
.ev-aviso-salto.der{left:82%}
.ev-aviso-salto.ver{animation:evSalto .8s ease-out}
@keyframes evSalto{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0}}
/* botones -15 / +15, abajo a la izquierda */
.ev-saltos{position:absolute;left:10px;bottom:18px;z-index:7;display:none;gap:8px}
.ev-arranco .ev-saltos{display:flex}
.ev-saltos button{position:relative;width:42px;height:42px;border:0;border-radius:50%;background:rgba(9,13,24,.72);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.ev-saltos svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ev-saltos b{position:absolute;font:700 11px var(--sans);top:50%;left:50%;transform:translate(-50%,-42%)}
/* Ver en YouTube y Ver en grande, juntos abajo a la derecha */
.ev-acciones{position:absolute;right:10px;bottom:18px;z-index:7;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ev-acciones>*{display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 12px 7px 9px;background:rgba(9,13,24,.72);color:#fff;font:700 13px var(--sans);cursor:pointer;text-decoration:none}
.ev-en-yt svg{width:18px;height:18px;fill:#FF3B30}
.ev-sonando .ev-acciones span{display:none}
.ev-sonando .ev-acciones>*{padding:8px}
.ev-simple .ev-acciones,.ev-simple .ev-saltos{display:none}
.emb.ev-grande .ev-acciones{right:12px;bottom:26px}
.emb.ev-grande .ev-saltos{left:12px;bottom:26px}
.emb.ev-grande .ev-saltos button{width:52px;height:52px}
.emb.ev-grande .ev-saltos svg{width:36px;height:36px}
.emb.ev-grande .ev-agrandar{display:none}

/* cartelito de paso nuevo */
.nodo-tit .nuevo{display:inline-block;justify-self:start;margin-top:4px;padding:2px 9px;border-radius:999px;background:#E8834F;color:#fff;font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;font-style:normal;vertical-align:3px;animation:nuevoLate 2.4s ease-in-out infinite}
@keyframes nuevoLate{0%,100%{box-shadow:0 0 0 0 rgba(232,131,79,.5)}50%{box-shadow:0 0 0 6px rgba(232,131,79,0)}}

.ll-terminar{padding-top:4px}
.boton-terminar{display:block;width:100%;border:0;border-radius:14px;background:#E8834F;color:#fff;font:700 17px var(--sans);padding:16px 20px;cursor:pointer;box-shadow:0 8px 22px rgba(232,131,79,.28)}
.boton-terminar:active{transform:scale(.98)}

/* Franja que tapa el título de YouTube los primeros segundos de cada arranque (no se toca el iframe) */
.ev-tit{position:absolute;left:0;right:0;top:0;height:max(72px,12%);z-index:2;pointer-events:none;opacity:0;transition:opacity .5s ease;background:linear-gradient(#000 0,#000 62%,rgba(0,0,0,0) 100%)}
.ev-tit-on .ev-tit{opacity:1;transition:none}
.ev-simple .ev-tit{display:none}
/* Mapa: pasos siempre a la vista, separados por ejercitación como en el aula */
.mz-lista li.mz-etapa{display:block;margin:12px 0 2px;padding:10px 6px 2px;border-top:1px dashed rgba(255,255,255,.14)}
.mz-lista li.mz-etapa:first-child{margin-top:0;border-top:0;padding-top:2px}
.mz-etapa strong{display:block;color:var(--mc);font-size:14px}
.mz-etapa small{color:#9AA1AE;font-size:12.5px}
.mz-lista li.mz-sep{padding:0;margin:6px 0}
/* Recursos en columnas: cada video con su parte del doc abajo */
.mat-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:10px 0}
.mat-col{display:grid;gap:8px;align-content:start}
.mat-col .mat{width:100%;box-sizing:border-box}
/* Las etapas de un proceso (reconocimiento → mecanización → integración) */
.etapas-vis{display:flex;align-items:center;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
.ev-et{display:inline-flex;align-items:center;gap:9px;padding:10px 14px 10px 10px;border-radius:14px;background:var(--sup2);border:1.5px solid rgba(93,123,182,.45);font-weight:700;font-size:15px}

.ev-et b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#5D7BB6;color:#fff;font-size:13px}
.ev-fl{width:18px;height:2px;background:#5D7BB6;position:relative;flex:none}
.ev-fl::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:#5D7BB6;border-right:0}
.grupo-label h3{color:var(--mc,#E8834F);font-weight:700;font-size:14px}
/* Botón dentro de una tanda de texto (p. ej. el video de AudioStretch) */
.stop-boton{display:inline-flex;align-items:center;gap:12px;margin:22px auto 0;padding:12px 22px 12px 12px;border-radius:999px;background:#5D7BB6;color:#fff;text-decoration:none;font:700 16px var(--sans);box-shadow:0 10px 28px rgba(93,123,182,.35);animation:sb-late 1.6s ease-in-out infinite}
.stop-boton.suave{background:transparent;border:1.5px solid #5D7BB6;color:#A9BEE8;box-shadow:none;animation:none;font-size:14px;padding:8px 16px 8px 8px}
.stop-boton.suave .sb-play{width:28px;height:28px;background:#5D7BB6}
.stop-boton.suave svg{fill:#fff;width:13px;height:13px}
.stop-boton .sb-play{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#fff}
.stop-boton svg{width:18px;height:18px;fill:#5D7BB6;margin-left:3px}
@keyframes sb-late{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@media (prefers-reduced-motion:reduce){.stop-boton{animation:none}}
.stop-texto .stop-boton{display:flex;width:max-content;max-width:100%}
/* ---- Cierre de los ritmos fijos: dibujos ---- */
.vg-rf-ritmos,.vg-rf-cuerpo,.vg-rf-escalera,.vg-rf-donde,.vg-rf-mapa,.vg-rf-compases,.vg-rf-redoblante,.vg-rf-nuestro,.vg-rf-generador,.vg-rf-seguimos,.vg-rf-chau{width:min(440px,92%)}
.vr-linea{stroke:#5a5b61;stroke-width:1.6}
.vr-div{stroke:#8a8b90;stroke-width:1.6}
.vr-cab{stroke:var(--tinta);stroke-width:5;stroke-linecap:round}
.vr-plica,.vr-barra{stroke:var(--tinta);stroke-width:2;stroke-linecap:round}
.vr-barra{stroke-width:5}
.vr-gancho{fill:none;stroke:var(--tinta);stroke-width:2;stroke-linecap:round}
.vr-sil{fill:none;stroke:#9DA2AC;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.vr-nota{opacity:0;animation:vrEntra .45s ease forwards;animation-delay:calc(var(--k)*.22s)}
.vr-nota.tenue,.vr-nota.loop{opacity:1;animation:none}
.vr-nota.tenue .vr-cab,.vr-nota.tenue .vr-plica,.vr-nota.tenue .vr-barra{stroke:#6a6b71}
@keyframes vrEntra{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.vr-cursor{fill:rgba(232,131,79,.28);animation:vrCursor 3.2s linear infinite;animation-delay:2s;opacity:0}
@keyframes vrCursor{0%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(284px)}}
/* cuerpo → guitarra */
.vr-persona circle,.vr-persona path{fill:none;stroke:var(--tinta);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.vr-brazo{transform-box:view-box;transform-origin:58px 48px;animation:vrAplauso .5s ease-in-out infinite alternate}
.vr-brazo.d{animation-name:vrAplausoD}
@keyframes vrAplauso{from{transform:rotate(-8deg)}to{transform:rotate(6deg)}}
@keyframes vrAplausoD{from{transform:rotate(8deg)}to{transform:rotate(-6deg)}}
.vr-chispa{fill:none;stroke:#E8834F;stroke-width:2.4;stroke-linecap:round;animation:vgParpadeo .5s ease-in-out infinite alternate}
.vr-flecha{fill:none;stroke:#8a8b90;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.vr-flecha.xl{stroke:var(--naranja);stroke-width:5;stroke-dasharray:300;stroke-dashoffset:300;animation:vgDibuja 1.2s .2s ease forwards}
.vr-viaje{fill:var(--naranja);animation:vrViaje 1.8s ease-in-out infinite}
@keyframes vrViaje{0%{transform:none;opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(84px);opacity:0}}
.vr-guit .vr-cuerpo{fill:#3A4F7A;stroke:var(--azul);stroke-width:2}
.vr-guit .vr-boca{fill:#16213A}
.vr-guit .vr-mango{stroke:#C9A27A;stroke-width:7;stroke-linecap:round}
.vr-guit .vr-cuerdas{stroke:var(--tinta);stroke-width:1;opacity:.8}
.vr-guit.vibra .vr-cuerdas{animation:vgVibra .3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
/* escalera */
.vr-pelda{stroke:var(--azul);stroke-width:5;stroke-linecap:round}
.vr-etq{font:700 12px var(--sans);fill:var(--tinta);text-anchor:middle}
.vr-mini{font:600 10.5px var(--sans);fill:var(--gris);text-anchor:middle}
.vr-esc{opacity:0;animation:vrEntra .5s ease forwards;animation-delay:calc(var(--k)*.7s)}
.vr-esc.tenue{opacity:.45;animation:none}
.vr-pin circle,.vr-pin path{fill:var(--naranja)}
.vr-pin{animation:vrSalta 4.8s ease-in-out infinite}
@keyframes vrSalta{0%,18%{transform:translate(49px,78px)}25%,43%{transform:translate(125px,56px)}50%,68%{transform:translate(201px,34px)}75%,93%{transform:translate(277px,12px)}100%{transform:translate(49px,78px)}}
.vr-pin.fijo{animation:none}
/* mapa */
.vr-mapa{fill:#22304A;stroke:var(--azul);stroke-width:2.4;stroke-linejoin:round}
.vr-pliegue{stroke:#3A4F7A;stroke-width:2}
.vr-ruta{fill:none;stroke:var(--naranja);stroke-width:3;stroke-dasharray:6 7;stroke-linecap:round;animation:vrRuta 2.4s linear infinite}
@keyframes vrRuta{to{stroke-dashoffset:-26}}
.vr-cruz path{stroke:var(--tinta);stroke-width:3;stroke-linecap:round}
/* compases en loop */
.vr-rep{stroke:var(--tinta);stroke-width:2.4}
.vr-rep-p{fill:var(--tinta)}
.vr-vuelta{fill:none;stroke:var(--naranja);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:6 6;animation:vrRuta 1.6s linear infinite}
.vr-nota.loop{animation:vrLoop 2.6s linear infinite;animation-delay:calc(var(--k)*.26s)}
@keyframes vrLoop{0%,8%{opacity:1}4%{opacity:.35}}
.vr-nota.loop .vr-cab{animation:vrBrilla 2.6s linear infinite;animation-delay:calc(var(--k)*.26s)}
@keyframes vrBrilla{0%,10%{stroke:var(--naranja)}12%,100%{stroke:var(--tinta)}}
/* nota → redoblante */
.vr-notita ellipse{fill:var(--tinta)}
.vr-notita path{fill:none;stroke:var(--tinta);stroke-width:3;stroke-linecap:round}
.vr-notita{animation:vrVaAlTambor 2.4s ease-in infinite}
@keyframes vrVaAlTambor{0%{transform:none;opacity:1}70%{transform:translateX(150px) translateY(-26px) scale(.7);opacity:1}76%,100%{transform:translateX(160px) translateY(-26px) scale(.6);opacity:0}}
.vr-parche{fill:#EDEEF0;stroke:var(--azul);stroke-width:2.4}
.vr-tambor{fill:#3A4F7A;stroke:var(--azul);stroke-width:2.4}
.vr-tensor{fill:none;stroke:#A9BEE8;stroke-width:1.6;opacity:.8}
.vr-redo{transform-box:fill-box;transform-origin:center;animation:vrGolpe 2.4s ease infinite}
@keyframes vrGolpe{0%,70%{transform:none}74%{transform:scale(1.05,.95)}80%,100%{transform:none}}
.vr-golpe path{stroke:var(--naranja);stroke-width:3;stroke-linecap:round;opacity:0;animation:vrChis 2.4s ease infinite}
@keyframes vrChis{0%,70%{opacity:0}74%{opacity:1}90%,100%{opacity:0}}
/* hacerlo nuestro */
.vr-centro{fill:#22304A;stroke:var(--azul);stroke-width:3;animation:vrLlenar 5s ease infinite}
@keyframes vrLlenar{0%,30%{fill:#22304A;stroke:var(--azul)}60%,100%{fill:#E8834F;stroke:#E8834F}}
.vr-vos{font:800 16px var(--display);fill:var(--tinta);text-anchor:middle}
.vr-llega{fill:none;stroke:var(--azul);stroke-width:3;stroke-linecap:round;stroke-dasharray:4 7;opacity:0;animation:vrLlega 5s ease infinite;animation-delay:calc(var(--k)*.25s)}
@keyframes vrLlega{0%{opacity:0;stroke-dashoffset:40}20%,60%{opacity:1;stroke-dashoffset:0}80%,100%{opacity:0}}
/* generador */
.vr-pantalla{fill:#16213A;stroke:#3A4F7A;stroke-width:2.4}
.vr-gen-btn{fill:var(--azul);animation:vrBoton 3.6s ease infinite}
@keyframes vrBoton{0%,8%{transform:none}4%{transform:scale(.94)}}
.vr-gen-btn{transform-box:fill-box;transform-origin:center}
.vr-gen-txt{font:700 11px var(--sans);fill:#fff;text-anchor:middle}
.vr-gen-r{opacity:0;animation:vrTurno 10.8s ease infinite;animation-delay:calc(var(--k)*3.6s)}
.vr-gen-r .vr-nota{opacity:1;animation:none}
@keyframes vrTurno{0%{opacity:0}4%,30%{opacity:1}34%,100%{opacity:0}}
/* cierre → unidades */
.vr-check{fill:none;stroke:#3FA56B;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:44;stroke-dashoffset:44;animation:vgDibuja .6s .5s ease forwards}
.vr-unidad{opacity:0;animation:vrEntra .5s ease forwards;animation-delay:calc(1.2s + var(--k)*.45s)}
.vr-unidad .vr-cab,.vr-unidad .vr-plica,.vr-unidad .vr-barra{stroke:var(--naranja)}

.vg-rf-ritmos,.vg-rf-compases{width:min(560px,96%)}
.vr-guit .vr-clavijero{fill:#C9A27A}
.vr-guit .vr-mango{fill:#C9A27A;stroke:none}
.vr-guit .vr-cuerpo{fill:#3A4F7A;stroke:var(--azul);stroke-width:2}
@keyframes vrSalta{0%,18%{transform:translate(49px,62px)}25%,43%{transform:translate(125px,40px)}50%,68%{transform:translate(201px,18px)}75%,93%{transform:translate(277px,-4px)}100%{transform:translate(49px,62px)}}
/* Cartel al cambiar de módulo */

/* Documento nuevo y el botón a su parte, en el mismo renglón */

/* ===== Intro del aula: un cuadro por frase ===== */
.in-escena{display:block;min-height:250px}
.ic{position:relative;min-height:250px;display:grid;place-items:center;padding:16px;border-radius:18px;background:var(--sup);border:1px solid var(--linea);animation:icEntra .5s ease both}
@keyframes icEntra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ic svg{width:100%;height:100%}
.ic-fila{display:flex;align-items:center;justify-content:center;gap:16px;width:100%}
.ic-centro{gap:10px}
.ic-col{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.ic-cap{position:absolute;bottom:10px;left:0;right:0;margin:0;text-align:center;font:600 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gris)}
.ic-y{font:700 22px var(--display);color:var(--gris)}
/* camino con nodos y el «vos» que va bajando */
.ic-camino{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:6px 26px}
.ic-linea{position:absolute;top:20px;bottom:20px;left:50%;width:2px;margin-left:-1px;background:repeating-linear-gradient(#3A3D44 0 5px,transparent 5px 10px)}
.ic-nodo{position:relative;z-index:1;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sup2);border:1.5px solid var(--linea);color:var(--gris);font:700 15px var(--sans);opacity:0;animation:icNodo .5s ease forwards;animation-delay:calc(var(--k)*.35s)}
.ic-nodo i{display:none}.ic-nodo i svg{width:18px;height:18px}
@keyframes icNodo{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.ic-vos{position:absolute;left:50%;top:0;width:50px;height:50px;margin-left:-25px;border-radius:50%;border:2.5px solid #E8834F;box-shadow:0 0 0 6px rgba(232,131,79,.18);opacity:0;z-index:2}
.ic-acompana .ic-vos{animation:icVos 4.4s ease-in-out 1.6s forwards}
@keyframes icVos{0%{opacity:1;transform:translateY(0)}18%{transform:translateY(0)}30%,45%{opacity:1;transform:translateY(60px)}57%,72%{opacity:1;transform:translateY(120px)}84%,100%{opacity:1;transform:translateY(180px)}}
.ic-avanza .ic-nodo{animation:icNodo .4s ease forwards,icHecho .4s ease forwards;animation-delay:calc(var(--k)*.1s),calc(.6s + var(--k)*.9s)}
@keyframes icHecho{to{background:#3FA56B;border-color:#3FA56B;color:#fff}}
.ic-avanza .ic-nodo b{animation:icSacar .1s forwards;animation-delay:calc(.6s + var(--k)*.9s)}
.ic-avanza .ic-nodo i{display:block;width:18px;height:18px;position:absolute;opacity:0;animation:icPoner .2s forwards;animation-delay:calc(.6s + var(--k)*.9s)}
@keyframes icSacar{to{opacity:0}}@keyframes icPoner{to{opacity:1}}
.ic-final .ic-nodo{animation:icNodo .4s ease forwards,icHecho .3s ease forwards;animation-delay:calc(var(--k)*.15s),calc(.5s + var(--k)*.25s)}
.ic-final .ic-vos{animation:icVosFin 1.4s ease 1.6s forwards}
@keyframes icVosFin{0%{opacity:0;transform:translateY(180px) scale(.6)}100%{opacity:1;transform:translateY(180px) scale(1)}}
.ic-sin{display:flex;flex-direction:column;gap:10px}
.ic-sin span{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--sup2);border:1px solid var(--linea);font:600 14px var(--sans);opacity:0;animation:icEntra .5s ease forwards;animation-delay:calc(1s + var(--k)*.9s)}
.ic-sin svg{width:15px;height:15px;color:#3FA56B}
/* video con barra de partes */
.ic-video{position:relative;width:200px;aspect-ratio:16/10;border-radius:12px;background:linear-gradient(135deg,#1c2436,#0f1219);border:1px solid #2c3242;display:grid;place-items:center;overflow:hidden}
.ic-play{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#E5484D;color:#fff;margin-bottom:12px}

.ic-barra i{flex:1;border-radius:3px;transition:all .4s}
.ic-cabezal{position:absolute;top:-4px;left:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.ic-completo .ic-barra::before{content:"";position:absolute;inset:0;width:0;border-radius:3px;background:#E5484D;animation:icLlena 3.2s linear .3s forwards}
.ic-completo .ic-cabezal{animation:icCabezal 3.2s linear .3s forwards}
@keyframes icLlena{to{width:100%}}@keyframes icCabezal{to{left:100%}}
.ic-doc{position:relative;width:130px;height:150px}
.ic-hoja{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:8px;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.ic-hoja.h2{transform:translate(6px,6px);z-index:-1;background:#e7e8ec}.ic-hoja.h3{transform:translate(12px,12px);z-index:-2;background:#cfd1d7}
.ic-hoja b{font:700 9.5px Arial;color:#222}
.ic-hoja i{display:block;height:5px;border-radius:3px;background:#d5d8de}
.ic-hoja i:nth-of-type(2n){width:70%}
.ic-pasan .ic-hoja:first-child{animation:icHojea 1.1s ease-in-out .4s 3}
@keyframes icHojea{0%,100%{transform:none}50%{transform:translateY(-10px) rotate(-3deg)}}
.ic-resalta .ic-p3{outline:2.5px solid #E8834F;outline-offset:2px;border-radius:2px;animation:icLatido 1.2s ease 1.6s infinite}
.ic-resalta{opacity:.35;animation:icAparece .5s ease 1.3s forwards}
@keyframes icAparece{to{opacity:1}}
@keyframes icLatido{50%{outline-color:rgba(232,131,79,.35)}}
/* separar en tareas */
.ic-separa{display:flex;flex-direction:column;align-items:center;gap:18px}
.ic-partido .ic-barra{gap:4px;background:transparent}
.ic-partido .ic-barra i{background:#3A3D44;animation:icParte .5s ease forwards;animation-delay:calc(.4s + var(--n,0)*.1s)}
.ic-partido .ic-barra i:nth-child(1){background:#5D7BB6}.ic-partido .ic-barra i:nth-child(2){background:#7F9BD3}.ic-partido .ic-barra i:nth-child(3){background:#E8834F}.ic-partido .ic-barra i:nth-child(4){background:#F2A97E}
.ic-partido .ic-cabezal{display:none}
.ic-tareas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ic-tarea{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;background:var(--sup2);border:1px solid var(--linea);font:600 12.5px var(--sans);opacity:0;animation:icBaja .5s ease forwards;animation-delay:calc(.6s + var(--k)*.55s)}
.ic-tarea b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#5D7BB6;color:#fff;font-size:11px}
.ic-tarea:nth-child(3) b,.ic-tarea:nth-child(4) b{background:#E8834F}
@keyframes icBaja{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
/* botones con cursor */
.ic-boton{position:relative;display:inline-flex;align-items:center;gap:9px;padding:11px 16px;border-radius:12px;font:600 15px var(--sans);color:#fff;white-space:nowrap}
.ic-boton svg{width:17px;height:17px}
.ic-boton small{opacity:.8;font-weight:500}
.ic-b-vid{background:#5a3a2c;border:1.5px solid #E8834F}
.ic-b-doc{background:var(--sup2);border:1.5px solid var(--linea)}
.ic-cursor{position:absolute;right:14px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);opacity:0;animation:viCur 1.3s ease .7s forwards}
.ic-salta .ic-cabezal{animation:icSalta .6s ease 1.5s forwards}
.ic-salta .ic-barra::before{content:"";position:absolute;inset:0;width:0;border-radius:3px;background:#E5484D;animation:icSaltaB .6s ease 1.5s forwards}
@keyframes icSalta{to{left:62%}}@keyframes icSaltaB{to{width:62%}}
.ic-flecha{width:40px;height:2px;background:#8a8b90;position:relative;opacity:0;animation:icAparece .4s ease 1.1s forwards}
.ic-flecha::after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left-color:#8a8b90;border-right:0}
/* hacer la tarea dentro del paso */
.ic-paso{width:100%;max-width:380px;display:grid;gap:8px;padding:14px;border-radius:14px;background:var(--sup2);border:1px solid var(--linea)}
.ic-paso-t{margin:0 0 4px;font:700 15px var(--display)}
.ic-mini{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;background:var(--sup);font:600 13px var(--sans);color:var(--gris);opacity:0;animation:icEntra .4s ease forwards}
.ic-mini:nth-of-type(1){animation-delay:.3s}.ic-mini:nth-of-type(2){animation-delay:.6s}
.ic-mini svg{width:15px;height:15px}
.ic-hago{display:flex;align-items:center;justify-content:space-between;margin-top:4px;min-height:40px}
.ic-guitarra{width:84px;height:52px;opacity:0;animation:icAparece .4s ease 1s forwards}
.ic-ok{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:rgba(63,165,107,.15);border:1.5px solid #3FA56B;color:#7fd8a5;font:700 14px var(--sans);opacity:0;animation:icPop .45s cubic-bezier(.3,1.5,.5,1) 3s forwards}

@keyframes icPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
/* mandar video */
.ic-envio{position:relative;gap:10px}
.ic-grabar,.ic-wa{display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:12px;font:700 15px var(--sans);animation:icDesaparece .4s ease 3.2s forwards}
.ic-grabar{background:var(--blanco);color:#111}
.ic-grabar i{width:12px;height:12px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 3px rgba(229,72,77,.25);animation:icRec 1s ease infinite}
@keyframes icRec{50%{opacity:.3}}
.ic-wa{background:#1f7a4c;color:#fff}.ic-wa svg{width:18px;height:18px}
.ic-o{font:600 13px var(--sans);color:var(--gris);animation:icDesaparece .4s ease 3.2s forwards}

.ic-mandado{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:9px;color:#5BD49A;font:700 17px var(--sans);opacity:0;animation:icPop .45s ease 3.5s forwards}
.ic-mandado svg{width:22px;height:22px}
/* seguimos / nos quedamos / paso intermedio */
.ic-rama{max-width:420px;overflow:visible}
.ic-rama text{font:700 14px var(--sans);fill:#fff;text-anchor:middle}
.ic-rama .r-et{font:600 13px var(--sans);fill:var(--tinta)}
.r-base{stroke:#8a8b90;stroke-width:3;fill:none}
.r-nodo{fill:#5D7BB6}.r-nodo.yo{fill:#E8834F}.r-mini{fill:#7F9BD3}
.r-op{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200}
.r-op.o1{stroke:#3FA56B;animation:vgDibuja .9s ease .5s forwards}

.ic-rama text.o2{animation:icAparece .4s ease 2.6s forwards}
.ic-rama circle.o3,.ic-rama text.o3{animation:icAparece .4s ease 3.9s forwards}
/* cómo te fue */

.ic-preg{margin:0 0 2px;font:700 16px var(--display)}
.ic-op{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:11px;background:var(--sup2);border:1.5px solid var(--linea);font:600 14px var(--sans);position:relative}

@keyframes icPuntoCasi{to{background:#E8834F;border-color:#E8834F}}

/* registro */
.ic-linea-t{display:flex;align-items:center;gap:0;padding:14px 4px;position:relative}

/* =====================================================================
   MOTOR — decide en qué está cada alumno y qué le conviene hacer
   ===================================================================== */
const COLS = ['min', 'esp', 'ideal'];
/* Link ?llamada: solo los primeros dos videos (arpegios base) y la animación de cuerdas, con el doc de Previa técnica */
const PASOS_LLAMADA = ['p2', 'p3', 'p3c', 'p4', 'llt1', 'llfin', 'llt2'];
if (!new URLSearchParams(location.search).has('llamada')) PROGRAMA.pasos = PROGRAMA.pasos.filter(p => !p.soloLlamada);
if (new URLSearchParams(location.search).has('llamada')) {
  PROGRAMA.pasos = PROGRAMA.pasos.filter(p => PASOS_LLAMADA.includes(p.id));
  for (const k in PROGRAMA.esperado) for (const c of COLS) if (PROGRAMA.esperado[k][c]) PROGRAMA.esperado[k][c] = PROGRAMA.esperado[k][c].filter(id => PASOS_LLAMADA.includes(id));
}
const ORDEN = PROGRAMA.pasos.map(p => p.id);
const PASO = Object.fromEntries(PROGRAMA.pasos.map(p => [p.id, p]));
const MAX_K = PROGRAMA.clases + 1; // 5 = módulo 2

function requeridos(k, col) {
  const s = new Set();
  for (let j = 1; j <= Math.min(k, MAX_K); j++) {
    for (let c = 0; c <= col; c++) (PROGRAMA.esperado[j]?.[COLS[c]] || []).forEach(id => s.add(id));
  }
  return ORDEN.filter(id => s.has(id));
}

/* Módulos: 0 = antes de la clase 1, 1 = enlaces/anticipaciones/superposiciones, 2 = ADN del Jazz,
   3 = entrenamiento rítmico, 4 = Curva del Solo.
   st.modulos guarda los habilitados ('0', '01', '012'). Vacío = alumno de antes: todo habilitado. */
const MODULO_DE = { pre: 0, enlaces: 1, antic: 1, super: 1, m2: 2, ritmo: 3, curva: 4 };
const MODULOS = [
  { n: 0, titulo: 'Módulo 0', sub: 'Antes de la primera clase', nombre: 'Antes de la primera clase', color: '#E883AE' },
  { n: 1, titulo: 'Módulo 1', sub: 'Enlaces, anticipaciones y superposiciones', nombre: 'Cambios de acorde', color: '#5D7BB6' },
  { n: 2, titulo: 'Módulo 2', sub: 'ADN del Jazz', nombre: 'ADN del Jazz', color: '#5BC8D9' },
  { n: 3, titulo: 'Módulo 3', sub: 'Entrenamiento rítmico', nombre: 'Entrenamiento rítmico', color: '#5BD49A' },
  { n: 4, titulo: 'Módulo 4', sub: 'Curva del Solo', nombre: 'Curva del Solo', color: '#C7A6F2' },
];
const sinModulos = st => st.modulos === undefined || st.modulos === null || st.modulos === '';
// En la vista de prueba del panel se ve todo abierto
const moduloHabilitado = (st, n) => (typeof modo !== 'undefined' && modo === 'admin-prueba' && !(typeof esLlamada !== 'undefined' && esLlamada)) || sinModulos(st) || String(st.modulos).includes(String(n));
const pasoHabilitado = (st, id) => moduloHabilitado(st, MODULO_DE[PASO[id].etapa]);

const hecho = (st, id) => !!(st.prog[id] && st.prog[id].hecho && st.prog[id].como !== 'cuesta');
const tocado = (st, id) => !!(st.prog[id] && st.prog[id].hecho);

function diasDesde(fecha) {
  if (!fecha) return 0;
  const d0 = new Date(fecha + 'T12:00:00');
  const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
  return Math.max(0, Math.round((hoy - d0) / 86400000));
}
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function estado(st) {
  const col = clamp((st.nivel || 2) - 1, 0, 2);
  const k = Math.min((st.clase || 0) + 1, MAX_K);
  const R = requeridos(k, col).filter(id => pasoHabilitado(st, id));
  const faltan = R.filter(id => !hecho(st, id));
  // Avance medido sobre lo nuevo de esta clase más lo que haya quedado pendiente de antes.
  // Algo tildado como "me cuesta" cuenta como medio paso.
  const previos = new Set(requeridos(k - 1, col).filter(id => pasoHabilitado(st, id)));
  const foco = R.filter(id => !previos.has(id) || !hecho(st, id));
  const peso = id => hecho(st, id) ? 1 : tocado(st, id) ? 0.5 : 0;
  const frac = foco.length ? foco.reduce((s, id) => s + peso(id), 0) / foco.length : 1;
  const pre = k === 1;
  const d = diasDesde(pre ? st.inicio : (st.claseFecha || st.inicio));
  // Cuánto se espera tener hecho a esta altura (0 a 1).
  // Pre-sincrónico: libre los 2 primeros días, completo al día 10.
  // Entre clases: libre el primer día, completo al día 6.
  const esperadoAhora = pre ? clamp((d - 2) / 8, 0, 1) : clamp((d - 1) / 5, 0, 1);
  let tipo;
  if (k === MAX_K && faltan.length === 0) tipo = 'm2';
  else if (st.pausa) tipo = 'pausa';
  else if (faltan.length === 0) {
    const idealOk = requeridos(k, 2).every(id => hecho(st, id));
    tipo = (col < 2 && idealOk) || (k < MAX_K && requeridos(k + 1, col).some(id => hecho(st, id) && !R.includes(id))) ? 'adelantado' : 'bien';
  } else if (frac + 0.15 < esperadoAhora || esperadoAhora >= 1) tipo = 'meterle';
  else tipo = 'bien';
  return { k, col, R, faltan, frac, d, esperadoAhora, tipo, pre };
}

/* Recomendaciones: el primero es el recomendado, el resto son alternativas */
function recomendaciones(st, n = 3) {
  const e = estado(st);
  const out = []; const ya = new Set();
  const push = (id, motivo) => { if (!ya.has(id) && PASO[id] && pasoHabilitado(st, id)) { ya.add(id); out.push({ id, motivo }); } };
  e.R.filter(id => st.prog[id]?.como === 'cuesta').forEach(id => push(id, 'seguir'));
  e.faltan.forEach(id => push(id, 'falta'));
  if (out.length < n) requeridos(e.k, 2).filter(id => !hecho(st, id)).forEach(id => push(id, 'extra'));
  if (out.length < n && e.k < MAX_K) requeridos(e.k + 1, e.col).filter(id => !hecho(st, id)).forEach(id => push(id, 'extra'));
  if (out.length < n) ORDEN.filter(id => !hecho(st, id) && !PASO[id].opcional).forEach(id => push(id, 'extra'));
  return { e, lista: out.slice(0, n) };
}

/* Posición en el mapa: 0 = inicio, 1..4 = listo para la clase N, 5 = módulo 2 */
function posicion(st) {
  const col = clamp((st.nivel || 2) - 1, 0, 2);
  let base = 0;
  for (let i = 1; i <= MAX_K; i++) {
    if (requeridos(i, col).every(id => hecho(st, id))) base = i; else break;
  }
  if (base >= MAX_K) return MAX_K;
  const prev = new Set(requeridos(base, col));
  const sig = requeridos(base + 1, col).filter(id => !prev.has(id));
  const f = sig.length ? sig.filter(id => hecho(st, id)).length / sig.length : 0;
  return base + f * 0.85;
}

/* Mensaje de WhatsApp en el estilo de Andy */
/* Mensaje corto para WhatsApp: (si viene de un video) lugar para la devolución + solo el paso que sigue */
function mensajeWhatsApp(st, link, pasoVideo) {
  const { e, lista } = recomendaciones(st, 3);
  const nombre = (st.nombre || '').split(' ')[0];
  const limpio = t => String(t || '').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1: $2')
    .replace(/^# (.+)$/gm, '*$1*').replace(/\*\*(.+?)\*\*/g, '*$1*');   // al estilo WhatsApp
  let txt = pasoVideo && PASO[pasoVideo] ? `${nombre}! Ya vi tu video de «${PASO[pasoVideo].titulo}».\n\n\n\n` : `${nombre}! `;
  const extra = (st.extras || []).find(x => !x.hecho);
  const r = lista.find(x => x.id !== pasoVideo || x.motivo === 'seguir');
  if (extra) txt += `Lo que sigue: ${extra.titulo}${extra.detalle ? '\n' + extra.detalle : ''}`;
  else if (r) {
    const p = PASO[r.id];
    txt += `${r.motivo === 'seguir' ? 'Seguimos con' : 'Lo que sigue'}: ${p.titulo}\n${limpio(p.detalle)}`;
    if (p.entrega) txt += `\n\nCuando lo tengas, mandame ${p.envia || 'el ' + p.entrega} ${p.entrega === 'audio' ? '🎧' : '📹'}`;
  } else txt += e.k >= MAX_K ? 'Ya tenés todo lo del módulo 1 🙌' : `Ya tenés todo lo que hace falta para la clase ${e.k} 🙌`;
  if (st.nota) txt += '\n\n' + st.nota;
  if (link) txt += `\n\nEn el aula tenés el paso con el video: ${link}`;
  return txt;
}

if (typeof module !== 'undefined' && typeof window === 'undefined') module.exports = { requeridos, estado, recomendaciones, posicion, mensajeWhatsApp, PROGRAMA };

/* ---------- API ---------- */
async function llamar(accion, datos) {
  if (!API_URL) return demo(accion, datos);
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion, ...datos }) });
  } catch (e) { throw new Error('No hay conexión. Revisá internet y volvé a intentar.'); }
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

const tokenDemo = () => Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
function demo(accion, d) {
  const db = leerDemo();
  db.sesiones = db.sesiones || {};
  const por = (campo, v) => db.alumnos.find(a => v && String(a[campo] || '') === String(v).trim().toLowerCase());
  const publico = (a, panel) => { const c = JSON.parse(JSON.stringify(a)); delete c.clave; delete c.invitacion; if (panel) { c.tieneClave = !!a.clave; c.invitacionPendiente = !!a.invitacion; } return c; };
  const deSesion = t => { const a = por('codigo', db.sesiones[t]); if (!a) throw new Error('Tu sesión se cerró. Volvé a entrar con tu email y contraseña.'); return a; };
  const sesion = a => { const t = tokenDemo(); db.sesiones[t] = a.codigo; escribirDemo(); return t; };
  switch (accion) {
    case 'auth.invitacion': { const a = db.alumnos.find(x => x.invitacion && x.invitacion === d.invitacion); if (!a) throw new Error('Este link ya se usó o no es válido. Pedime uno nuevo por WhatsApp.'); return { nombre: a.nombre, email: a.email }; }
    case 'auth.crearClave': {
      const a = db.alumnos.find(x => x.invitacion && x.invitacion === d.invitacion); if (!a) throw new Error('Este link ya se usó o no es válido. Pedime uno nuevo por WhatsApp.');
      if (!d.clave || d.clave.length < 6) throw new Error('La contraseña tiene que tener al menos 6 caracteres.');
      a.clave = d.clave; a.invitacion = ''; return { token: sesion(a), alumno: publico(a) };
    }
    case 'auth.registrar': {
      if (!db.registro || d.registro !== db.registro) throw new Error('Este link ya no funciona. Pedime uno nuevo por WhatsApp.');
      const email = String(d.email || '').trim().toLowerCase();
      if (por('email', email)) throw new Error('Ya hay una cuenta con ese email. Entrá con tu contraseña, o escribime por WhatsApp si no te acordás.');
      if (!d.clave || d.clave.length < 6) throw new Error('La contraseña tiene que tener al menos 6 caracteres.');
      const al = alumnoVacio(String(d.nombre).trim(), 2, hoyISO()); al.codigo = codigoNuevo(al.nombre); al.email = email; al.clave = d.clave; al.modulos = '0'; al.ajustar = '1';
      db.alumnos.push(al); escribirDemo(); return { token: sesion(al), alumno: publico(al) };
    }
    case 'admin.registro': { if (!db.registro || d.nuevo) db.registro = tokenDemo().slice(0, 12); escribirDemo(); return { registro: db.registro }; }
    case 'auth.entrar': { const a = por('email', String(d.email || '').toLowerCase()); if (!a || !a.clave || a.clave !== d.clave) throw new Error('El email o la contraseña no coinciden.'); return { token: sesion(a), alumno: publico(a) }; }
    case 'auth.salir': delete db.sesiones[d.token]; escribirDemo(); return { ok: true };
    case 'alumno.get': return { alumno: publico(deSesion(d.token)) };
    case 'alumno.guardar': {
      const a = deSesion(d.token);
      ['prog', 'probs', 'clase', 'claseFecha', 'standard'].forEach(k => { if (k in d.cambios) a[k] = d.cambios[k]; });
      if (d.cambios.extras) a.extras = a.extras.map(x => ({ ...x, hecho: !!(d.cambios.extras.find(y => y.id === x.id) || {}).hecho }));
      a.act = hoyISO(); escribirDemo(); return { ok: true };
    }
    case 'admin.lista': return { alumnos: db.alumnos.map(a => publico(a, true)) };
    case 'admin.crear': {
      const al = d.alumno; al.email = String(al.email || '').trim().toLowerCase();
      if (al.email && por('email', al.email)) throw new Error('Ya hay un alumno con ese email');
      al.invitacion = tokenDemo(); db.alumnos.push(al); escribirDemo(); return { alumno: publico(al, true), invitacion: al.invitacion };
    }
    case 'admin.guardar': {
      const i = db.alumnos.findIndex(a => a.codigo === d.alumno.codigo); if (i < 0) throw new Error('No existe ese alumno');
      const priv = { clave: db.alumnos[i].clave, invitacion: db.alumnos[i].invitacion };
      db.alumnos[i] = Object.assign({}, d.alumno, priv); delete db.alumnos[i].tieneClave; delete db.alumnos[i].invitacionPendiente;
      escribirDemo(); return { ok: true };
    }
    case 'admin.invitar': { const a = por('codigo', d.codigo); a.invitacion = tokenDemo(); escribirDemo(); return { invitacion: a.invitacion }; }
    case 'admin.borrar': { db.alumnos = db.alumnos.filter(a => a.codigo !== d.codigo); escribirDemo(); return { ok: true }; }
    case 'demo.reset': { memoria = semillaDemo(); escribirDemo(); return { ok: true }; }
  }
  throw new Error('Acción desconocida');
}

/* ---------- El camino dibujado ---------- */
function dibujarCamino() {
  const cam = $('#camino'); if (!cam) return;
  const svg = cam.querySelector('.trazo');
  const base = cam.getBoundingClientRect(), z = cam.currentCSSZoom || 1;   // en la llamada la vista va con zoom en la compu
  // los títulos de grupo van alineados con el título del paso que sigue, así no quedan encima de la línea
  cam.querySelectorAll('.grupo-label').forEach(g => { let n = g.nextElementSibling; while (n && !n.querySelector('.nodo-tit')) n = n.nextElementSibling; const t = n && n.querySelector('.nodo-tit'); if (!t) return; g.style.marginLeft = '0px'; const dx = (t.getBoundingClientRect().left - g.getBoundingClientRect().left) / z; g.style.marginLeft = Math.max(0, dx) + 'px'; });
  const centro = el => { const r = el.getBoundingClientRect(); return [(r.left - base.left + r.width / 2) / z, (r.top - base.top + r.height / 2) / z]; };
  const puntos = [...cam.querySelectorAll('.punto')].map(centro);
  const meta = cam.querySelector('.meta span'); if (meta) puntos.push(centro(meta));
  svg.setAttribute('width', cam.clientWidth); svg.setAttribute('height', cam.scrollHeight);
  const camino = pts => pts.map((p, i) => { if (!i) return `M ${p[0]} ${p[1]}`; const a = pts[i - 1], dy = (p[1] - a[1]) / 2; return `C ${a[0]} ${a[1] + dy}, ${p[0]} ${p[1] - dy}, ${p[0]} ${p[1]}`; }).join(' ');
  svg.querySelector('.trazo-base').setAttribute('d', camino(puntos));
  const idx = [...cam.querySelectorAll('.nodo')].findIndex(n => n.classList.contains('abierto'));
  svg.querySelector('.trazo-hecho').setAttribute('d', idx > 0 ? camino(puntos.slice(0, idx + 1)) : '');
}
window.addEventListener('resize', () => requestAnimationFrame(dibujarCamino));

/* Líneas naranjas de fondo: 3 trazos gruesos de un solo color que cruzan toda la pantalla

   las tarjetas abiertas quedan por encima. Se curvan un poco con el scroll. */
const LINEAS = [

      g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.col; g.globalAlpha = Math.max(0, 1 - f / 110); g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); });
    if (++f < 110) requestAnimationFrame(paso); else c.remove();
  })();
}

/* ================= Grabar y mandar videos (como en WhatsApp) ================= */
// Se graba liviano (≈2 Mbps, unos 15 MB por minuto) y sin reducción de ruido, para que la guitarra suene natural.
// Al tocar «Mandar», el grabador se cierra y el video se sube solo mientras el alumno sigue usando el aula.
// El video queda guardado en el celu hasta que termina de subir: si se cierra el aula o se corta la señal, sigue la próxima vez.
const GRAB = { maxSeg: 300, vbps: 2000000, abps: 128000 };
let gr = null;   // estado del grabador abierto

function tipoGrabacion() {
  if (typeof MediaRecorder === 'undefined') return '';
  return ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
    .find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } }) || '';
}

function abrirGrabador(pasoId, archivo) {
  cerrarGrabador();
  const p = PASO[pasoId];
  const el = document.createElement('div');
  el.className = 'grabador'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Grabar video');
  el.innerHTML = `<video class="gr-vivo" playsinline autoplay muted></video><video class="gr-ver" playsinline hidden></video>
    <div class="gr-cab"><button class="gr-x" data-gr="cerrar" aria-label="Cerrar">${ICONO.cruz}</button>
      <div class="gr-tit"><small>Tu video</small><strong>${esc(p.titulo)}</strong></div><span class="gr-reloj" hidden>0:00</span></div>
    <p class="gr-msg" hidden></p>
    <div class="gr-pie"></div>`;
  document.body.appendChild(el); document.body.classList.add('con-grabador');
  gr = { el, pasoId, cam: 'user', stream: null, rec: null, partes: [], blob: null, seg: 0, t0: 0, timer: null };
  el.onclick = ev => { const b = ev.target.closest('[data-gr]'); if (b) accionGrabador(b.dataset.gr); };
  if (archivo) { gr.blob = archivo; mostrarRevision(true); }
  else prenderCamara();
}

function piesGrabador(html) { gr.el.querySelector('.gr-pie').innerHTML = html; }
function msgGrabador(t) { const m = gr.el.querySelector('.gr-msg'); m.hidden = !t; m.textContent = t || ''; }

async function prenderCamara() {
  apagarCamara(); msgGrabador('');
  gr.el.classList.remove('revisando');
  if (!navigator.mediaDevices?.getUserMedia || !tipoGrabacion()) {
    msgGrabador('Este navegador no deja grabar desde la página. Usá «Subir uno que ya tengo» o mandalo por WhatsApp.');
    piesGrabador(''); return;
  }
  try {
    gr.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: gr.cam, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: { ideal: 2 } },
    });
  } catch (e) {
    msgGrabador('No pude usar la cámara. Fijate de darle permiso a la página para usar la cámara y el micrófono, y volvé a intentar.');
    piesGrabador(`<button class="gr-texto" data-gr="reintentar">Volver a intentar</button>`); return;
  }
  if (!gr) { apagarCamara(); return; }
  const v = gr.el.querySelector('.gr-vivo');
  v.srcObject = gr.stream; v.hidden = false; v.classList.toggle('espejo', gr.cam === 'user');
  const ver = gr.el.querySelector('.gr-ver'); ver.pause(); ver.hidden = true;
  piesGrabador(`<span class="gr-lado"></span><button class="gr-rec" data-gr="grabar" aria-label="Empezar a grabar"><i></i></button>
    <button class="gr-lado gr-redondo" data-gr="girar" aria-label="Cambiar de cámara">${ICONO.girar}</button>`);
}
function apagarCamara() { if (gr?.stream) gr.stream.getTracks().forEach(t => t.stop()); if (gr) gr.stream = null; }

function empezarGrabacion() {
  const tipo = tipoGrabacion();
  try { gr.rec = new MediaRecorder(gr.stream, { mimeType: tipo, videoBitsPerSecond: GRAB.vbps, audioBitsPerSecond: GRAB.abps }); }
  catch (e) { gr.rec = new MediaRecorder(gr.stream); }
  gr.partes = [];
  gr.rec.ondataavailable = ev => { if (ev.data && ev.data.size) gr.partes.push(ev.data); };
  gr.rec.onstop = () => {
    if (!gr) return;
    gr.blob = new Blob(gr.partes, { type: (gr.rec.mimeType || tipo || 'video/mp4').split(';')[0] });
    gr.seg = (Date.now() - gr.t0) / 1000;
    apagarCamara(); mostrarRevision();
  };
  gr.rec.start(1000); gr.t0 = Date.now();
  gr.el.classList.add('grabando');
  const reloj = gr.el.querySelector('.gr-reloj'); reloj.hidden = false; reloj.textContent = '0:00';
  gr.timer = setInterval(() => {
    const s = (Date.now() - gr.t0) / 1000; reloj.textContent = duracion(s);
    if (s >= GRAB.maxSeg) pararGrabacion();
  }, 250);
  piesGrabador(`<span class="gr-lado"></span><button class="gr-rec grabando" data-gr="parar" aria-label="Terminar"><i></i></button><span class="gr-lado"></span>`);
}
function pararGrabacion() {
  clearInterval(gr.timer); gr.el.classList.remove('grabando'); gr.el.querySelector('.gr-reloj').hidden = true;
  if (gr.rec?.state === 'recording') gr.rec.stop();
}

function mostrarRevision(deGaleria) {
  gr.el.classList.add('revisando');
  const v = gr.el.querySelector('.gr-ver');
  gr.el.querySelector('.gr-vivo').hidden = true;
  if (gr.url) URL.revokeObjectURL(gr.url);
  gr.url = URL.createObjectURL(gr.blob); v.src = gr.url; v.hidden = false; v.controls = true;
  v.onloadedmetadata = () => { if (isFinite(v.duration)) gr.seg = v.duration; };
  const mb = gr.blob.size / 1048576;
  msgGrabador(mb > 380 ? 'Este video es muy pesado para mandarlo desde acá. Mandámelo por WhatsApp.' : '');
  piesGrabador(`<button class="gr-texto" data-gr="${deGaleria ? 'cerrar' : 'otra'}">${deGaleria ? 'Cancelar' : 'Grabar de nuevo'}</button>
    ${mb > 380 ? '' : `<button class="gr-mandar" data-gr="enviar" aria-label="Mandar el video">${ICONO.mandar}</button>`}`);
}

function accionGrabador(a) {
  if (!gr) return;
  if (a === 'cerrar') cerrarGrabador();
  else if (a === 'reintentar') prenderCamara();
  else if (a === 'girar') { gr.cam = gr.cam === 'user' ? 'environment' : 'user'; prenderCamara(); }
  else if (a === 'grabar') empezarGrabacion();
  else if (a === 'parar') pararGrabacion();
  else if (a === 'otra') { gr.blob = null; prenderCamara(); }
  else if (a === 'enviar') mandarVideo();
}
function cerrarGrabador() {
  if (!gr) return;
  clearInterval(gr.timer); if (gr.rec?.state === 'recording') { gr.rec.onstop = null; gr.rec.stop(); }
  apagarCamara(); const v = gr.el.querySelector('.gr-ver'); if (v) v.pause();
  if (gr.url) URL.revokeObjectURL(gr.url);
  gr.el.remove(); document.body.classList.remove('con-grabador'); gr = null;
}

function pendientes(pasoId) { return COLA.filter(x => x.pasoId === pasoId && x.codigo === ST?.codigo); }

async function procesarCola() {
  if (subiendo || !COLA.length || modo !== 'alumno' || !ST) return;
  const item = COLA.find(x => x.codigo === ST.codigo); if (!item) return;
  subiendo = { item, p: 0, error: '' }; pintarSubida();

    else {
      const { url } = await llamar('video.iniciar', { token: TOKEN, paso: item.pasoId, mime: item.mime, tam: item.blob.size, origen: location.origin });
      id = await subirPorPartes(url, item.blob, p => { subiendo.p = p; pintarSubida(); });
    }
    const pr = ST.prog[item.pasoId] || (ST.prog[item.pasoId] = {});
    pr.videos = [...(pr.videos || []), { id, t: item.t, seg: item.seg }];
    pr.envio = true;
    guardarAlumno();

    subiendo = null; pintarSubida(true);
    if (abierto === item.pasoId) renderAlumno();
    setTimeout(procesarCola, 400);
  } catch (e) {
    const m = e.message || '';
    subiendo.error = /permiso|autoriz|UrlFetch/i.test(m) ? 'No se pudo mandar el video por un problema del aula. Avisame por WhatsApp.'
      : /Acción desconocida/.test(m) ? 'Todavía no se pueden mandar videos desde acá.'
      : 'Se cortó la conexión. Lo vuelvo a intentar solo.';
    pintarSubida();
    const reintentar = /cortó|conexión|conectar/i.test(subiendo.error);
    subiendo = reintentar ? null : subiendo;
    if (reintentar) setTimeout(procesarCola, 8000);
  }
}

// Guardado en el celu (IndexedDB) para retomar si se cierra el aula a mitad de la subida
function colaDB() {
  return new Promise((ok, mal) => {
    if (!window.indexedDB) return mal(new Error('sin IndexedDB'));
    const r = indexedDB.open('aulaAE', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('subidas', { keyPath: 'id' });
    r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
  });
}
async function colaGuardar(item) { try { const db = await colaDB(); db.transaction('subidas', 'readwrite').objectStore('subidas').put(item); } catch (e) {} }
async function colaBorrar(id) { try { const db = await colaDB(); db.transaction('subidas', 'readwrite').objectStore('subidas').delete(id); } catch (e) {} }
async function reanudarSubidas() {
  try {
    const db = await colaDB();
    const todos = await new Promise((ok, mal) => { const q = db.transaction('subidas').objectStore('subidas').getAll(); q.onsuccess = () => ok(q.result || []); q.onerror = () => mal(q.error); });
    todos.forEach(x => { if (!COLA.some(y => y.id === x.id)) COLA.push(x); });
  } catch (e) {}
  procesarCola();
}

// Subida en partes de 8 MB directo a Drive (si se corta la señal, se reintenta la parte que faltaba)
function subirPorPartes(url, blob, progreso) {
  const PARTE = 8 * 1024 * 1024;
  const mandar = (desde, intento) => new Promise((ok, mal) => {
    const hasta = Math.min(desde + PARTE, blob.size);
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('Content-Range', `bytes ${desde}-${hasta - 1}/${blob.size}`);
    x.upload.onprogress = ev => progreso((desde + ev.loaded) / blob.size);
    x.onload = () => {
      if (x.status === 200 || x.status === 201) { try { ok(JSON.parse(x.responseText).id); } catch (e) { ok(''); } }
      else if (x.status === 308) mandar(hasta, 0).then(ok, mal);
      else if (intento < 3) setTimeout(() => mandar(desde, intento + 1).then(ok, mal), 1500 * (intento + 1));
      else mal(new Error('Se cortó la conexión mientras subía el video.'));
    };
    x.onerror = () => intento < 3 ? setTimeout(() => mandar(desde, intento + 1).then(ok, mal), 2000 * (intento + 1)) : mal(new Error('Se cortó la conexión mientras subía el video.'));
    x.send(blob.slice(desde, hasta));
  });
  return mandar(0, 0);
}

  { id: 'lunes', titulo: 'Lunes', dia: 1, alumnos: ['antonio sanchez', 'fran', 'leonardo belli', 'ger gonzalez', 'juan manuel carrasco'] },
  { id: 'martes', titulo: 'Martes', dia: 2, alumnos: ['ignacio lessa', 'matias otero', 'fito ulrich', "beto d'alessandro", 'luis'] },
  { id: 'jueves', titulo: 'Jueves', dia: 4, alumnos: ['kelbin', 'nestor', 'juan francisco barbaro'] },

function gruposDia(filas) {

  const usados = new Set(), hoy = new Date().getDay();
  const grupos = HORARIO.map(d => {
    const fs = d.alumnos.flatMap(pat => filas.filter(f => !usados.has(f.a.codigo) && es(f.a, pat))).filter(f => { if (usados.has(f.a.codigo)) return false; usados.add(f.a.codigo); return true; });
    return { id: d.id, titulo: d.titulo, hoy: d.dia === hoy, filas: fs };

  const inact = filas.filter(f => !usados.has(f.a.codigo) && INACTIVOS.some(pat => es(f.a, pat))); inact.forEach(f => usados.add(f.a.codigo));

    if (r.clase) { const a = LISTA.find(x => x.codigo === r.clase.codigo); if (a) { delete r.clase.codigo; a.clases = [r.clase, ...(a.clases || []).filter(x => x.id !== r.clase.id)].sort((x, y) => String(y.fecha).localeCompare(String(x.fecha))); } }
    renderAdmin();
  } catch (e) { g.classList.remove('prop-yendo'); aviso(e.message, true); }
}
async function resolverProp(id, decision, b) {
  const p = PROPUESTAS.find(x => x.id === id); if (!p) return;
  const li = b && b.closest('li'); if (li) li.classList.add('prop-yendo');
  try {
    const r = await llamar('admin.propuesta', { clave: claveAdmin, id, decision });
    PROPUESTAS = PROPUESTAS.filter(x => x.id !== id); guardarLocal('mapaAE_prop', { p: PROPUESTAS, b: BORRADORES });
    if (r.alumno) { const i = LISTA.findIndex(x => x.codigo === r.alumno.codigo); if (i >= 0) { LISTA[i] = r.alumno; ORIG[r.alumno.codigo] = clonar(r.alumno); } }
    return true;
  } catch (e) { if (li) li.classList.remove('prop-yendo'); aviso(e.message, true); return false; }
}
const ICONO_ADM = {

  link: '<svg class="ico-adm" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.3 1.3"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.3-1.3"/></svg>',

};
const TOTAL_ENCUENTROS = 16;
const avModAdm = {};   // qué módulo está mirando en «Clases y avance», por alumno
function restoHTML(a) {
  const e = estado(a);
  const probs = Object.entries(a.probs || {}).flatMap(([pid, l]) => l.map(q => ({ pid, q: (PASO[pid].problemas || []).find(x => x.id === q) })).filter(x => x.q));
  const sepsMod = {};
  // módulo que se muestra en «Clases y avance»: el elegido, o el del próximo paso que le falta
  const mSel = avModAdm[a.codigo] ?? (() => { const f = PROGRAMA.pasos.find(p => !a.prog[p.id]?.hecho && !p.opcional); return f ? MODULO_DE[f.etapa] : 0; })();
  const pasosM = pasosDelModulo(mSel).filter(p => !p.soloLlamada), seps = separadoresPasos(pasosM, mSel);
  const hechos = m => { const ps = pasosDelModulo(m).filter(p => !p.soloLlamada); return [ps.filter(p => a.prog[p.id]?.hecho).length, ps.length]; };
  return `${secAdm('clases', `Clases y avance <span class="suave chico">${a.clase || 0} de ${TOTAL_ENCUENTROS} clases</span>`, `<div class="av-cab">
      <span class="contador" title="Clases que ya tuvo"><button data-clase="${Math.max(0, (a.clase || 0) - 1)}" aria-label="Una clase menos" ${a.clase > 0 ? '' : 'disabled'}>−</button><b>${a.clase || 0}<small> de ${TOTAL_ENCUENTROS} clases</small></b><button data-clase="${Math.min(TOTAL_ENCUENTROS, (a.clase || 0) + 1)}" aria-label="Una clase más" ${(a.clase || 0) < TOTAL_ENCUENTROS ? '' : 'disabled'}>+</button></span>
      <span class="nivel-chip" title="Nivel (el alumno no lo ve)"><button data-nivel="${Math.max(1, a.nivel - 1)}" aria-label="Bajar nivel" ${a.nivel > 1 ? '' : 'disabled'}>‹</button>Nivel ${a.nivel}<button data-nivel="${Math.min(3, a.nivel + 1)}" aria-label="Subir nivel" ${a.nivel < 3 ? '' : 'disabled'}>›</button></span>
    </div>
    <div class="av-tabs" role="tablist">${MODULOS.map(m => { const [h, t] = hechos(m.n); return `<button role="tab" class="av-tab ${m.n === mSel ? 'sel' : ''} ${h === t && t ? 'completo' : ''}" style="--mc:${m.color}" data-av-mod="${m.n}" aria-selected="${m.n === mSel}"><b>M${m.n}</b><small>${h}/${t}</small><i style="--p:${t ? h / t : 0}"></i></button>`; }).join('')}</div>
    <div class="av-lista" style="--mc:${MODULOS[mSel].color}">
      <div class="av-lista-cab"><span>${esc(MODULOS[mSel].nombre)}</span><button class="link suave" data-mod-tilde="${mSel}">${pasosM.every(x => a.prog[x.id]?.hecho) ? 'Desmarcar todo' : 'Marcar todo'}</button></div>
      ${pasosM.map((p, j) => { const pr = a.prog[p.id], ok = !!(pr && pr.hecho), sp = seps[j];
        return `${sp && sp.tit ? `<div class="av-grupo">${esc(sp.tit)}</div>` : sp ? '<div class="av-grupo-linea"></div>' : ''}<button class="av-paso ${ok ? 'ok como-' + (pr.como || 'listo') : ''}" data-adm-tilde="${p.id}" aria-pressed="${ok}"><i aria-hidden="true">${ok ? '✓' : ''}</i><span>${esc(p.titulo)}</span>${ok && pr.envio ? '<em title="Mandó video">🎥</em>' : ''}</button>`; }).join('')}
    </div>
    <details class="av-mas"><summary>Fechas y pausa</summary>
      <div class="aj-fila"><label>Fecha de la última clase<input type="date" data-campo="claseFecha" value="${esc(a.claseFecha || '')}"></label>
      <label>Fecha de la llamada<input type="date" data-campo="inicio" value="${esc(a.inicio || '')}"></label></div>
      <label class="check"><input type="checkbox" data-campo="pausa" ${a.pausa ? 'checked' : ''}> En pausa (sin apuro, por ejemplo si se demora el pago)</label>
    </details>`)}

  ${secAdm('acceso', 'Acceso', accesoHTML(a))}

  ${secAdm('modulos', `Acceso a módulos <span class="suave chico">${MODULOS.filter(m => moduloHabilitado(a, m.n)).map(m => m.n).join(', ')}</span>`, `<div class="modulos-adm">${MODULOS.map(m => { const on = moduloHabilitado(a, m.n); return `<button class="mod-tg ${on ? 'on' : ''}" data-modulo="${m.n}" aria-pressed="${on}">
      <span class="mod-sw" aria-hidden="true"><i></i></span><span><strong>${m.titulo}</strong><small>${m.sub}</small></span></button>`; }).join('')}</div>
    <p class="suave chico">Lo que está apagado no aparece en su aula: ve un candado con «Te lo habilito cuando llegue el momento».</p>`)}

  ${probs.length ? secAdm('probs', `Problemas que marcó <span class="suave chico">${probs.length}</span>`, `<ul class="probs-adm">${probs.map(x => `<li><span class="suave">${esc(PASO[x.pid].titulo)}:</span> ${esc(x.q.q)}</li>`).join('')}</ul>`) : ''}

  <div class="bloque links-adm">
    <button class="secundario" data-adm="ver">Ver su aula</button>
    <button class="link suave" data-adm="borrar">Borrar alumno</button>
  </div>`;
}

const linksRecientes = {};
function accesoHTML(a) {
  const link = linksRecientes[a.codigo];
  const estadoAcceso = a.tieneClave ? `Entra con <strong>${esc(a.email || 'sin email')}</strong> y su contraseña.` : `Todavía no creó su contraseña${a.email ? ` (${esc(a.email)})` : ''}.`;
  const msgInv = link ? `${a.nombre.split(' ')[0]}! Te paso el link para entrar a tu mapa de Ajuste Elástico\n\nAbrilo, elegí una contraseña y listo. Después entrás siempre con tu email y esa contraseña.\n\n${link}` : '';
  return `<div class="acceso">
    <div class="acceso-cab"><span class="suave">${estadoAcceso}</span></div>
    <label class="bloque-email">Email<input type="email" data-campo="email" value="${esc(a.email || '')}"></label>
    ${link ? `<div class="link-inv"><p class="chico">Link para ${a.tieneClave ? 'cambiar la contraseña' : 'crear la contraseña'} (sirve una sola vez):</p>
        <textarea id="msgInv" rows="5">${esc(msgInv)}</textarea>
        <span class="fila-botones"><button class="secundario" data-adm="copiar-inv">Copiar mensaje</button><a class="secundario boton" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msgInv)}">Abrir en WhatsApp</a></span></div>`
      : `<button class="secundario" data-adm="invitar">${a.tieneClave ? 'Generar link para nueva contraseña' : 'Generar link de acceso'}</button>`}

}

let timerAdm = null;
function refrescarMensaje(a) { const m = $('#revMsg'); if (m) m.innerHTML = mensajeAdmHTML(a, videoActual(a).cur?.pid || null); }
/* Guardar desde el panel: de a una tanda por vez, y lo que se toque mientras viaja la anterior no se pierde */
async function guardarCambiosAdm(codigo) {
  const a = LISTA.find(x => x.codigo === codigo); if (!a) return;
  const base = ORIG[codigo];
  if (!base) { await llamar('admin.guardar', { clave: claveAdmin, alumno: a }); ORIG[codigo] = clonar(a); return; }
  const enviado = clonar(a);
  const cambios = difAlumno(base, enviado);
  if (!Object.keys(cambios).length) return;
  try {
    const r = await llamar('admin.cambiar', { clave: claveAdmin, codigo, cambios });
    const fresco = r.alumno;
    ORIG[codigo] = clonar(fresco);
    const actual = LISTA.find(x => x.codigo === codigo); if (!actual) return;
    aplicarLocal(actual, fresco, difAlumno(enviado, actual));   // fresco del servidor + lo tocado mientras tanto
  } catch (e) {
    if (!/Acción desconocida/.test(e.message)) throw e;
    await llamar('admin.guardar', { clave: claveAdmin, alumno: a }); ORIG[codigo] = clonar(a);   // servidor viejo
  }
}
function aplicarLocal(destino, fresco, local) {
  const r = clonar(fresco);
  ['prog', 'probs'].forEach(k => { if (local[k + 'Cambios']) r[k] = aplicarPasos(r[k], local[k + 'Cambios']); delete local[k + 'Cambios']; });
  Object.keys(destino).forEach(k => delete destino[k]);
  Object.assign(destino, r, local);
}
let colaAdm = Promise.resolve();
const pendientesAdm = new Set();
function guardarAdm(a, rerender = true) {
  aviso('Guardando…');
  // Solo se redibuja la parte de abajo: el video y el mensaje que estás escribiendo no se tocan
  if (rerender) { const r = $('#detResto'); if (r) { r.innerHTML = restoHTML(a); enlazarAdmin(); } else renderAdmin(); }
  pendientesAdm.add(a.codigo);
  clearTimeout(timerAdm);
  timerAdm = setTimeout(() => {
    const cods = [...pendientesAdm]; pendientesAdm.clear();
    colaAdm = colaAdm.then(async () => {
      try { for (const c of cods) await guardarCambiosAdm(c); if (!pendientesAdm.size) aviso('Guardado'); guardarLocal('mapaAE_lista', LISTA); }
      catch (e) { aviso('No se pudo guardar: ' + e.message, true); }
    });
  }, 500);
}

function enlazarAdmin() {
  const root = app();
  const a = LISTA.find(x => x.codigo === elegido);
  if (!root._secs) { root._secs = 1; root.addEventListener('toggle', ev => { const d = ev.target; if (d.dataset && d.dataset.sec) d.open ? admAbiertas.add(d.dataset.sec) : admAbiertas.delete(d.dataset.sec); }, true); }
  const bus = $('#buscaAlumno');
  if (bus) bus.oninput = () => { buscaAdm = bus.value; const q = sinTildes(bus.value.trim()); root.querySelectorAll('[data-elegir]').forEach(tr => { tr.hidden = !!q && !tr.dataset.nombre.includes(q); });
    root.querySelectorAll('.grupo-dia').forEach(g => { const hay = [...g.querySelectorAll('[data-elegir]')].some(x => !x.hidden); if (q) { g.hidden = !hay; if (hay) g.open = true; } else g.hidden = false; }); };
  root.onclick = async ev => {
    const tr = ev.target.closest('[data-elegir]');
    if (tr) { elegido = tr.dataset.elegir; videoSel = null; renderAdmin(); window.scrollTo(0, 0); return; }
    const wa = ev.target.closest('a[data-wa]');
    if (wa && $('#msg')) { wa.href = 'https://wa.me/?text=' + encodeURIComponent($('#msg').value); return; }
    const b = ev.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.adm === 'prueba') { reiniciarPrueba(); return; }
    if (d.prop) { b.disabled = true; if (await resolverProp(d.prop, d.decision, b)) renderAdmin(); else b.disabled = false; return; }
    if (d.publicar) { resolverBorrador(d.publicar, 'publicar', b); return; }
    if (d.noPublicar) { resolverBorrador(d.noPublicar, 'descartar', b); return; }
    if (d.abrirVideo) { const [cod, v] = d.abrirVideo.split('|'); elegido = cod; videoSel = v; renderAdmin(); window.scrollTo(0, 0); return; }
    if (d.videoSel && a) { videoSel = d.videoSel; $('#revision').innerHTML = revisionHTML(a); return; }
    if (d.adm === 'volver') { elegido = null; videoSel = null; renderAdmin(); window.scrollTo(0, 0); return; }
    if (d.adm === 'actualizar') { b.textContent = 'Actualizando…'; abrirAdmin(); return; }
    if (d.adm === 'visto' && a) {
      const { cur } = videoActual(a); if (!cur) return;
      cur.v.visto = true;
      const sig = todosLosVideos(a).find(x => !x.v.visto);
      if (sig) videoSel = `${sig.pid}:${sig.i}`; else videoSel = `${cur.pid}:${cur.i}`;
      $('#revision').innerHTML = revisionHTML(a);
      guardarAdm(a, false); return;
    }
    if (d.adm === 'nuevo') { elegido = '__nuevo'; renderAdmin(); }
    else if (d.adm === 'copiar') copiar($('#msg').value, b, 'Copiado');
    else if (d.adm === 'copiar-inv') copiar($('#msgInv').value, b, 'Copiado');
    else if (d.adm === 'copiar-reg') copiar($('#msgReg').value, b, 'Copiado');
    else if (d.adm === 'copiar-link') copiar(linkReg, b, 'Copiado');
    else if (d.adm === 'ver-registro' || d.adm === 'nuevo-registro') {
      if (d.adm === 'nuevo-registro' && !b.dataset.seguro) { b.dataset.seguro = '1'; b.textContent = 'Tocá de nuevo: el link de ahora deja de andar'; return; }
      b.disabled = true; b.textContent = 'Un momento…';
      const mods = [...document.querySelectorAll('[data-reg-mod]')].filter(x => x.checked).map(x => x.dataset.regMod).join('');
      if (!mods) { aviso('Elegí al menos un módulo.', true); b.disabled = false; b.textContent = 'Armar el link'; return; }
      try { const r = await llamar('admin.registro', { clave: claveAdmin, nuevo: d.adm === 'nuevo-registro', mods });
        if (mods !== '0' && r.mods !== mods) throw new Error('Para elegir los módulos del link falta actualizar el servidor en Apps Script.');
        modsReg = mods; linkReg = linkRegistro(r.registro); renderAdmin(); if (d.adm === 'nuevo-registro') aviso('Listo: link nuevo. El anterior ya no funciona.'); }
      catch (e) { aviso(/Acción desconocida/.test(e.message) ? 'Falta actualizar el servidor en Apps Script.' : e.message, true); b.disabled = false; b.textContent = 'Armar el link'; }
    }
    else if (d.adm === 'ajustado' && a) { a.ajustar = ''; guardarAdm(a); $('.aviso-ajustar')?.remove(); }
    else if (d.adm === 'invitar') {
      try { const r = await llamar('admin.invitar', { clave: claveAdmin, codigo: a.codigo }); linksRecientes[a.codigo] = linkInvitacion(r.invitacion); a.invitacionPendiente = true; renderAdmin(); }
      catch (e) { aviso(e.message, true); }
    }
    else if (d.adm === 'ver') { ST = JSON.parse(JSON.stringify(a)); stIntacto = true; modo = 'admin-vista'; abierto = null; renderAlumno(true); window.scrollTo(0, 0); }
    else if (d.adm === 'borrar') {
      if (b.dataset.seguro) { await llamar('admin.borrar', { clave: claveAdmin, codigo: a.codigo }); LISTA = LISTA.filter(x => x !== a); elegido = null; videoSel = null; renderAdmin(); }
      else { b.dataset.seguro = '1'; b.textContent = 'Tocá de nuevo para borrar'; }
    }
    else if (d.nivel) { a.nivel = +d.nivel; guardarAdm(a); }
    else if (d.modulo !== undefined) {
      const hab = new Set(MODULOS.filter(m => moduloHabilitado(a, m.n)).map(m => m.n));
      hab.has(+d.modulo) ? hab.delete(+d.modulo) : hab.add(+d.modulo);
      a.modulos = [...hab].sort().join('') || '-';   // '-' = ninguno habilitado
      guardarAdm(a); refrescarMensaje(a);
    }
    else if (d.clase) { a.clase = +d.clase; if (a.clase > 0 && !a.claseFecha) a.claseFecha = hoyISO(); guardarAdm(a); }
    else if (d.avMod !== undefined && a) { avModAdm[a.codigo] = +d.avMod; $('#detResto').innerHTML = restoHTML(a); }
    else if (d.modTilde !== undefined && a) { marcarModulo(a.prog, +d.modTilde); guardarAdm(a); }
    else if (d.extraTilde) { const x = (a.extras || []).find(y => y.id === d.extraTilde); if (x) { x.hecho = !x.hecho; guardarAdm(a); refrescarMensaje(a); } }
    else if (d.quitar) { a.extras = a.extras.filter(x => x.id !== d.quitar); guardarAdm(a); refrescarMensaje(a); }
    else if (d.admTilde) {
      const id = d.admTilde, pr = a.prog[id];
      if (pr && pr.hecho) { if (pr.videos && pr.videos.length) pr.hecho = false; else delete a.prog[id]; }   // los videos que mandó no se pierden
      else a.prog[id] = Object.assign(pr || {}, { hecho: true, como: (pr && pr.como) || 'listo', t: hoyISO() });
      guardarAdm(a);
    }
    else if (d.accion === 'salir') salir();
  };
  root.onchange = ev => {
    // cambiar los módulos del link de alumnos nuevos: hay que volver a armarlo
    if (ev.target.dataset.regMod !== undefined) { modsReg = [...document.querySelectorAll('[data-reg-mod]')].filter(x => x.checked).map(x => x.dataset.regMod).join(''); if (linkReg) { linkReg = ''; renderAdmin(); } return; }
    const c = ev.target.dataset.campo; if (!c || !a) return;
    a[c] = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value;
    if (c === 'email') a.email = a.email.trim().toLowerCase();
    guardarAdm(a, c !== 'nota' && c !== 'email');
  };
  const fn = $('#formNuevo');
  if (fn) fn.onsubmit = async ev => {
    ev.preventDefault(); const f = new FormData(fn);
    const nuevo = alumnoVacio(f.get('nombre').trim(), +f.get('nivel'), f.get('inicio'));
    const hechos = f.getAll('paso');
    hechos.forEach(id => { nuevo.prog[id] = { hecho: true, como: 'listo', t: hoyISO() }; });
    // Arrancan con el módulo 0, más los módulos donde ya tienen algo hecho
    nuevo.modulos = [...new Set([0, ...hechos.map(id => MODULO_DE[PASO[id].etapa])])].sort().join('');
    nuevo.email = String(f.get('email') || '').trim().toLowerCase();
    nuevo.codigo = codigoNuevo(nuevo.nombre);
    try {
      const r = await llamar('admin.crear', { clave: claveAdmin, alumno: nuevo });
      LISTA.push(r.alumno); elegido = nuevo.codigo; videoSel = null; linksRecientes[nuevo.codigo] = linkInvitacion(r.invitacion); renderAdmin();
    } catch (e) { aviso(e.message, true); }
  };
  if (fn) fn.onchange = ev => {
    const t = ev.target;
    if (t.dataset.nmod !== undefined) fn.querySelectorAll(`[data-nmod-de="${t.dataset.nmod}"]`).forEach(x => { x.checked = t.checked; });
    else if (t.dataset.nmodDe !== undefined) { const g = [...fn.querySelectorAll(`[data-nmod-de="${t.dataset.nmodDe}"]`)]; fn.querySelector(`[data-nmod="${t.dataset.nmodDe}"]`).checked = g.every(x => x.checked); }
  };
  const fe = $('#formExtra');
  if (fe) fe.onsubmit = ev => {
    ev.preventDefault(); const f = new FormData(fe);
    a.extras = a.extras || []; a.extras.push({ id: 'x' + Date.now().toString(36), titulo: f.get('titulo').trim(), detalle: f.get('detalle').trim(), hecho: false });
    guardarAdm(a); refrescarMensaje(a);
  };
}

async function copiar(txt, boton, ok) {
  try { await navigator.clipboard.writeText(txt); }
  catch (e) { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (_) {} t.remove(); }
  const prev = boton.textContent; boton.textContent = ok; setTimeout(() => (boton.textContent = prev), 1500);
}

/* ---------------- Arranque ---------------- */
let anchoPrevio = window.innerWidth;
window.addEventListener('resize', () => {
  if ((anchoPrevio < 600) !== (window.innerWidth < 600) && ST && modo !== 'admin') renderAlumno();
  anchoPrevio = window.innerWidth;
});

(function inicio() {
  // La app instalada abre la dirección pelada: si en este aparato está la clave del panel y no hay alumno, vuelve al panel
  // link de la llamada: si ya había entrado al aula en este aparato, vuelve al paso donde quedó (no a la presentación)
  if (esLlamada && !params.has('aula')) {
    let ya = null, paso = null; try { ya = localStorage.getItem('mapaAE_llamada_aula'); paso = localStorage.getItem('mapaAE_llamada_paso'); } catch (e) {}
    if (ya) { DESTINO = { prueba: true, paso: paso || null }; nav('?llamada&aula'); aplicarDestino(); return; }
    renderLlamada(); return;
  }
  if (esDemo) { DESTINO = { prueba: true, paso: params.get('paso') }; aplicarDestino(); return; }
  if (!location.search && !TOKEN && claveAdmin) { let u = '?admin'; try { u = localStorage.getItem('mapaAE_ultimoAdmin') || u; } catch (e) {} location.replace(location.pathname + u); return; }
  if (params.has('admin')) { claveAdmin ? abrirAdmin() : pedirClave(); return; }
  if (params.get('invitacion')) { renderInvitacion(params.get('invitacion')); return; }
  if (params.get('registro')) { renderRegistro(params.get('registro')); return; }
  TOKEN ? entrarConSesion() : renderEntrada();
})();
