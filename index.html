<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula de Ajuste Elástico</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ajuste Elástico">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111214">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Tema oscuro, en la línea del Área de Miembros, con los colores de Ajuste Elástico */
  --fondo:#111214; --sup:#1B1C20; --sup2:#24262B; --linea:#2E3036;
  --tinta:#EDEEF0; --gris:#9DA2AC; --blanco:#FFFFFF;
  --azul:#5D7BB6; --azul-txt:#A9BEE8; --azul-osc:#3A4F7A; --azul-claro:#22304A; --azul-velo:#1A2232;
  --oxido:#E2643A; --oxido-txt:#F29A78; --oxido-claro:#3A2219; --naranja:#E8834F; --naranja-claro:#33241B;
  --papel:var(--fondo);
  --radio-s:6px; --radio-m:12px;
  --sans:'Source Sans 3', system-ui, sans-serif; --display:'Poppins', system-ui, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);color-scheme:dark;font:400 17px/1.55 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul-txt);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--naranja);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;margin:0;letter-spacing:-.01em}
.suave{color:var(--gris)} .chico{font-size:14px}
.link{color:var(--azul-txt);text-decoration:underline;text-underline-offset:3px}
.link.suave{color:var(--gris)}
.primario{background:#FFFFFF;color:#111214;padding:11px 22px;border-radius:8px;font-weight:600}
.primario:hover{background:#E4E5E8}
.secundario,.boton{display:inline-block;border:1px solid #4A4D55;color:var(--tinta);padding:8px 16px;border-radius:8px;font-weight:600;text-decoration:none;background:var(--sup2);font-size:15px}
.secundario:hover,.boton:hover{background:var(--azul-velo)}

/* Barra */
.barra{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:var(--fondo);border-bottom:1px solid var(--linea)}
.marca svg{height:64px;width:auto;display:block}
.barra-der{display:flex;gap:14px;align-items:center;font-size:15px}
.quien{font-weight:600}
.firma{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.02em;color:#3A4F7A;white-space:nowrap}
.salir-pie{margin:26px 0 8px;text-align:center;font-size:14px;color:var(--gris)}
.registro-adm{margin:18px 0 26px;padding:16px 18px;border:1px solid var(--linea);border-radius:var(--radio-m);background:var(--sup)}
.registro-adm .reg-cab{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.registro-adm h2{font-size:18px}
.registro-adm p{margin:4px 0 0;max-width:62ch}
.registro-adm textarea{width:100%;margin:12px 0 10px}
.registro-adm .reg-mods{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.registro-adm .reg-mod{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--linea);border-left:4px solid var(--c);border-radius:10px;cursor:pointer}
.registro-adm .reg-mod span{display:flex;flex-direction:column;font-weight:700;font-size:14px}
.registro-adm .reg-mod small{font-weight:400;opacity:.7;font-size:12px}
.registro-adm .reg-para{margin:6px 0 0}
.marca-ajustar{display:block;font-size:13px;color:var(--azul-txt);font-weight:600}
.aviso-ajustar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:10px 0 14px;padding:12px 14px;border:1.5px solid var(--azul);border-radius:var(--radio-s);background:var(--azul-velo)}
.aviso-ajustar p{margin:0}
@media (max-width:600px){.firma{font-size:14px}.registro-adm .reg-cab,.aviso-ajustar{flex-direction:column;align-items:stretch}}

/* Entrada */
.entrada{max-width:460px;margin:8vh auto 60px;padding:0 20px}
.entrada h1{font-size:30px;margin-bottom:10px}
.entrada form{display:grid;gap:10px;margin:26px 0}
.entrada label{font-weight:600}
.entrada input{padding:12px 14px;border:1.5px solid var(--linea);border-radius:var(--radio-s);background:var(--sup);font-size:18px}
.entrada .primario{justify-self:start}
.error{color:var(--oxido-txt);margin:0}
.demo{border-left:3px solid var(--naranja);padding:4px 0 4px 16px;margin-top:30px}
.demo ul{margin:6px 0 12px;padding-left:20px}

/* Alumno: camino a la izquierda, video a la derecha (arriba en el celular) */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,46%);gap:0;max-width:1440px;margin:0 auto}
.alumno{padding:0 40px 120px;min-width:0}
.alumno h2{font-size:20px;margin:0 0 14px}
.panel-video{position:sticky;top:0;align-self:start;height:100vh;padding:24px 32px 24px 8px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.pv-marco{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--linea)}
.pv-marco iframe,.pv-marco #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.pv-titulo{margin:0;font-family:var(--display);font-weight:500;font-size:15px;color:var(--gris);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pv-aviso{font-family:var(--sans);font-size:13px;font-weight:600;color:#0B1220;background:var(--naranja);padding:2px 10px;border-radius:999px;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.pv-aviso.ver{opacity:1;transform:none}
.panel-video.cambio .pv-marco{animation:cambioVideo .7s ease}
@keyframes cambioVideo{0%{box-shadow:0 0 0 0 rgba(93,123,182,.9)}40%{box-shadow:0 0 0 6px rgba(93,123,182,.55)}100%{box-shadow:0 0 0 0 rgba(93,123,182,0)}}

/* Encabezado */
.hero{padding:28px 0 6px}
.hero-prog{margin:0;color:var(--gris);font-size:15px;display:flex;flex-wrap:wrap;gap:4px 16px}
.hero-prog span{color:var(--tinta)}
.hero h1{font-size:clamp(30px,5vw,42px);margin:4px 0 14px;letter-spacing:-.02em}
.estado{display:grid;gap:2px;padding-left:14px;border-left:4px solid var(--azul);margin-bottom:20px}
.estado strong{font-family:var(--display);font-weight:600;font-size:18px;color:var(--azul-txt)}
.estado span{color:var(--gris);font-size:16px}
.estado-meterle{border-left-color:var(--oxido)} .estado-meterle strong{color:var(--oxido-txt)}
.estado-adelantado,.estado-m2{border-left-color:var(--naranja)} .estado-adelantado strong,.estado-m2 strong{color:var(--naranja)}
.estado-pausa{border-left-color:var(--linea)} .estado-pausa strong{color:var(--gris)}
.tira{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tramo{display:grid;gap:6px;min-width:0;align-content:start}
.barra-tramo{height:6px;border-radius:999px;background:var(--sup2);overflow:hidden}
.barra-tramo span{display:block;height:100%;width:calc(var(--lleno) * 100%);background:var(--tinta);border-radius:999px}
.tramo.prox .barra-tramo span{background:var(--azul)}
.tramo.prox.meterle .barra-tramo span{background:var(--oxido)}
.tramo-txt{display:flex;align-items:center;gap:3px;font-family:var(--display);font-weight:500;font-size:12.5px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tramo-txt svg{width:13px;height:13px;flex:none}
.tramo.tuvo .tramo-txt,.tramo.prox .tramo-txt{color:var(--tinta)}
.tramo.prox .tramo-txt{font-weight:600}
.tramo-sub{font-size:12px;color:var(--naranja);margin-top:-4px;font-weight:600}
.tramo.meterle .tramo-sub{color:var(--oxido-txt)}
.tira.animar .barra-tramo span{animation:llenar .9s cubic-bezier(.3,.7,.2,1) both}
@keyframes llenar{from{width:0}}
.clase-hecha{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:15px}
.clase-hecha p{margin:0;width:100%;font-weight:600}

.nota{margin:22px 0 0;padding:14px 18px;background:var(--naranja-claro);border-left:3px solid var(--naranja);border-radius:0 var(--radio-m) var(--radio-m) 0}
.nota p{margin:0}
.nota cite{display:block;font-style:normal;font-size:14px;color:var(--naranja);font-weight:600;margin-top:6px}
.de-andy{margin-top:24px}
.extra{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--sup);border-radius:var(--radio-m);margin-bottom:8px;cursor:pointer;border:1px solid var(--naranja)}
.extra input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--naranja);flex:none}

/* El camino */
.camino{position:relative;margin-top:34px;padding-bottom:10px}
.trazo{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.trazo-base{fill:none;stroke:#3A3D45;stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round}
.trazo-hecho{fill:none;stroke:var(--azul);stroke-width:4;stroke-linecap:round;opacity:.9}
.etapa-label{position:relative;z-index:1;margin:30px 0 12px 64px;background:var(--fondo);padding:4px 10px 4px 0;width:max-content;max-width:calc(100% - 64px)}
.etapa-label:first-of-type{margin-top:6px}
.etapa-label h3{font-size:13.5px;font-family:var(--sans);font-weight:600;color:var(--gris);margin:0}
.etapa-label p{margin:0;font-size:13.5px;color:#6E737D}
.nodo{position:relative;margin:0 0 6px calc(var(--ola))}
.nodo-fila{display:flex;align-items:center;gap:14px}
.punto{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--sup2);border:2px solid #3A3D45;color:var(--gris);font-family:var(--display);font-weight:600;font-size:15px;transition:transform .15s}
.punto svg{width:22px;height:22px}
.punto:hover{transform:scale(1.06)}
.est-listo .punto,.est-casi .punto{background:var(--tinta);border-color:var(--tinta);color:#111}
.est-cuesta .punto{border-color:var(--oxido);color:var(--oxido-txt);background:var(--oxido-claro)}
.nodo-tit{text-align:left;padding:6px 4px;display:grid;gap:1px}
.nodo-tit span{font-size:16.5px;line-height:1.3}
.est-listo .nodo-tit span,.est-casi .nodo-tit span{color:var(--gris)}
.nodo-tit small{font-size:14px;color:var(--gris)}
.nodo-tit small.oxido{color:var(--oxido-txt);font-weight:600}
.nodo.abierto{margin:14px 0 22px}
.nodo.abierto .punto{width:58px;height:58px;font-size:18px;background:var(--azul);border-color:var(--azul);color:#0B1220;box-shadow:0 0 0 7px rgba(93,123,182,.18)}
.nodo.abierto.est-listo .punto,.nodo.abierto.est-casi .punto{background:var(--azul);border-color:var(--azul)}
.nodo.abierto .nodo-tit span{font-family:var(--display);font-weight:600;font-size:22px;color:var(--tinta);line-height:1.2}
.tarjeta{position:relative;z-index:1;margin:12px 0 0 0;background:var(--sup);border:1px solid var(--linea);border-radius:14px;padding:20px 22px 22px;animation:abrir .25s cubic-bezier(.2,.8,.3,1) both}
@keyframes abrir{from{opacity:0;transform:translateY(-6px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--azul-claro);color:var(--azul-txt);white-space:nowrap}
.chip svg{width:15px;height:15px}
.chip-oxido{background:var(--oxido-claro);color:var(--oxido-txt)}
.consigna p{margin:0 0 10px;color:#D6D9DF}
.consigna strong{color:var(--tinta)}
.reglas{margin:0 0 12px;padding-left:22px;color:#D6D9DF}
.reglas li{margin:5px 0}
.link-seek{display:inline-flex;align-items:center;gap:4px;color:var(--azul-txt);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link-seek svg{width:14px;height:14px}
.material{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.mat{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;background:var(--sup2);border:1px solid var(--linea);border-radius:10px;color:var(--tinta)!important;text-decoration:none;font-weight:600;font-size:15px;text-align:left}
.mat:hover{border-color:#5A5E68}
.mat svg{width:17px;height:17px;flex:none;color:var(--naranja)}
a.mat svg{color:var(--azul-txt)}
.mat small{display:block;font-weight:400;color:var(--gris);font-size:13px}
.mat-sec span{font-weight:500}.mat-sec b{font-weight:700}
.pregunta{margin-top:18px;padding-top:16px;border-top:1px solid var(--linea)}
.pregunta h4{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 10px}
.ops{display:grid;gap:8px}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--linea);background:var(--sup2);font-weight:600;font-size:16px;line-height:1.3;color:var(--tinta)}
.op:hover{border-color:#5A5E68}
.op-punto{width:18px;height:18px;border-radius:50%;border:2px solid #5A5E68;flex:none}
.op.sel{border-color:var(--tinta);background:#2A2C32}
.op.sel .op-punto{border:6px solid var(--tinta)}
.op.sel.nivel-listo{border-color:#3FB37F;background:#12251C}
.op.sel.nivel-listo .op-punto{border-color:#5BD49A}
.op.sel.nivel-cuesta{border-color:var(--oxido);background:var(--oxido-claro)}
.op.sel.nivel-cuesta .op-punto{border-color:var(--oxido-txt)}
.respuesta{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--azul);background:var(--azul-velo);animation:aparecerResp .35s cubic-bezier(.2,.8,.3,1) both}
@keyframes aparecerResp{from{opacity:0;transform:translateY(4px) scale(.98)}}
.respuesta p{margin:0 0 4px;color:var(--tinta)}
.respuesta p:not(.resp-tit) + p{margin-top:10px}
.resp-tit{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.01em;color:var(--azul-txt)!important;margin-bottom:2px!important}
.resp-ico{flex:none;width:28px;height:28px;margin-top:1px;color:var(--azul-txt)}
.resp-ico svg{width:28px;height:28px}
.resp-ok{border-color:#3FB37F;background:#12251C}
.resp-ok .resp-ico,.resp-ok .resp-tit{color:#5BD49A!important}
.resp-rec.nivel-casi{border-color:var(--naranja);background:var(--naranja-claro)}
.resp-rec.nivel-casi .resp-ico,.resp-rec.nivel-casi .resp-tit{color:var(--naranja)!important}
.resp-rec.nivel-cuesta{border-color:var(--oxido);background:var(--oxido-claro)}
.resp-rec.nivel-cuesta .resp-ico,.resp-rec.nivel-cuesta .resp-tit{color:var(--oxido-txt)!important}
.festejo .resp-tit{font-size:17px}
.confeti{position:fixed;inset:0;pointer-events:none;z-index:50}
.apoyo{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--naranja-claro)}
.apoyo h4,.dificultades h4{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:15px}
.apoyo>p{margin:0 0 6px;font-size:15.5px;color:#D6D9DF}
.apoyo-item{padding-top:10px}
.apoyo-t{margin:0;font-weight:600}
.apoyo-c{margin:0 0 6px;font-size:14.5px;color:var(--gris)}
.apoyo-links{display:flex;flex-wrap:wrap;gap:8px}
.dificultades{margin-top:16px}
.dif{padding:10px 0;border-top:1px solid var(--linea)}
.dif:first-of-type{border-top:0;padding-top:2px}
.dif p{margin:0 0 4px;color:#D6D9DF}
.dif .dif-q{font-weight:600;color:var(--tinta)}
.dif a{display:inline-block;margin-right:14px}
.seguir{margin-top:18px}
.seguir .primario{display:inline-grid;grid-template-columns:auto auto;align-items:center;gap:0 12px;text-align:left;padding:12px 20px}
.seguir .primario span{font-size:17px}
.seguir .primario small{grid-row:2;font-weight:500;font-size:13.5px;color:#4A4D55;max-width:320px}
.seguir .primario svg{grid-row:1;grid-column:2;width:20px;height:20px}
.standards{display:flex;flex-wrap:wrap;gap:8px}
.chip-op{padding:8px 14px;border-radius:999px;border:1.5px solid var(--linea);background:var(--sup2);font-weight:500;font-size:15px;color:var(--tinta)}
.chip-op:hover{border-color:#5A5E68}
.chip-op.sel{background:var(--tinta);border-color:var(--tinta);color:#111;font-weight:600}
.otro-standard{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.otro-standard input{flex:1 1 140px;min-width:0;width:100%;padding:8px 14px;border:1.5px solid var(--linea);border-radius:999px;background:var(--sup2);color:var(--tinta)}
.meta{position:relative;display:flex;align-items:center;gap:14px;margin:26px 0 0 0}
.meta span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:2px dashed #3A3D45;color:#6E737D;background:var(--fondo);position:relative;z-index:1}
.meta span svg{width:20px;height:20px}
.meta p{margin:0;color:#6E737D;font-family:var(--display);font-weight:500}
.pie{margin-top:34px;color:var(--gris);font-size:15px}

@media (max-width:999px){
    .layout{display:flex;flex-direction:column-reverse}
  .panel-video{position:sticky;top:0;z-index:5;height:auto;padding:0;background:var(--fondo);gap:0;width:100%}
  .pv-marco{border-radius:0;border:0;border-bottom:1px solid var(--linea)}
  .pv-titulo{padding:6px 16px;font-size:13.5px;border-bottom:1px solid var(--linea)}
  .alumno{padding:0 18px 100px}
}
@media (max-width:560px){
  .tira{gap:4px}
  .tramo-txt{font-size:11px}
  .nodo{margin-left:calc(var(--ola) * .5)}
  .nodo.abierto{margin-left:0}
  .tarjeta{padding:16px 16px 18px;margin-left:-4px;margin-right:-4px}
  .etapa-label{margin-left:58px;max-width:calc(100% - 58px)}
  .nodo.abierto .nodo-tit span{font-size:19px}
  .punto{width:42px;height:42px}
  .nodo.abierto .punto{width:50px;height:50px}
}


.apoyo-parte{margin:12px 0 6px;font-size:13px;font-weight:600;color:var(--tenue,#A4A7AE);}

.lineas{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
.lineas path{fill:none;stroke-linecap:round}
.lineas .l-cuerpo{stroke:url(#lg-cuerpo)}
.lineas .l-filo{stroke:url(#lg-filo)}
.layout{position:relative;z-index:1}
.etapa-label{background:none!important;text-shadow:0 0 12px var(--fondo),0 0 4px var(--fondo)}
/* Documento nuevo */
.doc-nuevo{display:flex;align-items:center;gap:14px;margin:16px 0 4px;padding:14px 16px;border-radius:12px;background:#1E2A44;border:1px solid #5D7BB6;color:var(--tinta);text-decoration:none;transition:border-color .15s,background .15s}
.doc-nuevo:hover{background:#243256;border-color:#8FA6D6}
.doc-nuevo .dn-ico{width:40px;height:40px;border-radius:10px;background:#5D7BB6;color:#fff;display:grid;place-items:center;flex:none}
.doc-nuevo .dn-ico svg{width:20px;height:20px}
.doc-nuevo small{display:block;font-size:12.5px;color:#AFC0E6;font-weight:600}
.doc-nuevo strong{display:block;font-size:16px}
.doc-nuevo>svg{margin-left:auto;width:18px;height:18px;transform:rotate(-90deg);opacity:.7;flex:none}
.doc-nuevo>span:nth-child(2){min-width:0}
.pv-aviso:empty{display:none}
/* Envío obligatorio antes de seguir */
.envio{margin-top:18px;padding:16px 18px;border-radius:12px;background:#1A2232;border:1px solid #5D7BB6}
.envio-t{display:flex;gap:10px;align-items:center;margin:0}
.envio-t svg{width:20px;height:20px;color:#5D7BB6;flex:none}
.envio-c{margin:6px 0 12px 30px;color:var(--tenue,#A4A7AE);font-size:15px}
.envio .fila-botones{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-left:30px}
.envio-check{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;background:var(--sup2);cursor:pointer;font-weight:600}
.envio-check input{width:18px;height:18px;accent-color:#3FB37F}
.envio-ok{background:#12251C;border-color:#3FB37F}
.envio-ok .envio-t svg{color:#3FB37F}
.envio-ok .fila-botones{margin-top:10px}
.nota-paso{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--sup2);font-size:15px;color:var(--tinta)}
.barra{position:relative;z-index:2}
.tip-paso{display:flex;gap:12px;align-items:flex-start;margin:14px 0 0;padding:14px 16px;border-radius:12px;background:#2A2416;border:1px solid #C9A24A}
.tip-paso svg{width:22px;height:22px;flex:none;color:#E9C46A;margin-top:2px}
.tip-paso p{margin:0;font-size:15.5px}

/* Miniatura del video en cada paso del camino */
.nodo-fila .mini{flex:none;margin-left:auto;width:80px;aspect-ratio:16/9;border-radius:7px;overflow:hidden;border:1px solid var(--linea);background:var(--sup2);padding:0}
.nodo-fila .mini img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.est-listo .nodo-fila .mini img,.est-casi .nodo-fila .mini img{opacity:.5}
/* Barra fija: avance para la próxima clase */
.barra-clase{position:sticky;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;margin-top:28px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 14px 12px 18px;background:rgba(27,28,32,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--linea);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.bc-izq{display:grid;gap:2px;min-width:0}
.bc-izq strong{font-family:var(--display);font-weight:600;font-size:15px}
.bc-izq>span:not(.bc-puntos){font-size:14px;color:var(--gris)}
.bc-puntos{display:flex;gap:5px;margin-top:4px}
.bc-puntos i{width:9px;height:9px;border-radius:50%;background:var(--linea)}
.bc-puntos i.ok{background:var(--tinta)}
.bc-puntos i.ahora{background:var(--azul);box-shadow:0 0 0 3px rgba(93,123,182,.25)}
.bc-sig{display:grid;text-align:right;gap:1px;max-width:58%;padding:8px 12px;border-radius:10px;background:var(--sup2);border:1px solid var(--linea)}
.bc-sig small{font-size:12.5px;color:var(--naranja);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.bc-sig span{font-size:14.5px;font-weight:600;line-height:1.25;color:var(--tinta);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bc-listo{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:#5BD49A;text-align:right}
.bc-listo svg{width:18px;height:18px;flex:none}
.bc-listo.bc-ultimo{color:var(--gris);font-weight:400}
body:has(.barra-clase) #aviso{bottom:104px}
@media (max-width:560px){
  .nodo-fila .mini{width:64px}
  .barra-clase{padding:10px 10px 10px 14px;gap:10px}
  .bc-sig{max-width:55%;padding:7px 10px}
  .bc-sig span{font-size:13.5px}
}

/* Ver el resto del camino (por defecto solo paso anterior, actual y siguiente) */
.mas-pasos{position:relative;z-index:1;display:block;margin:14px 0 14px 64px;padding:8px 14px;border-radius:999px;border:1px dashed #3A3D45;background:var(--fondo);color:var(--gris);font-size:14.5px;font-weight:600}
.mas-pasos:hover{color:var(--tinta);border-color:var(--gris)}
@media (max-width:560px){.mas-pasos{margin-left:58px}}

/* Videos mandados desde el aula */
.vids{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.vids li{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--tinta)}
.vids li svg{width:16px;height:16px;color:#5BD49A;flex:none}
.vids li .link{margin-left:auto}
.boton-grabar{display:inline-flex;align-items:center;gap:10px}
.boton-grabar i{width:12px;height:12px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 3px rgba(229,72,77,.25)}
.subir-galeria{cursor:pointer}
/* Grabador a pantalla completa, como la cámara de WhatsApp: la imagen ocupa todo y los controles van encima */
body.con-grabador{overflow:hidden}
.grabador{position:fixed;inset:0;height:100vh;height:100dvh;z-index:50;background:#000;color:#fff;overflow:hidden;touch-action:none}
.grabador .gr-vivo,.grabador .gr-ver{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.grabador .gr-ver{object-fit:contain}
.gr-vivo.espejo{transform:scaleX(-1)}
.gr-cab{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 14px 28px;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:2}
.gr-tit{min-width:0;flex:1;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.gr-tit small{display:block;font-size:13px;opacity:.85}
.gr-tit strong{display:block;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grabando .gr-tit{visibility:hidden}
.gr-x{width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;flex:none;padding:0}
.gr-x svg{width:22px;height:22px}
.gr-reloj{position:absolute;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top));background:#E5484D;color:#fff;font:600 15px var(--display);padding:4px 12px;border-radius:999px}
.gr-msg{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);margin:0;text-align:center;font-size:16px;line-height:1.45;background:rgba(17,18,20,.88);padding:16px;border-radius:14px;z-index:2}
.gr-pie{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:40px 28px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:2}
.revisando .gr-pie{background:linear-gradient(transparent,rgba(0,0,0,.75));padding-top:20px}
.revisando .gr-ver{top:calc(70px + env(safe-area-inset-top));bottom:auto;height:calc(100% - 190px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.gr-lado{width:48px;height:48px;flex:none}
.gr-redondo{border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center;padding:0}
.gr-redondo svg{width:24px;height:24px}
.gr-rec{width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:none;display:grid;place-items:center;padding:0;flex:none}
.gr-rec i{width:62px;height:62px;border-radius:50%;background:#E5484D;transition:all .2s}
.gr-rec.grabando i{width:28px;height:28px;border-radius:6px}
.gr-texto{border:0;background:rgba(255,255,255,.14);color:#fff;font:600 16px var(--sans);padding:12px 18px;border-radius:999px}
.gr-mandar{width:62px;height:62px;border-radius:50%;border:0;background:var(--naranja);color:#111;display:grid;place-items:center;padding:0;margin-left:auto;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.gr-mandar svg{width:28px;height:28px;margin-left:3px}
@media (min-width:900px){.grabador{inset:4vh 22vw;height:auto;border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.7)}}
/* Cartelito de subida en segundo plano */
.subida-pill{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));z-index:40;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);padding:10px 16px;border-radius:999px;background:rgba(27,28,32,.96);border:1px solid var(--linea);box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:15px;font-weight:600;color:var(--tinta)}
.subida-pill.ok{color:#5BD49A}
.subida-pill.ok svg{width:18px;height:18px}
.subida-pill.error{white-space:normal;border-radius:14px;color:var(--oxido-txt);font-weight:400}
.subida-pill .link{flex:none}
.sp-anillo{--p:30;width:18px;height:18px;border-radius:50%;flex:none;background:conic-gradient(var(--azul) calc(var(--p)*1%),#3A3D45 0);-webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
.vid-pend .sp-anillo{animation:girar 1.2s linear infinite;background:conic-gradient(var(--azul) 30%,#3A3D45 0)}
@keyframes girar{to{transform:rotate(1turn)}}
.vid-pend{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0;font-size:15px;color:var(--gris)}
.vid-pend .sp-anillo{margin-top:3px}

/* Módulo todavía no habilitado */
.etapa-bloq{position:relative;z-index:1;display:flex;gap:12px;align-items:center;margin:22px 0 6px;padding:14px 16px;border:1px dashed #3A3D45;border-radius:14px;color:var(--gris);background:var(--fondo)}
.etapa-bloq svg{width:22px;height:22px;flex:none}
.etapa-bloq p{margin:0;font-size:15px}
.etapa-bloq strong{display:block;color:var(--tinta);font-family:var(--display);font-weight:600}

/* Bloques por módulo: un fondo apenas teñido con el color del módulo y un título grande arriba */
.mod-bloque{--mc:#8FA6D6;margin:26px -14px 10px;padding:4px 14px 14px;border-radius:20px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 11%,transparent),color-mix(in srgb,var(--mc) 3%,transparent) 140px,transparent 100%)}
.mod-bloque:first-of-type{margin-top:8px}
.mod-banner{position:relative;z-index:1;padding:18px 4px 6px 64px}
.mod-banner small{display:block;font:600 12.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mc)}
.mod-banner h2{margin:2px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.6vw,28px);line-height:1.15;color:var(--tinta)}
.mod-banner p{margin:4px 0 0;font-size:14.5px;color:var(--gris)}
.mod-banner::before{content:"";position:absolute;left:30px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--mc);box-shadow:0 0 0 5px color-mix(in srgb,var(--mc) 22%,transparent)}
.mod-pronto{opacity:.75}
.mod-plegado{padding-bottom:10px}
.mod-pliegue{position:relative;z-index:1;display:flex;align-items:center;gap:10px;width:calc(100% - 64px);margin:8px 0 0 64px;padding:10px 14px;border:1px solid color-mix(in srgb,var(--mc) 35%,transparent);border-radius:12px;background:color-mix(in srgb,var(--mc) 8%,var(--fondo));color:var(--tinta);font:600 14.5px var(--sans);cursor:pointer;text-align:left}
.mod-pliegue:hover{background:color-mix(in srgb,var(--mc) 15%,var(--fondo))}
.mod-pliegue svg{width:18px;height:18px;flex:none;color:var(--mc);transition:transform .2s}
.mod-pliegue.abierto svg{transform:rotate(180deg)}
.mod-pliegue small{margin-left:auto;font-weight:400;color:var(--gris)}
@media (max-width:560px){.mod-pliegue{margin-left:58px;width:calc(100% - 58px)}}
.etapa-bloq small{display:block;font:600 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mc,var(--gris))}
@media (max-width:560px){.mod-bloque{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}.mod-banner{padding-left:58px}.mod-banner::before{left:26px}}
/* Pantalla de cambio de módulo */
.pase-modulo{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 80% at 50% 40%,color-mix(in srgb,var(--mc) 30%,#111214),#0B0B0D 70%);opacity:0;transition:opacity .35s ease}
.pase-modulo.visible{opacity:1}
.pm-in{text-align:center;max-width:520px;transform:translateY(18px) scale(.98);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.pase-modulo.visible .pm-in{transform:none}
.pase-modulo .logo-ae{margin-bottom:34px}.pase-modulo .logo-ae svg{height:clamp(84px,16vw,140px);max-width:88vw}
.pm-pre{margin:0;color:var(--gris);font-size:17px}
.pm-num{margin:6px 0 0;font:600 15px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mc)}
.pase-modulo h2{margin:6px 0 28px;font-family:var(--display);font-weight:600;font-size:clamp(34px,9vw,52px);line-height:1.08;color:var(--tinta)}
.pase-modulo .primario{font-size:17px;padding:13px 30px}
@media (prefers-reduced-motion:reduce){.pase-modulo,.pm-in{transition:none}}

/* Pregunta grande: «¿Ya tuviste la clase N?» cuando ya tiene todo lo esperado para esa clase */
.pregunta-clase{margin:18px 0 4px;padding:18px 18px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(93,123,182,.16),rgba(93,123,182,.05));border:1px solid rgba(93,123,182,.45)}
.pregunta-clase p{margin:0 0 14px;color:var(--gris);font-size:15.5px;line-height:1.45}
.pregunta-clase strong{display:block;font-family:var(--display);font-weight:600;font-size:clamp(19px,4.4vw,22px);color:var(--tinta);margin-bottom:4px}
.pregunta-clase .fila-botones{display:flex;gap:10px;flex-wrap:wrap}

/* Elegir módulo (abajo de todo) */
.selector-mod{margin:34px 0 10px}
.selector-mod h3{font:600 13.5px var(--sans);color:var(--gris);margin:0 0 10px;letter-spacing:.04em;text-transform:uppercase}
.sm-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sm-item{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--linea);background:color-mix(in srgb,var(--mc) 7%,var(--sup));color:var(--tinta);cursor:pointer;position:relative;overflow:hidden}
.sm-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mc)}
.sm-item small{font:600 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mc)}
.sm-item strong{font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.2}
.sm-estado{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--gris);margin-top:4px}
.sm-estado svg{width:14px;height:14px}
.sm-item.actual{border-color:var(--mc);box-shadow:0 0 0 1px var(--mc)}
.sm-item.bloq{cursor:default;opacity:.55;background:var(--sup)}
.sm-item.bloq small{color:var(--gris)}
.sm-item.bloq::before{background:#3A3D45}
.sm-item:not(.bloq):hover{border-color:var(--mc)}
@media (max-width:560px){.sm-lista{grid-template-columns:1fr 1fr}}

.panel-vids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 4px}
.panel-vid{display:flex;flex-direction:column;padding:0;background:var(--sup2);border:1px solid var(--linea);border-radius:12px;overflow:hidden;color:var(--tinta);text-align:left;cursor:pointer;font:inherit}
.panel-vid img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.panel-vid span{display:flex;align-items:center;gap:7px;padding:9px 11px;font-weight:600;font-size:14.5px;line-height:1.25}
.panel-vid span svg{width:16px;height:16px;flex:none}
.panel-vid:hover{border-color:var(--azul)}

/* Objetivos del módulo */
.ruta{margin:14px 0 6px;display:grid;gap:14px}
.ruta h5{margin:0;font:600 12.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--rc)}
.ruta-obj{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ruta-obj li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--rc) 7%,transparent);border:1px solid color-mix(in srgb,var(--rc) 18%,transparent)}
.ruta-obj p{margin:0;line-height:1.5}
.ruta-n{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--rc);color:#0d0e10;font:700 14px var(--display)}
.ruta-puente{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:16px 12px;border-radius:14px;background:color-mix(in srgb,var(--rc) 10%,transparent)}
.rp-extremo{font-size:13.5px;color:var(--gris);font-style:italic}
.rp-flecha{color:var(--rc);font-weight:700}
.rp-etapa{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--rc);color:#0d0e10;font:600 14.5px var(--display)}
.rp-etapa small{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.18);font-size:11px}
.ruta-meta{margin:0;padding:10px 14px;border-left:3px solid var(--linea);background:var(--sup2);border-radius:0 10px 10px 0}
.ruta-clave{padding:14px 16px;border-radius:14px;border:1.5px solid #5D7BB6;background:rgba(93,123,182,.08)}
.ruta-clave h5{color:#5D7BB6;margin-bottom:6px}
.ruta-clave p{margin:6px 0 0;line-height:1.55}
.ruta-cierre{margin:0;font:500 16.5px/1.5 var(--display);text-align:center;padding:4px 8px}
@media (max-width:560px){.ruta-puente{flex-direction:column;gap:4px}.rp-flecha{transform:rotate(90deg)}}

/* Línea destacada dentro de una consigna (en el texto: una línea que empieza con «# ») */
.destacado{margin:12px 0!important;padding:2px 0 2px 14px;border-left:3px solid var(--naranja);font:600 19px/1.35 var(--display);color:var(--tinta)}
.consigna strong,.respuesta strong{color:var(--tinta);font-weight:700}
@media (max-width:560px){.destacado{font-size:17.5px}}
.rp-meta{font-style:normal;font-weight:700;color:var(--rc)}

/* Botón y mapa completo */
.hero-prog{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.boton-mapa{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--linea);background:var(--sup2);color:var(--tinta);font:600 13.5px var(--sans);cursor:pointer;letter-spacing:0;text-transform:none}
.boton-mapa:hover{border-color:#5A5E68}
.boton-mapa svg{width:17px;height:17px;color:var(--naranja)}
body.con-mapa{overflow:hidden}
.mapa-zoom{position:fixed;inset:0;z-index:60;overflow-y:auto;background:radial-gradient(1200px 600px at 50% -10%,#1d1f25,var(--fondo));animation:mzIn .28s cubic-bezier(.2,.8,.3,1) both}
@keyframes mzIn{from{opacity:0;transform:scale(1.04)}}
.mz-cab{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,4vw,40px);background:var(--fondo);border-bottom:1px solid var(--linea)}
.mz-cab small{color:var(--gris);font-size:13px}
.mz-cab h2{margin:0;font:600 26px var(--display)}
.mz-cerrar{width:42px;height:42px;border-radius:50%;border:1px solid var(--linea);background:var(--sup2);color:var(--tinta);font-size:18px;cursor:pointer}
.mz-camino{list-style:none;margin:0 auto;padding:30px 16px 80px;max-width:920px;position:relative}
.mz-camino::before{content:"";position:absolute;top:20px;bottom:60px;left:50%;border-left:3px dashed #3A3D45;transform:translateX(-50%)}
.mz-mod{position:relative;display:grid;grid-template-columns:1fr 64px 1fr;align-items:start;margin:0 0 34px}
.mz-parada{grid-column:2;justify-self:center;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--fondo);border:3px solid var(--mc);color:var(--mc);font:700 20px var(--display);position:relative;z-index:1}
.mz-parada svg{width:22px;height:22px}
.mz-mod.completo .mz-parada{background:var(--mc);color:#0d0e10}
.mz-mod.aca .mz-parada{box-shadow:0 0 0 7px color-mix(in srgb,var(--mc) 25%,transparent);animation:mzLatido 2.2s ease-in-out infinite}
@keyframes mzLatido{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--mc) 10%,transparent)}}
.mz-mod.izq .mz-tarjeta{grid-column:1;grid-row:1}
.mz-mod.der .mz-tarjeta{grid-column:3;grid-row:1}
.mz-mod .mz-parada{grid-row:1}
.mz-tarjeta{position:relative;padding:16px 18px;border-radius:16px;background:var(--sup);border:1.5px solid color-mix(in srgb,var(--mc) 35%,var(--linea))}
.mz-mod.bloq .mz-tarjeta{opacity:.6}
.mz-tarjeta small{color:var(--mc);font:600 12px var(--sans);letter-spacing:.1em;text-transform:uppercase}
.mz-tarjeta h3{margin:2px 0 4px;font:600 21px var(--display)}
.mz-estado{margin:0 0 8px;color:var(--gris);font-size:14px}
.mz-meta{margin:0 0 10px;font-size:15px;line-height:1.45}
.mz-aca{position:absolute;top:-12px;right:14px;padding:3px 10px;border-radius:999px;background:var(--mc);color:#0d0e10;font:700 12px var(--sans)}
.mz-pasitos{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:0 0 10px}
.mz-pasitos span{padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--mc) 16%,transparent);color:var(--tinta);font-size:12.5px;font-weight:600}
.mz-pasitos i{color:var(--mc);font-style:normal;font-size:12px}
.mz-det{border-top:1px solid var(--linea);padding-top:8px;margin-top:8px}
.mz-det summary{cursor:pointer;font-weight:600;color:var(--tinta);list-style:none;display:flex;align-items:center;gap:6px}
.mz-det summary::before{content:"▸";color:var(--mc);transition:transform .2s}
.mz-det[open] summary::before{transform:rotate(90deg)}
.mz-det ol{margin:8px 0 2px;padding-left:20px;display:grid;gap:6px;font-size:14.5px;line-height:1.45}
.mz-lista{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.mz-lista li{display:flex;align-items:flex-start;gap:2px}
.mz-lista button,.mz-lista span{display:flex;align-items:center;gap:9px;width:100%;padding:6px 6px;border:0;border-radius:8px;background:none;color:#C9CCD3;font:inherit;font-size:14.5px;text-align:left;cursor:pointer}
.mz-lista span{cursor:default}
.mz-lista button:hover{background:var(--sup2);color:var(--tinta)}
.mz-lista i{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:2px solid #4A4E58}
.mz-lista li.ok i{border-color:var(--mc);background:var(--mc);color:#0d0e10}
.mz-lista i svg{width:12px;height:12px}
.mz-lista li.ok button{color:var(--gris)}
.mz-lista li.cur button{color:var(--tinta);font-weight:700;background:color-mix(in srgb,var(--mc) 12%,transparent)}
.mz-lista em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;color:var(--mc)}
@media (max-width:700px){
  .mz-camino::before{left:34px}
  .mz-mod{grid-template-columns:52px 1fr;gap:12px}
  .mz-mod .mz-parada{grid-column:1}
  .mz-mod.izq .mz-tarjeta,.mz-mod.der .mz-tarjeta{grid-column:2}
}

.mz-lista .mz-tilde{flex:none;width:auto;padding:6px 4px 6px 6px}
.mz-lista .mz-tilde:hover i{border-color:var(--mc,var(--naranja))}
.mz-lista li.ok .mz-tilde i{border-color:var(--mc,#5BD49A);background:var(--mc,#5BD49A);color:#0d0e10}
.mz-lista button[data-mapa-paso]{flex:1}
.mz-lista span small{display:block;color:var(--gris);font-size:13px}
.mz-lista li.ok span{color:var(--gris);text-decoration:line-through}
.mz-ayuda{max-width:920px;margin:14px auto 0;padding:0 16px;text-align:center;color:var(--gris);font-size:14px}
.mz-extras{max-width:560px;margin:18px auto 0;padding:14px 16px;border-radius:14px;background:var(--sup);border:1.5px solid var(--naranja);--mc:var(--naranja)}
.mz-extras h3{margin:0 0 4px;font:600 17px var(--display);color:var(--naranja)}

/* Cuellos de botella cuando ya le sale: en verde */
.apoyo-ok{background:#12251C;border:1.5px solid #3FB37F}
.apoyo-ok h4{color:#5BD49A}
.dif-q{font-style:italic}
/* El proceso en círculo */
.ruta-ciclo{position:relative;width:100%;max-width:520px;aspect-ratio:1;margin:4px auto 0}
.ruta-ciclo svg{position:absolute;inset:0;width:100%;height:100%}
.ruta-ciclo circle{fill:none;stroke:color-mix(in srgb,var(--rc) 45%,transparent);stroke-width:.6}
.rc-paso{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;width:max-content;max-width:170px;padding:7px 11px;border-radius:14px;background:var(--rc);color:#0d0e10;font:600 13.5px/1.2 var(--display);text-align:left;box-shadow:0 0 0 5px var(--sup)}
.rc-paso small{flex:none;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.18);font-size:11px}
.rc-flecha{position:absolute;color:var(--rc);font-size:15px;line-height:1;transform:translate(-50%,-50%) rotate(var(--rot))}
.rc-centro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:42%;text-align:center;font:600 16px/1.3 var(--display);color:var(--tinta)}
@media (max-width:560px){.rc-paso{max-width:92px;font-size:10.5px;padding:5px 7px;gap:4px;hyphens:auto;overflow-wrap:anywhere}.rc-paso small{width:15px;height:15px;font-size:9.5px}.rc-centro{font-size:13px;width:38%}}
.stop summary::-webkit-details-marker,.mz-det summary::-webkit-details-marker{display:none}
.gc-cap{margin:8px 0 2px 86px;font-size:12.5px;font-weight:600;color:var(--tinta)}
@media (max-width:560px){.gc-cap{margin-left:61px}}

/* Stops de segmentación */
.stop{margin:14px 0 4px;border:1.5px solid var(--linea);border-radius:16px;background:var(--sup2);overflow:hidden;--sc:#7DB4FF}
.stop-cuerdas{--sc:#E8C35A}.stop-melodia{--sc:#C7A6F2}.stop-ola{--sc:#7DB4FF}
.stop summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:3px;padding:13px 16px 13px 40px;position:relative}
.stop summary::before{content:"▸";position:absolute;left:16px;top:13px;color:var(--sc);font-size:16px;transition:transform .2s}
.stop[open] summary::before{transform:rotate(90deg)}
.stop summary span{font:600 16.5px var(--display)}
.stop summary small{color:var(--gris);font-size:14px}
.stop summary small strong{color:var(--tinta)}
.stop-cuerpo{padding:2px 16px 16px}
.stop-modos{display:inline-flex;gap:4px;padding:3px;border-radius:999px;background:var(--sup);margin:4px 0 10px}
.stop-modos button{border:0;background:none;color:var(--gris);font:600 13.5px var(--sans);padding:6px 14px;border-radius:999px;cursor:pointer}
.stop-modos button.on{background:#2C5E45;color:#E9FFF3}
.stop-modos button.on.no{background:#6B2E22;color:#FFE9E3}
.stop-dibujo{border-radius:12px;background:#121317;padding:8px 6px 4px}
.stop-dibujo svg{display:block;width:100%;height:auto}
.stop-dibujo.modo-no{--sc:#E2705A}
/* onda */
.ola-b{fill:#3A3D45;transition:fill .25s}
.ola-b.on{fill:var(--sc)}
.ola-b.on.traba{fill:#FF6B57}.ola-b.ok{fill:#5BD49A}
.ola-sel{fill:color-mix(in srgb,var(--sc) 14%,transparent)}
.ola-sel.traba{fill:rgba(255,107,87,.16)}.ola-sel.ok{fill:rgba(91,212,154,.12)}
.ola-compas{stroke:#2A2C33;stroke-width:1}
.ola-num{fill:#6B6F79;font:600 12px var(--sans);text-anchor:middle}
.ola-num.on{fill:var(--tinta)}
.ola-alerta{fill:#FF6B57;font:800 15px var(--sans);text-anchor:middle}
/* cuerdas */
.trastes{stroke:#2E3038;stroke-width:2}
.cejilla{fill:#4A4D56}
.cuerda{stroke:#5A5E68;transition:stroke .25s}
.cuerda.on{stroke:var(--sc)}
.cuerda.on.traba{stroke:#FF6B57}.cuerda.ok{stroke:#5BD49A}
.c-brillo{stroke:color-mix(in srgb,var(--sc) 22%,transparent);stroke-linecap:round}
.c-brillo.traba{stroke:rgba(255,107,87,.25)}
.c-num{fill:#6B6F79;font:700 15px var(--display);text-anchor:middle}
.c-num.on{fill:var(--tinta)}
/* melodía */
.m-linea{fill:none;stroke:#3F424B;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.m-linea.on{stroke:var(--sc)}.m-linea.on.traba{stroke:#FF6B57}.m-linea.ok{stroke:#5BD49A}
.m-nota{fill:#3F424B}.m-nota.on{fill:var(--sc)}.m-nota.on.traba{fill:#FF6B57}.m-nota.ok{fill:#5BD49A}
.m-llave{fill:none;stroke:#3F424B;stroke-width:1.5}
.m-llave.on{stroke:var(--sc)}.m-llave.traba{stroke:#FF6B57}.m-llave.ok{stroke:#5BD49A}
.m-letra{fill:#6B6F79;font:700 13px var(--display);text-anchor:middle}.m-letra.on{fill:var(--tinta)}
.m-sub{fill:#6B6F79;font:600 11px var(--sans);text-anchor:middle}.m-sub.on{fill:var(--tinta)}
.m-corte{stroke:#FF6B57;stroke-width:1;stroke-dasharray:3 3;opacity:.7}
/* texto, contador y controles */
.stop-texto{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:92px;margin:4px 0 12px;padding:10px 14px;border-radius:12px;background:var(--sup);text-align:center;font:600 19px/1.4 var(--display);color:var(--tinta)}
.stop-frase{animation:stopFrase .45s ease both}
@keyframes stopFrase{from{opacity:0;transform:translateY(4px)}}
.stop-texto.zoom{color:#FFB8A8}
.stop-texto.malo{color:#FFB8A8}
.stop-num{font:600 12px var(--sans);color:var(--gris);letter-spacing:.04em}
.stop-cap{margin:8px 0 4px;font-size:12.5px;font-weight:600;color:var(--gris)}
.stop-veces{display:grid;gap:3px}
.stop-veces span{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 3px;border-radius:6px;background:color-mix(in srgb,var(--sc) calc(var(--v) * 75%),#1C1D22);transition:background .3s}
.stop-veces.modo-no span{background:color-mix(in srgb,#E2705A calc(var(--v) * 75%),#1C1D22)}
.stop-veces b{font-size:13px;color:#fff}
.stop-veces small{font-size:10.5px;color:rgba(255,255,255,.7)}
.stop-veces span.traba{outline:2px solid #FF6B57}
.stop-veces span.ok{outline:2px solid #5BD49A}
.stop-ctrl{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.stop-ctrl .primario{flex:1}
.stop-play1{font-size:17px;padding:14px 18px}
.stop-ctrl button[disabled]{opacity:.4}
@media (max-width:560px){.stop-veces b{font-size:11px}.stop-veces small{font-size:9px}.stop-texto{font-size:16.5px;min-height:96px}}

/* cifrado de un standard */
.cifrado{display:grid;grid-template-columns:repeat(4,1fr);border-left:2px solid #4A4D56;margin:4px}
.cf-compas{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:62px;padding:6px 10px;border-right:2px solid #4A4D56;border-bottom:1px solid #26282E;transition:background .3s}
.cf-compas small{position:absolute;top:4px;left:6px;font-size:10.5px;color:#6B6F79}
.cf-compas span{font:600 19px var(--display);color:#8A8E98;margin-top:8px}
.cf-compas.on{background:color-mix(in srgb,var(--sc) 22%,transparent)}
.cf-compas.on span{color:var(--tinta)}
.cf-compas.on small{color:var(--tinta)}
.cf-compas.traba{background:rgba(255,107,87,.2)}
.cf-compas.traba span{color:#FFB8A8}
.cf-compas.ok{box-shadow:inset 0 -3px 0 #5BD49A}
.cf-compas i{position:absolute;top:3px;right:8px;color:#FF6B57;font:800 15px var(--sans);font-style:normal}
.modo-no .cf-compas.on{background:rgba(226,112,90,.22)}
@media (max-width:560px){.cf-compas{min-height:52px;padding:4px 6px}.cf-compas span{font-size:14.5px}}

.layout.sin-video{grid-template-columns:minmax(0,1fr)}
.layout.sin-video .panel-video{display:none}
.layout.sin-video .alumno{max-width:1100px;width:100%;margin:0 auto}
.stop-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stop-top .stop-son{background:none;border:1px solid var(--linea);color:var(--tinta);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.stop-top .stop-son.off{color:var(--gris)}

/* Animaciones de objetivos, puente y ciclo (paso = 0,55 s) */
.anim .ruta-obj li,.anim .rp-meta,.anim .rp-etapa,.anim .rp-flecha,.anim .rp-extremo,.anim .rc-paso,.anim .rc-flecha,.anim.ruta-ciclo circle,.anim .ruta-ciclo circle{animation-play-state:paused}
.anim .ruta-obj li{opacity:0;animation:aeSube .8s ease forwards;animation-delay:calc(var(--k) * .6s)}
.anim .rp-etapa,.anim .rp-extremo{opacity:0;animation:aePop .7s cubic-bezier(.3,1.5,.6,1) forwards;animation-delay:calc(.8s + var(--k) * .85s)}
.anim .rp-flecha{opacity:0;animation:aeFade .5s ease forwards;animation-delay:calc(.8s + var(--k) * .85s)}
.anim .rp-meta{animation:aePop .7s cubic-bezier(.3,1.5,.6,1) forwards,aeBrilla 1.4s ease 2;animation-delay:calc(.8s + var(--k) * .85s),calc(1.5s + var(--k) * .85s)}
.anim .rc-paso{opacity:0;animation:aePopC .7s cubic-bezier(.3,1.5,.6,1) forwards;animation-delay:calc(.8s + var(--k) * .85s)}
.anim .rc-flecha{opacity:0;animation:aeFade .5s ease forwards;animation-delay:calc(.8s + var(--k) * .85s)}
.anim.ruta-ciclo circle,.anim .ruta-ciclo circle{stroke-dasharray:100;stroke-dashoffset:100;animation:aeTrazo linear forwards;animation-duration:calc(var(--n) * .85s);animation-delay:calc(.8s + var(--k0) * .85s)}
.anim.go .ruta-obj li,.anim.go .rp-meta,.anim.go .rp-etapa,.anim.go .rp-flecha,.anim.go .rp-extremo,.anim.go .rc-paso,.anim.go .rc-flecha,.anim.go.ruta-ciclo circle,.anim.go .ruta-ciclo circle{animation-play-state:running}
@keyframes aeSube{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes aePop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes aePopC{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes aeFade{from{opacity:0}to{opacity:1}}
@keyframes aeTrazo{to{stroke-dashoffset:0}}
@keyframes aeBrilla{50%{text-shadow:0 0 14px var(--rc)}}
.ciclo-paso{margin:14px 0}
@media (prefers-reduced-motion:reduce){.anim *{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}

/* Barra de la próxima clase: plegable */
.barra-clase{padding-left:44px}
.bc-cerrar{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;background:none;border:0;color:var(--gris);font-size:16px;cursor:pointer}
.bc-cerrar:hover{color:var(--tinta);background:var(--sup2)}
.barra-clase.plegada{width:max-content;padding:0;margin-right:auto;border-radius:999px}
.bc-solapa{display:flex;align-items:center;gap:10px;padding:9px 16px;background:none;border:0;color:var(--tinta);cursor:pointer;font-size:14px}
.bc-solapa strong{font-family:var(--display);font-weight:600}
.bc-solapa span{color:var(--gris)}
.bc-solapa b{color:var(--naranja);font-size:13px}
/* Consulta por WhatsApp */
.consulta{position:fixed;right:18px;bottom:max(18px,env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:0;height:46px;padding:0 11px;border-radius:999px;background:rgba(27,28,32,.94);border:1px solid var(--linea);color:#5BD49A;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.consulta svg{width:23px;height:23px;flex:none}
.consulta span{max-width:0;overflow:hidden;white-space:nowrap;color:var(--tinta);font-size:14px;font-weight:600;transition:max-width .4s ease,margin .4s ease}
.consulta.con-texto span{max-width:220px;margin-left:9px}
@media (max-width:999px){.consulta{right:12px;bottom:max(12px,env(safe-area-inset-bottom))}.barra-clase:not(.plegada){margin-right:56px}}

.mz-ir{display:inline-flex;align-items:center;gap:4px;margin:2px 0 8px;padding:7px 14px;border-radius:999px;background:var(--mc);color:#0d0e10;border:0;font:600 14px var(--display);cursor:pointer}
.mz-ir:hover{filter:brightness(1.08)}

/* Respuesta ya elegida: solo el mensaje y un link sutil para cambiarla */
.pregunta.respondida .respuesta{margin-top:0}
.cambiar-op{margin-top:8px;padding:2px 0;background:none;border:0;color:var(--tenue,#A4A7AE);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;opacity:.75}
.cambiar-op:hover{opacity:1}
@media (max-width:640px){
  .envio{padding:14px}
  .envio-c{margin-left:0}
  .envio .fila-botones{margin-left:0}
  .envio .fila-botones>.boton-grabar,.envio .fila-botones>.subir-galeria{flex:1 1 0;justify-content:center;text-align:center;padding:11px 10px;font-size:15px;white-space:nowrap}
}
@media (max-width:999px){.consulta{transition:bottom .4s ease}body:has(.barra-clase) .consulta.con-texto{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 62px)}}

/* Video en el celu: botón para abrirlo y ✕ para cerrarlo */
.ver-video-cel{display:none}
.layout.pv-cerrado{grid-template-columns:minmax(0,1fr)}
.layout.pv-cerrado .panel-video{display:none}
.layout.pv-cerrado .alumno{max-width:1100px;width:100%;margin:0 auto}
.pv-cerrar{display:block;margin-left:auto;background:none;border:0;color:var(--gris);font-size:17px;padding:2px 6px;cursor:pointer}
.pv-cerrar:hover{color:var(--tinta)}
@media all{
  .layout.pv-cerrado .ver-video-cel{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;padding:8px 14px;border-radius:999px;background:var(--sup2);border:1px solid var(--linea);color:var(--tinta);font:600 14.5px var(--sans);cursor:pointer}
  .ver-video-cel svg{width:17px;height:17px}
}

/* Ya me lo mandaste: una línea chica, a la derecha */
.envio.envio-ok{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:4px 14px;width:max-content;max-width:100%;margin:14px 0 0 auto;padding:7px 12px;border-radius:999px;font-size:14px}
.envio.envio-ok .envio-t svg{width:16px;height:16px}
.envio.envio-ok .envio-t strong{font-weight:600}
.envio.envio-ok .cambiar-op{margin:0;font-size:12.5px}
.envio.envio-ok .vids,.envio.envio-ok .fila-botones{width:100%;margin-left:0}
.pv-titulo:has(#pv-aviso:empty){padding-top:4px;padding-bottom:4px}
.envio.envio-ok .fila-botones:empty,.envio.envio-ok .vids:empty{display:none}
@media (max-width:640px){.envio.envio-ok{border-radius:12px;gap:0 12px;padding:6px 12px;font-size:13.5px}.envio.envio-ok .cambiar-op{font-size:12px}}

/* «Ya me lo mandaste»: solo una línea de texto, sin recuadro */
.envio.envio-ok{flex-wrap:nowrap;gap:12px;padding:0;margin-top:10px;background:none;border:0;border-radius:0;font-size:13.5px;color:var(--gris)}
.envio.envio-ok .envio-t{gap:6px;white-space:nowrap}
.envio.envio-ok .envio-t svg{width:15px;height:15px}
.envio.envio-ok .envio-t strong{font-weight:500;color:#5BD49A}
.envio.envio-ok .cambiar-op{white-space:nowrap}
.envio.envio-ok:has(.vids:not(:empty)){flex-wrap:wrap}
@media (max-width:640px){.envio.envio-ok{padding:0;font-size:13px;gap:10px}.envio.envio-ok .cambiar-op{font-size:12px}}

/* ---------- Cómo funciona el aula (animación de bienvenida) ---------- */
.boton-mapa2{margin-left:0}
.intro-aula{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:radial-gradient(120% 80% at 50% 30%,#17213A,#0B0B0D 72%);opacity:0;transition:opacity .4s ease}
.intro-aula.visible{opacity:1}
.in-caja{width:100%;max-width:560px;display:flex;flex-direction:column;gap:18px}
.in-sobre{margin:0;font:600 13px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--naranja);text-align:center}
.in-texto{margin:0;min-height:3.9em;text-align:center;font:500 clamp(19px,4.6vw,24px)/1.3 var(--display);color:var(--tinta);opacity:0;transform:translateY(6px)}
.in-texto.ver{opacity:1;transform:none;transition:opacity .6s ease,transform .6s ease}
.in-texto strong{color:#A9BEE8;font-weight:600}
.in-escena{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.in-camino{position:relative;display:flex;flex-direction:column;align-items:center;gap:30px;padding-top:6px}
.in-linea{position:absolute;inset:6px 0 6px 0;width:100%;height:calc(100% - 12px)}
.in-linea line{stroke:var(--linea);stroke-width:2;stroke-dasharray:4 5}
.in-nodo{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sup2);border:1px solid var(--linea);color:var(--gris);font:600 14px var(--sans);transition:all .6s cubic-bezier(.3,1.4,.6,1)}
.in-nodo i{display:none;width:16px;height:16px}
.in-nodo i svg{width:16px;height:16px}
.in-nodo.hecho{background:var(--tinta);color:#111;border-color:var(--tinta)}
.in-nodo.hecho b{display:none}.in-nodo.hecho i{display:block}
.in-nodo.ahora{background:var(--azul);color:#0B1220;border-color:var(--azul);transform:scale(1.18);box-shadow:0 0 0 6px rgba(93,123,182,.18)}
.in-escena[data-s="1"] .in-nodo{animation:inLate 1.2s ease both}
.in-escena[data-s="1"] .in-nodo:nth-child(3){animation-delay:.6s}.in-escena[data-s="1"] .in-nodo:nth-child(4){animation-delay:1.2s}.in-escena[data-s="1"] .in-nodo:nth-child(5){animation-delay:1.8s}
@keyframes inLate{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.1)}100%{opacity:1}}
.in-tarjeta{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--sup);border:1px solid var(--linea);opacity:0;transform:translateX(-10px);transition:opacity .6s ease,transform .6s ease}
.in-escena:not([data-s="1"]) .in-tarjeta{opacity:1;transform:none}
.in-el{opacity:0;transform:translateY(8px);transition:opacity .7s ease,transform .7s ease,box-shadow .6s ease,filter .6s ease}
.in-el.on{opacity:.45;transform:none}
.in-el.on.foco{opacity:1}
.in-escena[data-s="7"] .in-el.on{opacity:.45}.in-escena[data-s="7"] .in-el.foco{opacity:1}
.in-tit{margin:0 0 8px;font:600 15px var(--display);color:var(--tinta)}
.in-renglon{display:block;height:8px;margin:6px 0;border-radius:4px;background:#3A3D44}
.in-vid{position:relative;aspect-ratio:16/6;border-radius:10px;background:#000;border:1px solid var(--linea);display:grid;place-items:center}
.in-vid small{position:absolute;left:10px;bottom:6px;color:var(--gris);font-size:12px}
.in-play{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#E5484D;color:#fff}
.in-play svg{width:18px;height:18px;margin-left:2px}
.in-vid.foco .in-play{animation:inLatido 1.4s ease infinite}
@keyframes inLatido{50%{transform:scale(1.12)}}
.in-doc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--naranja-claro);border:1.5px solid var(--naranja)}
.in-doc-ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--naranja);color:#0B1220}
.in-doc-ico svg{width:20px;height:20px}
.in-doc small{display:block;font:600 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--naranja)}
.in-doc strong{font-size:15px;color:var(--tinta)}
.in-doc.foco{transform:scale(1.04);box-shadow:0 0 0 6px rgba(93,123,182,.18),0 0 34px rgba(93,123,182,.35)}
.in-aux{display:flex;gap:8px;flex-wrap:wrap}
.in-aux span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--sup2);border:1px solid var(--linea);font-size:13.5px;color:var(--tinta)}
.in-aux svg{width:13px;height:13px}
.in-env{position:relative;height:38px}
.in-env>span{position:absolute;inset:0 auto 0 0;display:inline-flex;align-items:center;gap:9px;padding:0 16px;border-radius:10px;font:600 14.5px var(--sans);transition:opacity .5s ease}
.in-grabar{background:var(--blanco);color:#111}
.in-grabar i{width:11px;height:11px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 3px rgba(229,72,77,.25)}
.in-mandado{opacity:0;color:#5BD49A;padding-left:2px!important}
.in-mandado svg{width:16px;height:16px}
.in-env.foco .in-grabar{animation:inBoton 3.6s ease forwards}
.in-env.foco .in-mandado{animation:inMandado 3.6s ease forwards}
.in-escena[data-s="7"] .in-grabar{opacity:0}.in-escena[data-s="7"] .in-mandado{opacity:1}
@keyframes inBoton{0%,35%{opacity:1;transform:none}42%{transform:scale(.95)}50%,100%{opacity:0}}
@keyframes inMandado{0%,50%{opacity:0}62%,100%{opacity:1}}
.in-seg{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;background:var(--blanco);color:#111;font:600 14.5px var(--sans)}
.in-seg svg{width:16px;height:16px}
.in-ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px}
.in-puntos{display:flex;gap:6px}
.in-puntos i{width:7px;height:7px;border-radius:50%;background:var(--linea);transition:background .3s}
.in-puntos i.on{background:var(--azul)}
.in-ctrl .primario{min-width:118px}
@media (max-width:560px){.in-caja{gap:14px}.in-escena{grid-template-columns:38px 1fr;gap:10px}.in-nodo{width:30px;height:30px}.in-camino{gap:26px}.in-tarjeta{padding:12px;gap:9px}}
@media (prefers-reduced-motion:reduce){.intro-aula *{animation:none!important;transition:none!important}}
.in-doc.on{opacity:.85}.in-doc.on.foco{opacity:1}.in-escena[data-s="7"] .in-doc.on{opacity:.85}
.hero-botones{margin-left:auto;display:flex;gap:8px}
.hero-botones .boton-mapa{margin-left:0}
@media (max-width:560px){.hero-botones .boton-mapa{padding:6px 11px;font-size:13px}.hero-botones .boton-mapa span{display:none}.hero-botones .boton-mapa:last-child::after{content:'Mapa'}}
.mod-banner-chico{padding-top:14px;padding-bottom:2px}.mod-banner-chico h2{font-size:17px;color:var(--mc)}.mod-banner-chico::before{top:19px}
.in-escena{transition:opacity .6s ease}.in-escena[data-s="0"]{opacity:0}
.in-escena[data-s="0"]{display:none}.in-caja:has(.in-escena[data-s="0"]) .in-texto{font-size:clamp(30px,7.5vw,42px);min-height:0;margin:10px 0 30px}
.stop-texto.grande{min-height:120px;font-size:clamp(21px,3.4vw,27px);line-height:1.3;color:var(--naranja)}
@media (max-width:560px){.stop-texto.grande{font-size:20px;min-height:128px}}
.stop-texto.grande{min-height:260px;font-size:clamp(22px,3.8vw,30px)}
@media (max-width:560px){.stop-texto.grande{min-height:300px;font-size:22px}}

/* Bienvenida: «Arrancar» se destaca al final */
.in-ctrl .primario.in-final{background:var(--naranja);color:#0B1220;animation:inArrancar 1.6s ease infinite;box-shadow:0 0 0 0 rgba(93,123,182,.55)}
@keyframes inArrancar{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(93,123,182,.55)}50%{transform:scale(1.07);box-shadow:0 0 0 12px rgba(93,123,182,0)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(93,123,182,0)}}

/* «Escribime» cuando algo cuesta */
.escribime{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:9px 16px;border-radius:999px;background:#1F8A57;color:#fff;font-weight:600;font-size:15px;text-decoration:none}
.escribime svg{width:18px;height:18px}
.escribime:hover{background:#25A065}
.consulta.llamando{animation:llamaWA 1.4s ease 4;border-color:#5BD49A}
@keyframes llamaWA{0%{box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 0 0 rgba(91,212,154,.55)}70%{box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 0 16px rgba(91,212,154,0)}100%{box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 0 0 rgba(91,212,154,0)}}

.seguir-cuesta{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seguir-cuesta .escribime{margin-top:0;padding:12px 20px;font-size:16px}
.seguir-cuesta .secundario{padding:12px 18px}

/* Ya le salió: mensaje verde del ancho de su texto y «Seguir» al lado, misma altura */
.fila-resp{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 12px;margin-top:16px}
.fila-resp .pregunta{flex:0 1 auto;margin:0;min-width:0}
.fila-resp .respuesta{margin-top:0;display:inline-flex;align-items:center;min-height:52px;padding:10px 18px 10px 14px;box-sizing:border-box}
.fila-resp .respuesta p{margin:0}
.fila-resp .seguir{margin-top:0;flex:none}
.fila-resp .seguir .primario{min-height:52px;padding:0 20px}
.fila-resp{flex-wrap:nowrap}.fila-resp .pregunta{display:flex;flex-direction:column;align-items:flex-start;padding:0;border:0;background:none}.fila-resp .cambiar-op{margin-top:6px}@media (max-width:400px){.fila-resp .respuesta{padding:10px 14px 10px 12px}.fila-resp .seguir .primario{padding:0 16px}}

.fila-resp{display:block}
.fila-fila{display:flex;align-items:stretch;gap:10px}
.fila-fila .respuesta{flex:0 1 auto;margin:0}
.fila-fila .seguir{display:flex}
.fila-fila .seguir .primario{min-height:52px;height:100%}

/* «Ok» para cerrar una recomendación */
.respuesta{position:relative}
.rec-ok{position:absolute;top:10px;right:10px;padding:5px 14px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;font:600 13px var(--sans);opacity:.8;cursor:pointer}
.rec-ok:hover{opacity:1}
.resp-rec .resp-tit{padding-right:56px}

.rec-min{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:6px 14px;border-radius:999px;border:1px solid rgba(93,123,182,.5);background:rgba(93,123,182,.08);color:#A9BEE8;font:600 13.5px var(--sans);cursor:pointer}
.rec-min svg{width:15px;height:15px}
.rec-min:hover{background:rgba(93,123,182,.16)}
.resp-rec>div{flex:1}
.rec-pie{display:flex;justify-content:flex-end;margin-top:10px}
.rec-ok{position:static;padding:6px 18px}
.resp-rec .resp-tit{padding-right:0}

/* «Escribime para destrabar este paso» */
.resp-wa{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px 18px;border-radius:12px;background:#12251C;border:1.5px solid #3FB37F;color:#5BD49A;font-weight:600;font-size:16px;text-decoration:none;animation:aparecerResp .35s ease}
.resp-wa svg{width:24px;height:24px;flex:none}
.resp-wa span{color:var(--tinta)}
.resp-wa:hover{background:#163021}
.pregunta.respondida .resp-wa{margin-top:0}
.consulta{transition:opacity .5s ease}
.consulta.apagado{opacity:0;pointer-events:none}
.pv-cerrar{font-size:13.5px!important;font-weight:600;padding:4px 10px!important;border:1px solid var(--linea)!important;border-radius:999px}
.seguir [data-rec-ok]{padding:12px 34px;font-size:17px}

/* Presentación para quienes tienen la llamada (?llamada) */
.llamada{max-width:720px;margin:6vh auto 70px;padding:0 20px}
.ll-sobre{margin:0 0 10px;font:600 13px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--naranja)}
.llamada h1{font-size:clamp(26px,5vw,36px);line-height:1.15;margin:0 0 16px}
.llamada h2{font-size:22px;margin:44px 0 14px}
.ll-texto{font-size:18px;line-height:1.5;color:var(--tinta);margin:0 0 10px}
.ll-video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--linea);margin-top:22px}
.ll-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ll-boton{margin-top:26px;padding:14px 26px;font-size:17px}
.ll-testimonios{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.ll-testimonios figure{margin:0}.ll-testimonios .ll-video{margin-top:0}
.ll-testimonios figcaption{margin-top:8px;font-weight:600;color:var(--gris)}
.ll-fin{text-align:center;font-size:20px;font-weight:600;margin:30px 0 10px}


/* Dibujitos de los cuadros de solo texto */
.vis-grande{display:block;width:min(360px,86%);height:auto;margin:14px auto 0;overflow:visible}
.vg-cuerda{stroke:#cfc7bd;stroke-width:2.4;stroke-linecap:round;transition:stroke .4s}
.vg-cuerda.on{stroke:var(--azul)}
.vg-cuerda.tenue{stroke:#45464c}
.vg-cuerda.vibra{stroke:var(--azul);animation:vgVibra 1.6s ease-in-out infinite;animation-delay:calc(var(--k)*.35s);transform-box:fill-box;transform-origin:center}
@keyframes vgVibra{0%,60%,100%{transform:scaleY(1)}10%{transform:translateY(-2.5px)}20%{transform:translateY(2px)}30%{transform:translateY(-1px)}}
.vg-cuerda.sep{stroke:var(--azul);animation:vgSep 3.2s ease-in-out infinite}
.vg-cuerda.sep0{--d:-12px}.vg-cuerda.sep1{--d:0px;animation-name:vgSep1}.vg-cuerda.sep2{--d:12px}
@keyframes vgSep{0%,15%,85%,100%{transform:translateY(0)}35%,65%{transform:translateY(var(--d))}}
@keyframes vgSep1{0%,15%,85%,100%{opacity:1}35%,65%{opacity:.35}}
.vg-cuerda.traba{stroke:#E2705A;animation:vgVibra 1.2s ease-in-out infinite}
.vg-alerta{fill:#E2705A;font:800 22px var(--display);animation:vgParpadeo 1.2s ease-in-out infinite}
@keyframes vgParpadeo{50%{opacity:.25}}
.vg-cuerda.ok{stroke:#3FA56B;animation:vgOk .6s ease both;animation-delay:calc(var(--k)*.25s)}
@keyframes vgOk{from{stroke:#cfc7bd}}
.vg-check{fill:none;stroke:#3FA56B;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:44;stroke-dashoffset:44;animation:vgDibuja .6s .9s ease forwards}
@keyframes vgDibuja{to{stroke-dashoffset:0}}
.vg-metro{fill:none;stroke:#8a8b90;stroke-width:2}
.vg-pendulo{stroke:var(--tinta);stroke-width:2.5;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%;animation:vgPend .55s ease-in-out infinite alternate}
.vg-pendulo.lento{animation-duration:1.6s}
@keyframes vgPend{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.vg-cap{font:600 12px var(--sans);fill:var(--gris);text-anchor:middle}
.vg-cap.on{fill:var(--naranja)}
.vg-mal{opacity:.55}
.vg-punto{fill:var(--azul)}
.vg-punto.se-va{animation:vgSeVa 3.6s ease-in-out infinite}
@keyframes vgSeVa{0%,20%{opacity:1;transform:scale(1)}45%,85%{opacity:.08;transform:scale(.6)}100%{opacity:1}}
.vg-punto{transform-box:fill-box;transform-origin:center}
.vg-pulso{stroke:#4a4b51;stroke-width:2}
.vg-beat{fill:var(--tinta);animation:vgBeat 2.4s linear infinite}
@keyframes vgBeat{from{transform:translateX(0)}to{transform:translateX(280px)}}
.vg-caja{fill:none;stroke:#5a5b61;stroke-width:2}
.vg-caja.base{fill:var(--naranja);stroke:var(--naranja);opacity:.85}
.vg-caja.suma{stroke:var(--naranja);animation:vgAparece 4.8s ease infinite;animation-delay:calc((var(--k) - 4)*.6s);opacity:0}
@keyframes vgAparece{0%{opacity:0;transform:translateY(6px)}12%,80%{opacity:1;transform:none}100%{opacity:0}}
.vg-caja.todo{stroke:#E2705A;fill:rgba(226,112,90,.15);animation:vgTiembla .5s ease-in-out infinite;animation-delay:calc(var(--k)*.05s)}
@keyframes vgTiembla{25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
.vg-ciclo{fill:none;stroke:#4a4b51;stroke-width:3}
.vg-viaja{fill:var(--azul);transform-origin:160px 48px;animation:vgGira 2.8s linear infinite}
@keyframes vgGira{to{transform:rotate(360deg)}}
.vg-flecha{fill:none;stroke:#4a4b51;stroke-width:3;stroke-linecap:round}
@media (prefers-reduced-motion:reduce){.vis-grande *{animation:none!important;opacity:1!important}}
.stop-texto.grande{gap:2px}
.vg-cuerda.suma-mal{stroke:#E2705A;opacity:0;animation:vgAparece 5.4s ease infinite;animation-delay:calc(var(--k)*.55s)}

/* Visor de docs adentro del aula (celu) */
.doc-visor{position:fixed;inset:0;z-index:3000;background:#fff;display:flex;flex-direction:column}
.dv-barra{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:#1B1C20;color:#fff}
.dv-cerrar{background:none;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 16px;font:600 15px var(--sans);color:#fff;cursor:pointer}
.dv-barra a{font-size:14px;color:#5D7BB6}
.dv-marco{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#fff}
.dv-cargando{padding:40px 20px;text-align:center;color:#555;font:16px var(--sans)}
body.dv-abierto{overflow:hidden}

/* Stop: primer «Reproducir» grande, encima de la animación */
.stop-pantalla{position:relative}
.stop-play-grande{position:absolute;inset:-4px;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:0;border-radius:14px;background:rgba(18,19,23,.72);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);cursor:pointer;color:#fff}
.spg-boton{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 8px 28px rgba(0,0,0,.45);animation:spgLatido 1.8s ease-in-out infinite;transition:transform .2s}
.spg-boton svg{width:38px;height:38px;fill:#1B1C20;margin-left:5px}
.spg-txt{font:700 17px var(--sans);letter-spacing:.02em}
.stop-play-grande:hover .spg-boton{transform:scale(1.06)}
@keyframes spgLatido{0%,100%{box-shadow:0 8px 28px rgba(0,0,0,.45),0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 8px 28px rgba(0,0,0,.45),0 0 0 14px rgba(255,255,255,0)}}
.vg-cuerda.se-apaga{stroke:var(--azul);animation:vgApaga 4s ease-in-out infinite}
@keyframes vgApaga{0%,20%{stroke:var(--azul);opacity:1}45%,85%{stroke:#45464c;opacity:.6}100%{stroke:var(--azul);opacity:1}}

/* Dibujitos del acompañamiento por WhatsApp */
.vg-burbuja{fill:#2b2c31;opacity:0;animation:vgAparece 5.4s ease infinite;animation-delay:calc(var(--k)*.8s)}
.vg-burbuja.yo{fill:#1f6b4a}
.vg-tipeo{fill:#9a9ba0;animation:vgParpadeo 1s ease-in-out infinite;animation-delay:calc(var(--k)*.2s)}
.vg-marca{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:vgAparece 6s ease infinite;animation-delay:calc(var(--k)*.45s)}
.vg-marca.ok{stroke:#3FA56B}.vg-marca.mal{stroke:#E2705A}
.vg-cuerda.traba-ok{animation:vgTrabaOk 3s ease infinite;stroke-width:3}
@keyframes vgTrabaOk{0%,40%{stroke:#E2705A}60%,100%{stroke:#3FA56B}}
.vg-check.tarde{animation:vgDibuja .6s 1.6s ease forwards}
.vg-ciclo.chico{fill:none;stroke:#4a4b51;stroke-width:3}
.vg-viaja.corto{transform-origin:80px 56px;animation:vgGira 1.4s linear 2,vgSale 4.2s linear infinite}
@keyframes vgSale{0%,66%{opacity:1}67%,100%{opacity:0}}
.vg-flecha-larga{fill:none;stroke:var(--naranja);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:260;stroke-dashoffset:260;animation:vgDibuja 1s 1s ease forwards}
.vg-signo{fill:var(--naranja);font:800 54px var(--display);text-anchor:middle;animation:vgParpadeo 2s ease-in-out infinite}
.vg-onda{fill:none;stroke:var(--naranja);stroke-width:2;transform-origin:160px 56px;animation:vgOnda 2s ease-out infinite}
@keyframes vgOnda{from{transform:scale(.6);opacity:.8}to{transform:scale(1.5);opacity:0}}
.vg-barra{fill:#2b2c31}.vg-justa{fill:rgba(63,165,107,.45);stroke:#3FA56B;stroke-width:1.5}
.vg-aguja{fill:#fff;animation:vgAguja 4s ease-in-out infinite}
@keyframes vgAguja{0%,10%{transform:translateX(0)}35%,60%{transform:translateX(140px)}75%{transform:translateX(250px);fill:#E2705A}100%{transform:translateX(140px)}}
.vg-video{fill:#2b2c31;stroke:#5a5b61;stroke-width:2}.vg-video.on{stroke:var(--naranja)}
.vg-play{fill:#77787d}.vg-play.on{fill:var(--naranja)}
.vg-tacha{stroke:#E2705A;stroke-width:4;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;animation:vgDibuja .7s .8s ease forwards}
.vg-ruta{fill:none;stroke:#4a4b51;stroke-width:3;stroke-dasharray:6 7}
.vg-viajero{fill:var(--naranja)}

/* Cuadros de solo texto en el azul de Ajuste Elástico */
.stop-texto.grande{color:var(--azul)}
.stop-texto.grande strong{color:var(--azul-txt)}
.stop-texto.grande.malo{color:#FFB8A8}
.stop-texto.grande.malo strong{color:#FFD3C8}

/* Logo de AE en más lugares */
.logo-ae{display:flex;justify-content:center;margin:0 auto 14px}
.logo-ae svg{height:58px;width:auto;display:block}
