<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula de Ajuste Elástico</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ajuste Elástico">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111214">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Tema oscuro, en la línea del Área de Miembros, con los colores de Ajuste Elástico */
  --fondo:#111214; --sup:#1B1C20; --sup2:#24262B; --linea:#2E3036;
  --tinta:#EDEEF0; --gris:#9DA2AC; --blanco:#FFFFFF;
  --azul:#5D7BB6; --azul-txt:#A9BEE8; --azul-osc:#3A4F7A; --azul-claro:#22304A; --azul-velo:#1A2232;
  --oxido:#E2643A; --oxido-txt:#F29A78; --oxido-claro:#3A2219; --naranja:#E8834F; --naranja-claro:#33241B;
  --papel:var(--fondo);
  --radio-s:6px; --radio-m:12px;
  --sans:'Source Sans 3', system-ui, sans-serif; --display:'Poppins', system-ui, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);color-scheme:dark;font:400 17px/1.55 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul-txt);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--naranja);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;margin:0;letter-spacing:-.01em}
.suave{color:var(--gris)} .chico{font-size:14px}
.link{color:var(--azul-txt);text-decoration:underline;text-underline-offset:3px}
.link.suave{color:var(--gris)}
.primario{background:#FFFFFF;color:#111214;padding:11px 22px;border-radius:8px;font-weight:600}
.primario:hover{background:#E4E5E8}
.secundario,.boton{display:inline-block;border:1px solid #4A4D55;color:var(--tinta);padding:8px 16px;border-radius:8px;font-weight:600;text-decoration:none;background:var(--sup2);font-size:15px}
.secundario:hover,.boton:hover{background:var(--azul-velo)}

/* Barra */
.barra{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:var(--fondo);border-bottom:1px solid var(--linea)}
.marca svg{height:56px;width:auto;display:block}
.barra-der{display:flex;gap:14px;align-items:center;font-size:15px}
.quien{font-weight:600}
.firma{font-family:var(--display);font-weight:500;font-size:17px;letter-spacing:.02em;color:#3A4F7A;white-space:nowrap}
.salir-pie{margin:26px 0 8px;text-align:center;font-size:14px;color:var(--gris)}
.registro-adm{margin:18px 0 26px;padding:16px 18px;border:1px solid var(--linea);border-radius:var(--radio-m);background:var(--sup)}
.registro-adm .reg-cab{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.registro-adm h2{font-size:18px}
.registro-adm p{margin:4px 0 0;max-width:62ch}
.registro-adm textarea{width:100%;margin:12px 0 10px}
.marca-ajustar{display:block;font-size:13px;color:var(--azul-txt);font-weight:600}
.aviso-ajustar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin:10px 0 14px;padding:12px 14px;border:1.5px solid var(--azul);border-radius:var(--radio-s);background:var(--azul-velo)}
.aviso-ajustar p{margin:0}
@media (max-width:600px){.firma{font-size:14px}.registro-adm .reg-cab,.aviso-ajustar{flex-direction:column;align-items:stretch}}

/* Entrada */
.entrada{max-width:460px;margin:8vh auto 60px;padding:0 20px}
.entrada h1{font-size:30px;margin-bottom:10px}
.entrada form{display:grid;gap:10px;margin:26px 0}
.entrada label{font-weight:600}
.entrada input{padding:12px 14px;border:1.5px solid var(--linea);border-radius:var(--radio-s);background:var(--sup);font-size:18px}
.entrada .primario{justify-self:start}
.error{color:var(--oxido-txt);margin:0}
.demo{border-left:3px solid var(--naranja);padding:4px 0 4px 16px;margin-top:30px}
.demo ul{margin:6px 0 12px;padding-left:20px}

/* Alumno: camino a la izquierda, video a la derecha (arriba en el celular) */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,46%);gap:0;max-width:1440px;margin:0 auto}
.alumno{padding:0 40px 120px;min-width:0}
.alumno h2{font-size:20px;margin:0 0 14px}
.panel-video{position:sticky;top:0;align-self:start;height:100vh;padding:24px 32px 24px 8px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.pv-marco{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--linea)}
.pv-marco iframe,.pv-marco #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.pv-titulo{margin:0;font-family:var(--display);font-weight:500;font-size:15px;color:var(--gris);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pv-aviso{font-family:var(--sans);font-size:13px;font-weight:600;color:#1B1208;background:var(--naranja);padding:2px 10px;border-radius:999px;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.pv-aviso.ver{opacity:1;transform:none}
.panel-video.cambio .pv-marco{animation:cambioVideo .7s ease}
@keyframes cambioVideo{0%{box-shadow:0 0 0 0 rgba(232,131,79,.9)}40%{box-shadow:0 0 0 6px rgba(232,131,79,.55)}100%{box-shadow:0 0 0 0 rgba(232,131,79,0)}}

/* Encabezado */
.hero{padding:28px 0 6px}
.hero-prog{margin:0;color:var(--gris);font-size:15px;display:flex;flex-wrap:wrap;gap:4px 16px}
.hero-prog span{color:var(--tinta)}
.hero h1{font-size:clamp(30px,5vw,42px);margin:4px 0 14px;letter-spacing:-.02em}
.estado{display:grid;gap:2px;padding-left:14px;border-left:4px solid var(--azul);margin-bottom:20px}
.estado strong{font-family:var(--display);font-weight:600;font-size:18px;color:var(--azul-txt)}
.estado span{color:var(--gris);font-size:16px}
.estado-meterle{border-left-color:var(--oxido)} .estado-meterle strong{color:var(--oxido-txt)}
.estado-adelantado,.estado-m2{border-left-color:var(--naranja)} .estado-adelantado strong,.estado-m2 strong{color:var(--naranja)}
.estado-pausa{border-left-color:var(--linea)} .estado-pausa strong{color:var(--gris)}
.tira{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tramo{display:grid;gap:6px;min-width:0;align-content:start}
.barra-tramo{height:6px;border-radius:999px;background:var(--sup2);overflow:hidden}
.barra-tramo span{display:block;height:100%;width:calc(var(--lleno) * 100%);background:var(--tinta);border-radius:999px}
.tramo.prox .barra-tramo span{background:var(--naranja)}
.tramo.prox.meterle .barra-tramo span{background:var(--oxido)}
.tramo-txt{display:flex;align-items:center;gap:3px;font-family:var(--display);font-weight:500;font-size:12.5px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tramo-txt svg{width:13px;height:13px;flex:none}
.tramo.tuvo .tramo-txt,.tramo.prox .tramo-txt{color:var(--tinta)}
.tramo.prox .tramo-txt{font-weight:600}
.tramo-sub{font-size:12px;color:var(--naranja);margin-top:-4px;font-weight:600}
.tramo.meterle .tramo-sub{color:var(--oxido-txt)}
.tira.animar .barra-tramo span{animation:llenar .9s cubic-bezier(.3,.7,.2,1) both}
@keyframes llenar{from{width:0}}
.clase-hecha{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:15px}
.clase-hecha p{margin:0;width:100%;font-weight:600}

.nota{margin:22px 0 0;padding:14px 18px;background:var(--naranja-claro);border-left:3px solid var(--naranja);border-radius:0 var(--radio-m) var(--radio-m) 0}
.nota p{margin:0}
.nota cite{display:block;font-style:normal;font-size:14px;color:var(--naranja);font-weight:600;margin-top:6px}
.de-andy{margin-top:24px}
.extra{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--sup);border-radius:var(--radio-m);margin-bottom:8px;cursor:pointer;border:1px solid var(--naranja)}
.extra input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--naranja);flex:none}

/* El camino */
.camino{position:relative;margin-top:34px;padding-bottom:10px}
.trazo{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.trazo-base{fill:none;stroke:#3A3D45;stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round}
.trazo-hecho{fill:none;stroke:var(--naranja);stroke-width:4;stroke-linecap:round;opacity:.9}
.etapa-label{position:relative;z-index:1;margin:30px 0 12px 64px;background:var(--fondo);padding:4px 10px 4px 0;width:max-content;max-width:calc(100% - 64px)}
.etapa-label:first-of-type{margin-top:6px}
.etapa-label h3{font-size:13.5px;font-family:var(--sans);font-weight:600;color:var(--gris);margin:0}
.etapa-label p{margin:0;font-size:13.5px;color:#6E737D}
.nodo{position:relative;margin:0 0 6px calc(var(--ola))}
.nodo-fila{display:flex;align-items:center;gap:14px}
.punto{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--sup2);border:2px solid #3A3D45;color:var(--gris);font-family:var(--display);font-weight:600;font-size:15px;transition:transform .15s}
.punto svg{width:22px;height:22px}
.punto:hover{transform:scale(1.06)}
.est-listo .punto,.est-casi .punto{background:var(--tinta);border-color:var(--tinta);color:#111}
.est-cuesta .punto{border-color:var(--oxido);color:var(--oxido-txt);background:var(--oxido-claro)}
.nodo-tit{text-align:left;padding:6px 4px;display:grid;gap:1px}
.nodo-tit span{font-size:16.5px;line-height:1.3}
.est-listo .nodo-tit span,.est-casi .nodo-tit span{color:var(--gris)}
.nodo-tit small{font-size:14px;color:var(--gris)}
.nodo-tit small.oxido{color:var(--oxido-txt);font-weight:600}
.nodo.abierto{margin:14px 0 22px}
.nodo.abierto .punto{width:58px;height:58px;font-size:18px;background:var(--naranja);border-color:var(--naranja);color:#1B1208;box-shadow:0 0 0 7px rgba(232,131,79,.18)}
.nodo.abierto.est-listo .punto,.nodo.abierto.est-casi .punto{background:var(--naranja);border-color:var(--naranja)}
.nodo.abierto .nodo-tit span{font-family:var(--display);font-weight:600;font-size:22px;color:var(--tinta);line-height:1.2}
.tarjeta{position:relative;z-index:1;margin:12px 0 0 0;background:var(--sup);border:1px solid var(--linea);border-radius:14px;padding:20px 22px 22px;animation:abrir .25s cubic-bezier(.2,.8,.3,1) both}
@keyframes abrir{from{opacity:0;transform:translateY(-6px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--azul-claro);color:var(--azul-txt);white-space:nowrap}
.chip svg{width:15px;height:15px}
.chip-oxido{background:var(--oxido-claro);color:var(--oxido-txt)}
.consigna p{margin:0 0 10px;color:#D6D9DF}
.consigna strong{color:var(--tinta)}
.reglas{margin:0 0 12px;padding-left:22px;color:#D6D9DF}
.reglas li{margin:5px 0}
.link-seek{display:inline-flex;align-items:center;gap:4px;color:var(--azul-txt);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link-seek svg{width:14px;height:14px}
.material{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.mat{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;background:var(--sup2);border:1px solid var(--linea);border-radius:10px;color:var(--tinta)!important;text-decoration:none;font-weight:600;font-size:15px;text-align:left}
.mat:hover{border-color:#5A5E68}
.mat svg{width:17px;height:17px;flex:none;color:var(--naranja)}
a.mat svg{color:var(--azul-txt)}
.mat small{display:block;font-weight:400;color:var(--gris);font-size:13px}
.pregunta{margin-top:18px;padding-top:16px;border-top:1px solid var(--linea)}
.pregunta h4{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 10px}
.ops{display:grid;gap:8px}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--linea);background:var(--sup2);font-weight:600;font-size:16px;line-height:1.3;color:var(--tinta)}
.op:hover{border-color:#5A5E68}
.op-punto{width:18px;height:18px;border-radius:50%;border:2px solid #5A5E68;flex:none}
.op.sel{border-color:var(--tinta);background:#2A2C32}
.op.sel .op-punto{border:6px solid var(--tinta)}
.op.sel.nivel-cuesta{border-color:var(--oxido);background:var(--oxido-claro)}
.op.sel.nivel-cuesta .op-punto{border-color:var(--oxido-txt)}
.respuesta{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--azul);background:var(--azul-velo);animation:aparecerResp .35s cubic-bezier(.2,.8,.3,1) both}
@keyframes aparecerResp{from{opacity:0;transform:translateY(4px) scale(.98)}}
.respuesta p{margin:0 0 4px;color:var(--tinta)}
.respuesta p:not(.resp-tit) + p{margin-top:10px}
.resp-tit{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.01em;color:var(--azul-txt)!important;margin-bottom:2px!important}
.resp-ico{flex:none;width:28px;height:28px;margin-top:1px;color:var(--azul-txt)}
.resp-ico svg{width:28px;height:28px}
.resp-ok{border-color:#3FB37F;background:#12251C}
.resp-ok .resp-ico,.resp-ok .resp-tit{color:#5BD49A!important}
.resp-rec.nivel-casi{border-color:var(--naranja);background:var(--naranja-claro)}
.resp-rec.nivel-casi .resp-ico,.resp-rec.nivel-casi .resp-tit{color:var(--naranja)!important}
.resp-rec.nivel-cuesta{border-color:var(--oxido);background:var(--oxido-claro)}
.resp-rec.nivel-cuesta .resp-ico,.resp-rec.nivel-cuesta .resp-tit{color:var(--oxido-txt)!important}
.festejo .resp-tit{font-size:17px}
.confeti{position:fixed;inset:0;pointer-events:none;z-index:50}
.apoyo{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--naranja-claro)}
.apoyo h4,.dificultades h4{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:15px}
.apoyo>p{margin:0 0 6px;font-size:15.5px;color:#D6D9DF}
.apoyo-item{padding-top:10px}
.apoyo-t{margin:0;font-weight:600}
.apoyo-c{margin:0 0 6px;font-size:14.5px;color:var(--gris)}
.apoyo-links{display:flex;flex-wrap:wrap;gap:8px}
.dificultades{margin-top:16px}
.dif{padding:10px 0;border-top:1px solid var(--linea)}
.dif:first-of-type{border-top:0;padding-top:2px}
.dif p{margin:0 0 4px;color:#D6D9DF}
.dif .dif-q{font-weight:600;color:var(--tinta)}
.dif a{display:inline-block;margin-right:14px}
.seguir{margin-top:18px}
.seguir .primario{display:inline-grid;grid-template-columns:auto auto;align-items:center;gap:0 12px;text-align:left;padding:12px 20px}
.seguir .primario span{font-size:17px}
.seguir .primario small{grid-row:2;font-weight:500;font-size:13.5px;color:#4A4D55;max-width:320px}
.seguir .primario svg{grid-row:1/3;grid-column:2;width:20px;height:20px}
.standards{display:flex;flex-wrap:wrap;gap:8px}
.chip-op{padding:8px 14px;border-radius:999px;border:1.5px solid var(--linea);background:var(--sup2);font-weight:500;font-size:15px;color:var(--tinta)}
.chip-op:hover{border-color:#5A5E68}
.chip-op.sel{background:var(--tinta);border-color:var(--tinta);color:#111;font-weight:600}
.otro-standard{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.otro-standard input{flex:1 1 140px;min-width:0;width:100%;padding:8px 14px;border:1.5px solid var(--linea);border-radius:999px;background:var(--sup2);color:var(--tinta)}
.meta{position:relative;display:flex;align-items:center;gap:14px;margin:26px 0 0 0}
.meta span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:2px dashed #3A3D45;color:#6E737D;background:var(--fondo);position:relative;z-index:1}
.meta span svg{width:20px;height:20px}
.meta p{margin:0;color:#6E737D;font-family:var(--display);font-weight:500}
.pie{margin-top:34px;color:var(--gris);font-size:15px}

@media (max-width:999px){
    .layout{display:flex;flex-direction:column-reverse}
  .panel-video{position:sticky;top:0;z-index:5;height:auto;padding:0;background:var(--fondo);gap:0;width:100%}
  .pv-marco{border-radius:0;border:0;border-bottom:1px solid var(--linea)}
  .pv-titulo{padding:6px 16px;font-size:13.5px;border-bottom:1px solid var(--linea)}
  .alumno{padding:0 18px 100px}
}
@media (max-width:560px){
  .tira{gap:4px}
  .tramo-txt{font-size:11px}
  .nodo{margin-left:calc(var(--ola) * .5)}
  .nodo.abierto{margin-left:0}
  .tarjeta{padding:16px 16px 18px;margin-left:-4px;margin-right:-4px}
  .etapa-label{margin-left:58px;max-width:calc(100% - 58px)}
  .nodo.abierto .nodo-tit span{font-size:19px}
  .punto{width:42px;height:42px}
  .nodo.abierto .punto{width:50px;height:50px}
}


.apoyo-parte{margin:12px 0 6px;font-size:13px;font-weight:600;color:var(--tenue,#A4A7AE);}

.lineas{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
.lineas path{fill:none;stroke-linecap:round}
.lineas .l-cuerpo{stroke:url(#lg-cuerpo)}
.lineas .l-filo{stroke:url(#lg-filo)}
.layout{position:relative;z-index:1}
.etapa-label{background:none!important;text-shadow:0 0 12px var(--fondo),0 0 4px var(--fondo)}
/* Documento nuevo */
.doc-nuevo{display:flex;align-items:center;gap:14px;margin:16px 0 4px;padding:14px 16px;border-radius:12px;background:#1E2A44;border:1px solid #5D7BB6;color:var(--tinta);text-decoration:none;transition:border-color .15s,background .15s}
.doc-nuevo:hover{background:#243256;border-color:#8FA6D6}
.doc-nuevo .dn-ico{width:40px;height:40px;border-radius:10px;background:#5D7BB6;color:#fff;display:grid;place-items:center;flex:none}
.doc-nuevo .dn-ico svg{width:20px;height:20px}
.doc-nuevo small{display:block;font-size:12.5px;color:#AFC0E6;font-weight:600}
.doc-nuevo strong{display:block;font-size:16px}
.doc-nuevo>svg{margin-left:auto;width:18px;height:18px;transform:rotate(-90deg);opacity:.7;flex:none}
.doc-nuevo>span:nth-child(2){min-width:0}
.pv-aviso:empty{display:none}
/* Envío obligatorio antes de seguir */
.envio{margin-top:18px;padding:16px 18px;border-radius:12px;background:#2A1E16;border:1px solid #E8834F}
.envio-t{display:flex;gap:10px;align-items:center;margin:0}
.envio-t svg{width:20px;height:20px;color:#E8834F;flex:none}
.envio-c{margin:6px 0 12px 30px;color:var(--tenue,#A4A7AE);font-size:15px}
.envio .fila-botones{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-left:30px}
.envio-check{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:8px;background:var(--sup2);cursor:pointer;font-weight:600}
.envio-check input{width:18px;height:18px;accent-color:#3FB37F}
.envio-ok{background:#12251C;border-color:#3FB37F}
.envio-ok .envio-t svg{color:#3FB37F}
.envio-ok .fila-botones{margin-top:10px}
.nota-paso{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--sup2);font-size:15px;color:var(--tinta)}
.barra{position:relative;z-index:2}
.tip-paso{display:flex;gap:12px;align-items:flex-start;margin:14px 0 0;padding:14px 16px;border-radius:12px;background:#2A2416;border:1px solid #C9A24A}
.tip-paso svg{width:22px;height:22px;flex:none;color:#E9C46A;margin-top:2px}
.tip-paso p{margin:0;font-size:15.5px}

/* Miniatura del video en cada paso del camino */
.nodo-fila .mini{flex:none;margin-left:auto;width:80px;aspect-ratio:16/9;border-radius:7px;overflow:hidden;border:1px solid var(--linea);background:var(--sup2);padding:0}
.nodo-fila .mini img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.est-listo .nodo-fila .mini img,.est-casi .nodo-fila .mini img{opacity:.5}
/* Barra fija: avance para la próxima clase */
.barra-clase{position:sticky;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;margin-top:28px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 14px 12px 18px;background:rgba(27,28,32,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--linea);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.bc-izq{display:grid;gap:2px;min-width:0}
.bc-izq strong{font-family:var(--display);font-weight:600;font-size:15px}
.bc-izq>span:not(.bc-puntos){font-size:14px;color:var(--gris)}
.bc-puntos{display:flex;gap:5px;margin-top:4px}
.bc-puntos i{width:9px;height:9px;border-radius:50%;background:var(--linea)}
.bc-puntos i.ok{background:var(--tinta)}
.bc-puntos i.ahora{background:var(--naranja);box-shadow:0 0 0 3px rgba(232,131,79,.25)}
.bc-sig{display:grid;text-align:right;gap:1px;max-width:58%;padding:8px 12px;border-radius:10px;background:var(--sup2);border:1px solid var(--linea)}
.bc-sig small{font-size:12.5px;color:var(--naranja);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.bc-sig span{font-size:14.5px;font-weight:600;line-height:1.25;color:var(--tinta);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bc-listo{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:#5BD49A;text-align:right}
.bc-listo svg{width:18px;height:18px;flex:none}
.bc-listo.bc-ultimo{color:var(--gris);font-weight:400}
body:has(.barra-clase) #aviso{bottom:104px}
@media (max-width:560px){
  .nodo-fila .mini{width:64px}
  .barra-clase{padding:10px 10px 10px 14px;gap:10px}
  .bc-sig{max-width:55%;padding:7px 10px}
  .bc-sig span{font-size:13.5px}
}

/* Ver el resto del camino (por defecto solo paso anterior, actual y siguiente) */
.mas-pasos{position:relative;z-index:1;display:block;margin:14px 0 14px 64px;padding:8px 14px;border-radius:999px;border:1px dashed #3A3D45;background:var(--fondo);color:var(--gris);font-size:14.5px;font-weight:600}
.mas-pasos:hover{color:var(--tinta);border-color:var(--gris)}
@media (max-width:560px){.mas-pasos{margin-left:58px}}

/* Videos mandados desde el aula */
.vids{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.vids li{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--tinta)}
.vids li svg{width:16px;height:16px;color:#5BD49A;flex:none}
.vids li .link{margin-left:auto}
.boton-grabar{display:inline-flex;align-items:center;gap:10px}
.boton-grabar i{width:12px;height:12px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 3px rgba(229,72,77,.25)}
.subir-galeria{cursor:pointer}
/* Grabador a pantalla completa, como la cámara de WhatsApp: la imagen ocupa todo y los controles van encima */
body.con-grabador{overflow:hidden}
.grabador{position:fixed;inset:0;height:100vh;height:100dvh;z-index:50;background:#000;color:#fff;overflow:hidden;touch-action:none}
.grabador .gr-vivo,.grabador .gr-ver{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.grabador .gr-ver{object-fit:contain}
.gr-vivo.espejo{transform:scaleX(-1)}
.gr-cab{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 14px 28px;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:2}
.gr-tit{min-width:0;flex:1;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.gr-tit small{display:block;font-size:13px;opacity:.85}
.gr-tit strong{display:block;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grabando .gr-tit{visibility:hidden}
.gr-x{width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;flex:none;padding:0}
.gr-x svg{width:22px;height:22px}
.gr-reloj{position:absolute;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top));background:#E5484D;color:#fff;font:600 15px var(--display);padding:4px 12px;border-radius:999px}
.gr-msg{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);margin:0;text-align:center;font-size:16px;line-height:1.45;background:rgba(17,18,20,.88);padding:16px;border-radius:14px;z-index:2}
.gr-pie{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:40px 28px calc(24px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:2}
.revisando .gr-pie{background:linear-gradient(transparent,rgba(0,0,0,.75));padding-top:20px}
.revisando .gr-ver{top:calc(70px + env(safe-area-inset-top));bottom:auto;height:calc(100% - 190px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.gr-lado{width:48px;height:48px;flex:none}
.gr-redondo{border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;display:grid;place-items:center;padding:0}
.gr-redondo svg{width:24px;height:24px}
.gr-rec{width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:none;display:grid;place-items:center;padding:0;flex:none}
.gr-rec i{width:62px;height:62px;border-radius:50%;background:#E5484D;transition:all .2s}
.gr-rec.grabando i{width:28px;height:28px;border-radius:6px}
.gr-texto{border:0;background:rgba(255,255,255,.14);color:#fff;font:600 16px var(--sans);padding:12px 18px;border-radius:999px}
.gr-mandar{width:62px;height:62px;border-radius:50%;border:0;background:var(--naranja);color:#111;display:grid;place-items:center;padding:0;margin-left:auto;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.gr-mandar svg{width:28px;height:28px;margin-left:3px}
@media (min-width:900px){.grabador{inset:4vh 22vw;height:auto;border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.7)}}
/* Cartelito de subida en segundo plano */
.subida-pill{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));z-index:40;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);padding:10px 16px;border-radius:999px;background:rgba(27,28,32,.96);border:1px solid var(--linea);box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:15px;font-weight:600;color:var(--tinta)}
.subida-pill.ok{color:#5BD49A}
.subida-pill.ok svg{width:18px;height:18px}
.subida-pill.error{white-space:normal;border-radius:14px;color:var(--oxido-txt);font-weight:400}
.subida-pill .link{flex:none}
.sp-anillo{--p:30;width:18px;height:18px;border-radius:50%;flex:none;background:conic-gradient(var(--naranja) calc(var(--p)*1%),#3A3D45 0);-webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
.vid-pend .sp-anillo{animation:girar 1.2s linear infinite;background:conic-gradient(var(--naranja) 30%,#3A3D45 0)}
@keyframes girar{to{transform:rotate(1turn)}}
.vid-pend{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0;font-size:15px;color:var(--gris)}
.vid-pend .sp-anillo{margin-top:3px}

/* Módulo todavía no habilitado */
.etapa-bloq{position:relative;z-index:1;display:flex;gap:12px;align-items:center;margin:22px 0 6px;padding:14px 16px;border:1px dashed #3A3D45;border-radius:14px;color:var(--gris);background:var(--fondo)}
.etapa-bloq svg{width:22px;height:22px;flex:none}
.etapa-bloq p{margin:0;font-size:15px}
.etapa-bloq strong{display:block;color:var(--tinta);font-family:var(--display);font-weight:600}

/* Bloques por módulo: un fondo apenas teñido con el color del módulo y un título grande arriba */
.mod-bloque{--mc:#8FA6D6;margin:26px -14px 10px;padding:4px 14px 14px;border-radius:20px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 11%,transparent),color-mix(in srgb,var(--mc) 3%,transparent) 140px,transparent 100%)}
.mod-bloque:first-of-type{margin-top:8px}
.mod-banner{position:relative;z-index:1;padding:18px 4px 6px 64px}
.mod-banner small{display:block;font:600 12.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mc)}
.mod-banner h2{margin:2px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(22px,4.6vw,28px);line-height:1.15;color:var(--tinta)}
.mod-banner p{margin:4px 0 0;font-size:14.5px;color:var(--gris)}
.mod-banner::before{content:"";position:absolute;left:30px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--mc);box-shadow:0 0 0 5px color-mix(in srgb,var(--mc) 22%,transparent)}
.mod-pronto{opacity:.75}
.mod-plegado{padding-bottom:10px}
.mod-pliegue{position:relative;z-index:1;display:flex;align-items:center;gap:10px;width:calc(100% - 64px);margin:8px 0 0 64px;padding:10px 14px;border:1px solid color-mix(in srgb,var(--mc) 35%,transparent);border-radius:12px;background:color-mix(in srgb,var(--mc) 8%,var(--fondo));color:var(--tinta);font:600 14.5px var(--sans);cursor:pointer;text-align:left}
.mod-pliegue:hover{background:color-mix(in srgb,var(--mc) 15%,var(--fondo))}
.mod-pliegue svg{width:18px;height:18px;flex:none;color:var(--mc);transition:transform .2s}
.mod-pliegue.abierto svg{transform:rotate(180deg)}
.mod-pliegue small{margin-left:auto;font-weight:400;color:var(--gris)}
@media (max-width:560px){.mod-pliegue{margin-left:58px;width:calc(100% - 58px)}}
.etapa-bloq small{display:block;font:600 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mc,var(--gris))}
@media (max-width:560px){.mod-bloque{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}.mod-banner{padding-left:58px}.mod-banner::before{left:26px}}
/* Pantalla de cambio de módulo */
.pase-modulo{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 80% at 50% 40%,color-mix(in srgb,var(--mc) 30%,#111214),#0B0B0D 70%);opacity:0;transition:opacity .35s ease}
.pase-modulo.visible{opacity:1}
.pm-in{text-align:center;max-width:520px;transform:translateY(18px) scale(.98);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.pase-modulo.visible .pm-in{transform:none}
.pm-pre{margin:0;color:var(--gris);font-size:17px}
.pm-num{margin:6px 0 0;font:600 15px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mc)}
.pase-modulo h2{margin:6px 0 28px;font-family:var(--display);font-weight:600;font-size:clamp(34px,9vw,52px);line-height:1.08;color:var(--tinta)}
.pase-modulo .primario{font-size:17px;padding:13px 30px}
@media (prefers-reduced-motion:reduce){.pase-modulo,.pm-in{transition:none}}

/* Pregunta grande: «¿Ya tuviste la clase N?» cuando ya tiene todo lo esperado para esa clase */
.pregunta-clase{margin:18px 0 4px;padding:18px 18px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(232,131,79,.16),rgba(232,131,79,.05));border:1px solid rgba(232,131,79,.45)}
.pregunta-clase p{margin:0 0 14px;color:var(--gris);font-size:15.5px;line-height:1.45}
.pregunta-clase strong{display:block;font-family:var(--display);font-weight:600;font-size:clamp(19px,4.4vw,22px);color:var(--tinta);margin-bottom:4px}
.pregunta-clase .fila-botones{display:flex;gap:10px;flex-wrap:wrap}

/* Elegir módulo (abajo de todo) */
.selector-mod{margin:34px 0 10px}
.selector-mod h3{font:600 13.5px var(--sans);color:var(--gris);margin:0 0 10px;letter-spacing:.04em;text-transform:uppercase}
.sm-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sm-item{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--linea);background:color-mix(in srgb,var(--mc) 7%,var(--sup));color:var(--tinta);cursor:pointer;position:relative;overflow:hidden}
.sm-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mc)}
.sm-item small{font:600 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mc)}
.sm-item strong{font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.2}
.sm-estado{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--gris);margin-top:4px}
.sm-estado svg{width:14px;height:14px}
.sm-item.actual{border-color:var(--mc);box-shadow:0 0 0 1px var(--mc)}
.sm-item.bloq{cursor:default;opacity:.55;background:var(--sup)}
.sm-item.bloq small{color:var(--gris)}
.sm-item.bloq::before{background:#3A3D45}
.sm-item:not(.bloq):hover{border-color:var(--mc)}
@media (max-width:560px){.sm-lista{grid-template-columns:1fr 1fr}}

.panel-vids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 4px}
.panel-vid{display:flex;flex-direction:column;padding:0;background:var(--sup2);border:1px solid var(--linea);border-radius:12px;overflow:hidden;color:var(--tinta);text-align:left;cursor:pointer;font:inherit}
.panel-vid img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.panel-vid span{display:flex;align-items:center;gap:7px;padding:9px 11px;font-weight:600;font-size:14.5px;line-height:1.25}
.panel-vid span svg{width:16px;height:16px;flex:none}
.panel-vid:hover{border-color:var(--azul)}

.como{font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.como-listo,.como-casi{background:var(--azul-claro);color:var(--azul-txt)}
.como-cuesta{background:var(--oxido-claro);color:var(--oxido-txt)}
.acceso{margin:18px 0;padding:14px;border:1px solid var(--linea);border-radius:var(--radio-s);background:var(--sup2)}
.acceso-cab{display:grid;gap:2px;margin-bottom:10px}
.acceso-cab h3{font-size:16px}
.acceso-cab .suave{font-size:15px}
.bloque-email{display:grid;gap:4px;font-weight:600;font-size:15px;margin-bottom:10px}
.bloque-email input{padding:8px 10px;border:1.5px solid var(--linea);border-radius:var(--radio-s);background:var(--sup);font-weight:400}
.link-inv textarea{width:100%;border:1px solid var(--linea);border-radius:var(--radio-s);padding:10px;font-size:15px;background:var(--sup);resize:vertical}
.link-inv p{margin:0 0 6px}
.fila-botones{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
/* Aviso de guardado */
#aviso{position:fixed;right:16px;bottom:16px;background:var(--tinta);color:var(--fondo);font-weight:600;padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9}
#aviso.visible{opacity:1;transform:none}
#aviso.error{background:var(--oxido);color:var(--blanco)}

/* Panel de Andy */
.admin{max-width:1240px;margin:0 auto;padding:6px 20px 80px}
.admin h2{font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.admin .cuenta{font:600 13px var(--sans);background:var(--naranja);color:#111;border-radius:999px;padding:2px 9px}
.por-ver{margin:8px 0 34px}
.tarjetas-video{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tarjeta-video{display:flex;gap:12px;align-items:center;text-align:left;background:var(--sup);border:1px solid var(--linea);border-radius:var(--radio-m);padding:10px;color:var(--tinta);cursor:pointer}
.tarjeta-video:hover{border-color:var(--naranja)}
.tv-mini{position:relative;width:64px;height:84px;flex:none;border-radius:8px;overflow:hidden;background:#000;display:grid;place-items:center}
.tv-mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tv-play{position:relative;width:30px;height:30px}
.tv-txt{display:grid;gap:2px;min-width:0}
.tv-txt strong{font-size:16px}
.tv-txt span{font-size:14.5px;line-height:1.3}
.tv-txt small{color:var(--gris);font-size:13px}
.adm-top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.volver-adm{font-weight:600}
.revision{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;margin:18px 0 8px;align-items:start}
.rev-video{display:grid;gap:12px}
.rev-video>.chico{margin:-4px 0 0}
.rev-player{height:min(64vh,640px);background:#000;border-radius:var(--radio-m);overflow:hidden;display:grid;place-items:center}
.rev-player iframe{width:100%;height:100%;border:0}
.rev-info{display:grid;gap:6px}
.rev-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rev-info p{margin:0}
.rev-paso{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:17px}
.rev-info .fila-botones{margin-top:6px;align-items:center}
.visto{display:inline-flex;align-items:center;gap:6px;color:#5BD49A;font-weight:600}
.visto svg{width:18px;height:18px}
.rev-otros h4{font-size:14px;color:var(--gris);margin:0 0 8px;font-weight:600}
.rev-otros>div{display:flex;flex-wrap:wrap;gap:8px}
.chip-video{border:1px solid var(--linea);background:var(--sup);color:var(--tinta);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip-video small{color:var(--gris)}
.chip-video.nuevo{border-color:var(--naranja)}
.chip-video.sel{background:var(--tinta);color:var(--fondo)}
.chip-video.sel small{color:var(--fondo)}
.rev-msg .mensaje{margin:0;position:sticky;top:12px}
.rev-vacio{background:var(--sup);border-radius:var(--radio-m);padding:22px}
.det-resto{background:var(--sup);border-radius:var(--radio-m);padding:22px;margin-top:28px}
.lista-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lista-cab h1{font-size:26px}
.lista-botones{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.barra-der>*{white-space:nowrap}
.chip-prueba::first-letter,.barra-der [data-accion=volver-admin]::first-letter{text-transform:uppercase}
.chip-prueba{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--naranja-claro);color:var(--naranja);border:1px solid var(--naranja)}
@media (max-width:600px){.barra-der{gap:10px;font-size:14px}.barra-der .solo-pc{display:none}}
.lista table{width:100%;border-collapse:collapse;background:var(--sup);border-radius:var(--radio-m);overflow:hidden;font-size:16px}
.lista th{text-align:left;font-weight:600;font-size:14px;color:var(--gris);padding:10px 12px;border-bottom:1px solid var(--linea)}
.lista td{padding:12px;border-bottom:1px solid var(--linea);vertical-align:top}
.lista tr[data-elegir]{cursor:pointer}
.lista tr[data-elegir]:hover td{background:var(--azul-velo)}
.lista tr.sel td{background:var(--azul-claro)}
.lista td.nw{white-space:nowrap}
.etapa-completa .etapa-cab{padding:12px 0;border-bottom:1px solid var(--linea);margin:0}
.etapa-completa h3::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--azul);margin-right:10px;vertical-align:middle}
.marca-prob{display:block;font-size:13px;color:var(--oxido-txt);font-weight:600}
.marca-video{display:block;font-size:13px;color:var(--naranja);font-weight:600}
.vids-adm{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.vids-adm li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.vids-adm li.nuevo button{color:var(--naranja)}
.estado-chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--azul-claro);color:var(--azul-txt)}
.estado-chip.t-meterle{background:var(--oxido-claro);color:var(--oxido-txt)}
.estado-chip.t-adelantado,.estado-chip.t-m2{background:var(--naranja-claro);color:var(--naranja)}
.estado-chip.t-pausa{background:var(--papel);color:var(--gris);border:1px solid var(--linea)}
.detalle{background:var(--sup);border-radius:var(--radio-m);padding:22px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.vacio{margin:30px 0}
.det-cab{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.det-cab h2{font-size:24px}
.mensaje{margin:18px 0;padding:14px;border:1.5px solid var(--azul-claro);border-radius:var(--radio-s);background:var(--azul-velo)}
.mensaje-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mensaje-cab h3,.bloque h3{font-size:16px}
.mensaje-cab span{display:flex;gap:8px}
.mensaje textarea{width:100%;border:1px solid var(--linea);border-radius:var(--radio-s);padding:10px;font-size:15px;line-height:1.45;background:var(--sup);resize:vertical}
.form-admin{display:grid;gap:12px}
.form-admin label,.bloque{display:grid;gap:4px;font-weight:600;font-size:15px}
.form-admin input,.form-admin select,.bloque textarea,.fila-extra input{padding:8px 10px;border:1.5px solid var(--linea);border-radius:var(--radio-s);background:var(--sup);font-weight:400;font-size:16px}
.form-admin label.check{display:flex;gap:8px;align-items:center;font-weight:400}
.ajustes{grid-template-columns:1fr 1fr;margin-bottom:16px}
.ajustes label.check{grid-column:1/-1}
.segmentado{display:inline-flex;border:1.5px solid var(--linea);border-radius:999px;overflow:hidden;justify-self:start}
.segmentado button{padding:6px 14px;font-weight:600}
.segmentado button.sel{background:var(--azul);color:var(--blanco)}
.bloque{margin-top:20px}
.extras-adm,.probs-adm,.avance-adm{list-style:none;margin:6px 0 0;padding:0;font-weight:400}
.extras-adm li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--linea)}
.extras-adm li>span{flex:1;min-width:0}
.extras-adm li.hecha strong{text-decoration:line-through;color:var(--gris)}
.fila-extra{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;margin-top:8px}
.probs-adm li{padding:4px 0}
.avance-adm li{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:15px}
.avance-adm li span:nth-child(2){flex:1}
.ya-hecho{margin:6px 0 14px;padding:10px 14px;border:1px solid var(--linea);border-radius:var(--radio-s)}
.ya-hecho summary{cursor:pointer;font-weight:600}
.nh-mod{margin:12px 0 0;padding:6px 0 0;border:0;border-top:1px solid var(--linea)}
.nh-mod legend{padding:0}
.nh-mod legend strong{color:var(--mc)}
.nh-mod>.check{display:flex;gap:8px;margin:4px 0 0 22px;font-weight:400}
.avance-adm li.av-mod{justify-content:space-between}
.av-tit{flex:1;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.av-tit:hover{color:var(--azul-txt)}
.avance-adm li.av-mod{margin-top:14px;padding-top:6px;font:600 12.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mc);border-top:1px solid var(--linea)}
.avance-adm li.av-mod:first-child{margin-top:0;border-top:0}
.mini-nodo{cursor:pointer;position:relative}
.mini-nodo[aria-pressed=true]::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.extras-adm .mini-nodo[aria-pressed=true]{background:var(--azul);border-color:var(--azul-txt)}
.mini-nodo{width:18px;height:18px;border-radius:50%;border:2px solid var(--linea);background:var(--sup);flex:none}
.avance-adm .est-listo .mini-nodo,.avance-adm .est-casi .mini-nodo{background:var(--azul);border-color:var(--azul-txt)}
.avance-adm .est-cuesta .mini-nodo{background:var(--oxido-claro);border-color:var(--oxido-txt)}
.links-adm{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.links-adm p{width:100%;margin:0}

@media (max-width:900px){
  .revision{grid-template-columns:1fr}
  .rev-player{height:min(78vh,640px)}
  .rev-msg .mensaje{position:static}
  .lista th:nth-child(4),.lista td:nth-child(4),.lista th:nth-child(5),.lista td:nth-child(5){display:none}
}
@media (max-width:560px){
  body{font-size:16.5px}
  .barra{padding:12px 16px}
  .marca svg{height:40px}
  .ajustes{grid-template-columns:1fr}
  .fila-extra{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.instalar-app{display:flex;align-items:center;gap:12px;margin:0 0 22px;padding:12px 14px;background:var(--sup);border:1px solid var(--linea);border-radius:14px}
.instalar-app img{width:40px;height:40px;border-radius:10px;flex:none}
.instalar-app p{margin:0;flex:1;font-size:15px;line-height:1.35;color:var(--gris)}
.instalar-app p b{color:var(--tinta);display:block;font-size:15.5px}
.instalar-app a,.instalar-app button.ia-si{flex:none;font:600 14.5px var(--sans);color:var(--fondo);background:var(--tinta);border:0;border-radius:10px;padding:8px 12px;text-decoration:none}
.instalar-app .ia-no{flex:none;background:none;border:0;color:var(--gris);font-size:20px;line-height:1;padding:4px}
.modulos-adm{display:grid;gap:8px}
.mod-tg{display:flex;align-items:center;gap:12px;text-align:left;background:var(--sup2);border:1px solid var(--linea);border-radius:12px;padding:10px 14px;color:var(--tinta);cursor:pointer}
.mod-tg strong{display:block;font-size:15.5px}
.mod-tg small{color:var(--gris);font-size:13.5px}
.mod-sw{width:40px;height:24px;border-radius:999px;background:#3A3D45;position:relative;flex:none;transition:background .15s}
.mod-sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.mod-tg.on .mod-sw{background:#34C759}
.mod-tg.on .mod-sw i{transform:translateX(16px)}
</style>

/* =====================================================================
   MOTOR — decide en qué está cada alumno y qué le conviene hacer
   ===================================================================== */
const COLS = ['min', 'esp', 'ideal'];
const ORDEN = PROGRAMA.pasos.map(p => p.id);
const PASO = Object.fromEntries(PROGRAMA.pasos.map(p => [p.id, p]));
const MAX_K = PROGRAMA.clases + 1; // 5 = módulo 2

function requeridos(k, col) {
  const s = new Set();
  for (let j = 1; j <= Math.min(k, MAX_K); j++) {
    for (let c = 0; c <= col; c++) (PROGRAMA.esperado[j]?.[COLS[c]] || []).forEach(id => s.add(id));
  }
  return ORDEN.filter(id => s.has(id));
}

/* Módulos: 0 = antes de la clase 1, 1 = enlaces/anticipaciones/superposiciones, 2 = ADN del Jazz,
   3 = entrenamiento rítmico, 4 = Curva del Solo.
   st.modulos guarda los habilitados ('0', '01', '012'). Vacío = alumno de antes: todo habilitado. */
const MODULO_DE = { pre: 0, enlaces: 1, antic: 1, super: 1, m2: 2, ritmo: 3, curva: 4 };
const MODULOS = [
  { n: 0, titulo: 'Módulo 0', sub: 'Antes de la primera clase', nombre: 'Antes de la primera clase', color: '#E883AE' },
  { n: 1, titulo: 'Módulo 1', sub: 'Enlaces, anticipaciones y superposiciones', nombre: 'Cambios de acorde', color: '#E8834F' },
  { n: 2, titulo: 'Módulo 2', sub: 'ADN del Jazz', nombre: 'ADN del Jazz', color: '#7DB4FF' },
  { n: 3, titulo: 'Módulo 3', sub: 'Entrenamiento rítmico', nombre: 'Entrenamiento rítmico', color: '#5BD49A' },
  { n: 4, titulo: 'Módulo 4', sub: 'Curva del Solo', nombre: 'Curva del Solo', color: '#C7A6F2' },
];
const sinModulos = st => st.modulos === undefined || st.modulos === null || st.modulos === '';
// En la vista de prueba del panel se ve todo abierto
const moduloHabilitado = (st, n) => (typeof modo !== 'undefined' && modo === 'admin-prueba') || sinModulos(st) || String(st.modulos).includes(String(n));
const pasoHabilitado = (st, id) => moduloHabilitado(st, MODULO_DE[PASO[id].etapa]);

const hecho = (st, id) => !!(st.prog[id] && st.prog[id].hecho && st.prog[id].como !== 'cuesta');
const tocado = (st, id) => !!(st.prog[id] && st.prog[id].hecho);

function diasDesde(fecha) {
  if (!fecha) return 0;
  const d0 = new Date(fecha + 'T12:00:00');
  const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
  return Math.max(0, Math.round((hoy - d0) / 86400000));
}
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function estado(st) {
  const col = clamp((st.nivel || 2) - 1, 0, 2);
  const k = Math.min((st.clase || 0) + 1, MAX_K);
  const R = requeridos(k, col).filter(id => pasoHabilitado(st, id));
  const faltan = R.filter(id => !hecho(st, id));
  // Avance medido sobre lo nuevo de esta clase más lo que haya quedado pendiente de antes.
  // Algo tildado como "me cuesta" cuenta como medio paso.
  const previos = new Set(requeridos(k - 1, col).filter(id => pasoHabilitado(st, id)));
  const foco = R.filter(id => !previos.has(id) || !hecho(st, id));
  const peso = id => hecho(st, id) ? 1 : tocado(st, id) ? 0.5 : 0;
  const frac = foco.length ? foco.reduce((s, id) => s + peso(id), 0) / foco.length : 1;
  const pre = k === 1;
  const d = diasDesde(pre ? st.inicio : (st.claseFecha || st.inicio));
  // Cuánto se espera tener hecho a esta altura (0 a 1).
  // Pre-sincrónico: libre los 2 primeros días, completo al día 10.
  // Entre clases: libre el primer día, completo al día 6.
  const esperadoAhora = pre ? clamp((d - 2) / 8, 0, 1) : clamp((d - 1) / 5, 0, 1);
  let tipo;
  if (k === MAX_K && faltan.length === 0) tipo = 'm2';
  else if (st.pausa) tipo = 'pausa';
  else if (faltan.length === 0) {
    const idealOk = requeridos(k, 2).every(id => hecho(st, id));
    tipo = (col < 2 && idealOk) || (k < MAX_K && requeridos(k + 1, col).some(id => hecho(st, id) && !R.includes(id))) ? 'adelantado' : 'bien';
  } else if (frac + 0.15 < esperadoAhora || esperadoAhora >= 1) tipo = 'meterle';
  else tipo = 'bien';
  return { k, col, R, faltan, frac, d, esperadoAhora, tipo, pre };
}

/* Recomendaciones: el primero es el recomendado, el resto son alternativas */
function recomendaciones(st, n = 3) {
  const e = estado(st);
  const out = []; const ya = new Set();
  const push = (id, motivo) => { if (!ya.has(id) && PASO[id] && pasoHabilitado(st, id)) { ya.add(id); out.push({ id, motivo }); } };
  e.R.filter(id => st.prog[id]?.como === 'cuesta').forEach(id => push(id, 'seguir'));
  e.faltan.forEach(id => push(id, 'falta'));
  if (out.length < n) requeridos(e.k, 2).filter(id => !hecho(st, id)).forEach(id => push(id, 'extra'));
  if (out.length < n && e.k < MAX_K) requeridos(e.k + 1, e.col).filter(id => !hecho(st, id)).forEach(id => push(id, 'extra'));
  if (out.length < n) ORDEN.filter(id => !hecho(st, id) && !PASO[id].opcional).forEach(id => push(id, 'extra'));
  return { e, lista: out.slice(0, n) };
}

/* Posición en el mapa: 0 = inicio, 1..4 = listo para la clase N, 5 = módulo 2 */
function posicion(st) {
  const col = clamp((st.nivel || 2) - 1, 0, 2);
  let base = 0;
  for (let i = 1; i <= MAX_K; i++) {
    if (requeridos(i, col).every(id => hecho(st, id))) base = i; else break;
  }
  if (base >= MAX_K) return MAX_K;
  const prev = new Set(requeridos(base, col));
  const sig = requeridos(base + 1, col).filter(id => !prev.has(id));
  const f = sig.length ? sig.filter(id => hecho(st, id)).length / sig.length : 0;
  return base + f * 0.85;
}

/* Mensaje de WhatsApp en el estilo de Andy */
/* Mensaje corto para WhatsApp: (si viene de un video) lugar para la devolución + solo el paso que sigue */
function mensajeWhatsApp(st, link, pasoVideo) {
  const { e, lista } = recomendaciones(st, 3);
  const nombre = (st.nombre || '').split(' ')[0];
  const limpio = t => String(t || '').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1: $2');
  let txt = pasoVideo && PASO[pasoVideo] ? `${nombre}! Ya vi tu video de «${PASO[pasoVideo].titulo}».\n\n\n\n` : `${nombre}! `;
  const extra = (st.extras || []).find(x => !x.hecho);
  const r = lista.find(x => x.id !== pasoVideo || x.motivo === 'seguir');
  if (extra) txt += `Lo que sigue: ${extra.titulo}${extra.detalle ? '\n' + extra.detalle : ''}`;
  else if (r) {
    const p = PASO[r.id];
    txt += `${r.motivo === 'seguir' ? 'Seguimos con' : 'Lo que sigue'}: ${p.titulo}\n${limpio(p.detalle)}`;
    if (p.entrega) txt += `\n\nCuando lo tengas, mandame ${p.envia || 'el ' + p.entrega} ${p.entrega === 'audio' ? '🎧' : '📹'}`;
  } else txt += e.k >= MAX_K ? 'Ya tenés todo lo del módulo 1 🙌' : `Ya tenés todo lo que hace falta para la clase ${e.k} 🙌`;
  if (st.nota) txt += '\n\n' + st.nota;
  if (link) txt += `\n\nEn el aula tenés el paso con el video: ${link}`;
  return txt;
}

/* ---------- API ---------- */
async function llamar(accion, datos) {
  if (!API_URL) return demo(accion, datos);
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion, ...datos }) });
  } catch (e) { throw new Error('No hay conexión. Revisá internet y volvé a intentar.'); }
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

/* Modo demo: imita al servidor, con contraseñas en este navegador (solo para probar) */
const tokenDemo = () => Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
function demo(accion, d) {
  const db = leerDemo();
  db.sesiones = db.sesiones || {};
  const por = (campo, v) => db.alumnos.find(a => v && String(a[campo] || '') === String(v).trim().toLowerCase());
  const publico = (a, panel) => { const c = JSON.parse(JSON.stringify(a)); delete c.clave; delete c.invitacion; if (panel) { c.tieneClave = !!a.clave; c.invitacionPendiente = !!a.invitacion; } return c; };
  const deSesion = t => { const a = por('codigo', db.sesiones[t]); if (!a) throw new Error('Tu sesión se cerró. Volvé a entrar con tu email y contraseña.'); return a; };
  const sesion = a => { const t = tokenDemo(); db.sesiones[t] = a.codigo; escribirDemo(); return t; };
  switch (accion) {
    case 'auth.invitacion': { const a = db.alumnos.find(x => x.invitacion && x.invitacion === d.invitacion); if (!a) throw new Error('Este link ya se usó o no es válido. Pedime uno nuevo por WhatsApp.'); return { nombre: a.nombre, email: a.email }; }
    case 'auth.crearClave': {
      const a = db.alumnos.find(x => x.invitacion && x.invitacion === d.invitacion); if (!a) throw new Error('Este link ya se usó o no es válido. Pedime uno nuevo por WhatsApp.');
      if (!d.clave || d.clave.length < 6) throw new Error('La contraseña tiene que tener al menos 6 caracteres.');
      a.clave = d.clave; a.invitacion = ''; return { token: sesion(a), alumno: publico(a) };
    }
    case 'auth.registrar': {
      if (!db.registro || d.registro !== db.registro) throw new Error('Este link ya no funciona. Pedime uno nuevo por WhatsApp.');
      const email = String(d.email || '').trim().toLowerCase();
      if (por('email', email)) throw new Error('Ya hay una cuenta con ese email. Entrá con tu contraseña, o escribime por WhatsApp si no te acordás.');
      if (!d.clave || d.clave.length < 6) throw new Error('La contraseña tiene que tener al menos 6 caracteres.');
      const al = alumnoVacio(String(d.nombre).trim(), 2, hoyISO()); al.codigo = codigoNuevo(al.nombre); al.email = email; al.clave = d.clave; al.modulos = '0'; al.ajustar = '1';
      db.alumnos.push(al); escribirDemo(); return { token: sesion(al), alumno: publico(al) };
    }
    case 'admin.registro': { if (!db.registro || d.nuevo) db.registro = tokenDemo().slice(0, 12); escribirDemo(); return { registro: db.registro }; }
    case 'auth.entrar': { const a = por('email', String(d.email || '').toLowerCase()); if (!a || !a.clave || a.clave !== d.clave) throw new Error('El email o la contraseña no coinciden.'); return { token: sesion(a), alumno: publico(a) }; }
    case 'auth.salir': delete db.sesiones[d.token]; escribirDemo(); return { ok: true };
    case 'alumno.get': return { alumno: publico(deSesion(d.token)) };
    case 'alumno.guardar': {
      const a = deSesion(d.token);
      ['prog', 'probs', 'clase', 'claseFecha', 'standard'].forEach(k => { if (k in d.cambios) a[k] = d.cambios[k]; });
      if (d.cambios.extras) a.extras = a.extras.map(x => ({ ...x, hecho: !!(d.cambios.extras.find(y => y.id === x.id) || {}).hecho }));
      a.act = hoyISO(); escribirDemo(); return { ok: true };
    }
    case 'admin.lista': return { alumnos: db.alumnos.map(a => publico(a, true)) };
    case 'admin.crear': {
      const al = d.alumno; al.email = String(al.email || '').trim().toLowerCase();
      if (al.email && por('email', al.email)) throw new Error('Ya hay un alumno con ese email');
      al.invitacion = tokenDemo(); db.alumnos.push(al); escribirDemo(); return { alumno: publico(al, true), invitacion: al.invitacion };
    }
    case 'admin.guardar': {
      const i = db.alumnos.findIndex(a => a.codigo === d.alumno.codigo); if (i < 0) throw new Error('No existe ese alumno');
      const priv = { clave: db.alumnos[i].clave, invitacion: db.alumnos[i].invitacion };
      db.alumnos[i] = Object.assign({}, d.alumno, priv); delete db.alumnos[i].tieneClave; delete db.alumnos[i].invitacionPendiente;
      escribirDemo(); return { ok: true };
    }
    case 'admin.invitar': { const a = por('codigo', d.codigo); a.invitacion = tokenDemo(); escribirDemo(); return { invitacion: a.invitacion }; }
    case 'admin.borrar': { db.alumnos = db.alumnos.filter(a => a.codigo !== d.codigo); escribirDemo(); return { ok: true }; }
    case 'demo.reset': { memoria = semillaDemo(); escribirDemo(); return { ok: true }; }
  }
  throw new Error('Acción desconocida');
}

function guardarClaveAdmin(c) { claveAdmin = c || ''; try { c ? localStorage.setItem('mapaAE_clave', c) : (localStorage.removeItem('mapaAE_clave'), sessionStorage.removeItem('mapaAE_clave')); } catch (e) {} if (!c) guardarLocal('mapaAE_lista', null); }
let ediciones = 0;   // cambios del alumno hechos antes de que llegue la respuesta del servidor

const ETIQUETA_COMO = { cuesta: 'Me cuesta', casi: 'Casi', listo: 'Ya está' };
const NOMBRE_ESTACION = ['Inicio', 'Clase 1', 'Clase 2', 'Clase 3', 'Clase 4', 'Módulo 2'];

function nav(url) { try { history.replaceState(null, '', url); } catch (e) {} }
function linkInvitacion(token) {
  const u = new URL(location.href); u.search = ''; u.hash = ''; u.searchParams.set('invitacion', token); return u.toString();
}
function linkRegistro(c) { const u = new URL(location.href); u.search = ''; u.hash = ''; u.searchParams.set('registro', c); return u.toString(); }
function linkMapa() { const u = new URL(location.href); u.search = ''; u.hash = ''; return u.toString(); }
let TOKEN = '';
try { TOKEN = localStorage.getItem('mapaAE_token') || ''; } catch (e) {}
function guardarToken(t) { TOKEN = t || ''; try { t ? localStorage.setItem('mapaAE_token', t) : localStorage.removeItem('mapaAE_token'); } catch (e) {} }

/* ---------------- Guardado ---------------- */
let timerGuardar = null;
/* ---- Guardar solo lo que cambió (para no pisar lo hecho en otro dispositivo o desde el panel) ---- */
const clonar = o => JSON.parse(JSON.stringify(o ?? null));
function difPasos(base, cur) {
  const d = {}; base = base || {}; cur = cur || {};
  new Set([...Object.keys(base), ...Object.keys(cur)]).forEach(id => {
    if (JSON.stringify(base[id]) !== JSON.stringify(cur[id])) d[id] = id in cur ? cur[id] : null;
  });
  return d;
}
function aplicarPasos(o, d) { const r = Object.assign({}, o || {}); Object.keys(d).forEach(id => { if (d[id] === null) delete r[id]; else r[id] = clonar(d[id]); }); return r; }
let BASE = null;   // lo último que se sabe que está en el servidor, para el alumno
const ORIG = {};   // ídem por alumno, para el panel
function difAlumno(base, cur) {
  const c = {};
  Object.keys(cur).forEach(k => {
    if (k === 'prog' || k === 'probs') { const d = difPasos(base?.[k], cur[k]); if (Object.keys(d).length) c[k + 'Cambios'] = d; }
    else if (JSON.stringify(base?.[k]) !== JSON.stringify(cur[k])) c[k] = clonar(cur[k]);
  });
  return c;
}

function guardarAlumno() {
  if (modo === 'admin-prueba') { aviso('Vista de prueba: no se guarda nada'); return; }
  if (modo === 'alumno') { ediciones++; guardarLocal('mapaAE_alumno', { token: TOKEN, alumno: ST, base: BASE }); }
  aviso('Guardando…');
  clearTimeout(timerGuardar);
  timerGuardar = setTimeout(async () => {
    try {
      if (modo === 'admin-vista') { const i = LISTA.findIndex(x => x.codigo === ST.codigo); if (i >= 0) LISTA[i] = ST; await guardarCambiosAdm(ST.codigo); aviso('Guardado'); return; }
      const enviado = clonar(ST);
      const progCambios = difPasos(BASE?.prog, enviado.prog), probsCambios = difPasos(BASE?.probs, enviado.probs);
      await llamar('alumno.guardar', { token: TOKEN, cambios: { progCambios, probsCambios, prog: enviado.prog, probs: enviado.probs,
        clase: enviado.clase, claseFecha: enviado.claseFecha, extras: enviado.extras, standard: enviado.standard } });
      BASE = Object.assign(clonar(BASE || {}), { clase: enviado.clase, claseFecha: enviado.claseFecha, standard: enviado.standard,
        prog: aplicarPasos(BASE?.prog, progCambios), probs: aplicarPasos(BASE?.probs, probsCambios) });
      guardarLocal('mapaAE_alumno', { token: TOKEN, alumno: ST, base: BASE });
      aviso('Guardado');
    } catch (e) { aviso(/sesión/.test(e.message) ? e.message : 'No se pudo guardar. Revisá la conexión y volvé a intentar.', true); }
  }, 500);
}
function aviso(t, error) {
  const el = $('#aviso'); if (!el) return;
  el.textContent = t; el.classList.toggle('error', !!error); el.classList.add('visible');
  // Los avisos de algo en curso («Guardando…») se quedan hasta que termina; el resto se va solo (los errores tardan más)
  clearTimeout(el._t);
  if (!/…$/.test(t)) el._t = setTimeout(() => el.classList.remove('visible'), error ? 6000 : 1800);
  el.onclick = () => el.classList.remove('visible');
}

/* ---------------- Vista del alumno: el camino ----------------
   Un camino dibujado de punta a punta. El paso actual está abierto en el camino:
   consigna, material y "¿Cómo te fue?". Al responder, aparece "Seguir" y el camino avanza.
   El video va al costado (arriba en el celular), uno por vez: cambia solo al avanzar,
   y los links a minutos del video lo adelantan ahí mismo. */

const ICONO = {

  candado: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
  cruz: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  mandar: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l15-7-4.5 15-3-6.2z" fill="currentColor"/></svg>',
  girar: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a8 8 0 0 1 14.5-3.5L20 7M20 15a8 8 0 0 1-14.5 3.5L4 17M20 3v4h-4M4 21v-4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  enviar: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-7-6 15-2.5-6.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  ok: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#0E1F16" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  idea: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  abajo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
const ytId = url => { const m = String(url || '').match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/); return m ? m[1] : null; };
const ytT = url => { const m = String(url || '').match(/[?&](?:t|start)=(\d+)/); return m ? +m[1] : 0; };
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

function titularEstado(e) {
  return { bien: 'Vas bien', meterle: 'Hay que meterle un poco', adelantado: 'Vas adelantado', pausa: 'Sin apuro', m2: 'Ya estás en el módulo 2' }[e.tipo];
}
function etiquetaAdmin(e) {
  return { bien: 'Va bien', meterle: 'Hay que meterle', adelantado: 'Adelantado', pausa: 'En pausa', m2: 'En módulo 2' }[e.tipo];
}
function bajadaEstado(st, e) {
  const proxima = e.k <= 4 ? `la clase ${e.k}` : 'lo que sigue';
  const nombres = ids => ids.slice(0, 3).map(id => PASO[id].titulo.toLowerCase()).join(', ').replace(/, ([^,]*)$/, ' y $1');
  if (e.tipo === 'm2') return 'Terminaste el módulo 1. El resto del módulo 2 lo seguimos por WhatsApp mientras se suma al mapa.';
  if (e.tipo === 'pausa') return 'Dejé tu aula en pausa. Avanzá cuando puedas, sin presión.';
  if (e.tipo === 'meterle') return `Para ${proxima} conviene tener: ${nombres(e.faltan)}${e.faltan.length > 3 ? ', entre otras' : ''}.`;
  if (e.tipo === 'adelantado') return `Ya tenés lo necesario para ${proxima}. Si tenés ganas, podés seguir con lo que viene.`;
  if (e.faltan.length === 0) return `Ya tenés lo necesario para ${proxima}.`;
  return `Para ${proxima} te ${e.faltan.length === 1 ? 'queda' : 'quedan'} ${e.faltan.length} ${e.faltan.length === 1 ? 'paso' : 'pasos'}.`;
}

function tiraClases(st, e, animar) {
  const p = posicion(st);
  const tramos = ['Clase 1', 'Clase 2', 'Clase 3', 'Clase 4', 'Módulo 2'];
  return `<ol class="tira ${animar && !reduceMotion ? 'animar' : ''}" aria-label="Tu camino en el módulo">
    ${tramos.map((t, i) => {
      const n = i + 1, lleno = clamp(p - i, 0, 1), tuvo = n <= (st.clase || 0) && n <= 4, prox = n === e.k;
      return `<li class="tramo ${tuvo ? 'tuvo' : prox ? 'prox' : ''} ${prox && e.tipo === 'meterle' ? 'meterle' : ''}">
        <span class="barra-tramo"><span style="--lleno:${lleno}"></span></span>
        <span class="tramo-txt">${tuvo ? ICONO.check : ''}${t}</span>
        ${prox && e.tipo !== 'm2' ? '<span class="tramo-sub">próxima</span>' : ''}
      </li>`;
    }).join('')}
  </ol>`;
}

/* Texto con formato mínimo. Los links a YouTube se vuelven botones que mueven el video de al lado. */
function linkHTML(texto, url) {
  const id = ytId(url);
  if (id) return `<button class="link-seek" data-seek="${id}:${ytT(url)}">${ICONO.video}${texto}</button>`;
  return `<a href="${url}" target="_blank" rel="noopener">${texto}</a>`;
}
function enLinea(l) {
  return esc(l).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => linkHTML(t, u));
}
function textoHTML(t) {
  const out = []; let lista = [];
  const cerrar = () => { if (lista.length) { out.push(`<ul class="reglas">${lista.map(l => `<li>${enLinea(l)}</li>`).join('')}</ul>`); lista = []; } };
  String(t || '').split('\n').forEach(l => { if (l.startsWith('- ')) lista.push(l.slice(2)); else { cerrar(); if (l.trim()) out.push(`<p>${enLinea(l)}</p>`); } });
  cerrar(); return out.join('');
}

function opcionesProgreso(p) { return p.progreso || (p.sinProgreso ? PROGRESO_SIMPLE : PROGRESO_BASE); }
function opcionElegida(st, p) {
  const pr = st.prog[p.id]; if (!pr) return null;
  return opcionesProgreso(p).find(o => o.id === pr.op) || opcionesProgreso(p).find(o => o.nivel === pr.como) || null;
}
function ayudaPara(p, sel) {
  if (!sel) return { apoyo: false, difs: [] };
  const probs = p.problemas || [];
  if (sel.muestra) return { apoyo: !!p.apoyo && sel.muestra.includes('apoyo'), difs: probs.filter(q => sel.muestra.includes(q.id)) };
  return { apoyo: false, difs: sel.nivel === 'cuesta' ? probs : [] };
}

/* Material: los videos se abren en el reproductor de al lado; los documentos, en otra pestaña */
const esDoc = r => r.url && !ytId(r.url);
function docNuevo(p, r) {
  const i = ORDEN.indexOf(p.id);
  for (let j = 0; j < i; j++) if ((PASO[ORDEN[j]].recursos || []).some(x => x.url === r.url)) return false;
  return true;
}
/* Panel con varios videos a la vez (miniaturas que cargan el video de al lado) */
function panelHTML(p) {
  if (!p.panel) return '';
  return `<div class="panel-vids">${p.panel.map(v => `<button class="panel-vid" data-seek="${v.video}:0"><img src="https://i.ytimg.com/vi/${esc(v.video)}/mqdefault.jpg" alt="" loading="lazy"><span>${ICONO.video}${esc(v.t)}</span></button>`).join('')}</div>`;
}
function materialHTML(p) {
  const rs = (p.recursos || []).filter(r => r.url);
  if (!rs.length) return '';
  const nuevos = rs.filter(r => esDoc(r) && docNuevo(p, r));
  const resto = rs.filter(r => !nuevos.includes(r));
  return `${nuevos.map(r => `<a class="doc-nuevo" href="${esc(r.url)}" target="_blank" rel="noopener"><span class="dn-ico">${ICONO.doc}</span><span><small>Documento nuevo: leelo antes de practicar</small><strong>${esc(r.t.replace(/^Doc:\s*/, ''))}</strong></span>${ICONO.abajo}</a>`).join('')}
  ${resto.length ? `<div class="material">${resto.map(r => {
    const id = ytId(r.url);
    if (id) { const t = ytT(r.url); return `<button class="mat" data-seek="${id}:${t}">${ICONO.video}<span>${esc(r.t.replace(/^Video:\s*/, ''))}${t ? `<small>desde ${mmss(t)}</small>` : ''}</span></button>`; }
    return `<a class="mat" href="${esc(r.url)}" target="_blank" rel="noopener">${ICONO.doc}<span>${esc(r.t)}</span></a>`;
  }).join('')}</div>` : ''}`;
}
function apoyoHTML(p) {
  return `<div class="apoyo"><h4>${esc(p.apoyo.titulo)}</h4>${p.apoyo.texto ? `<p>${esc(p.apoyo.texto)}</p>` : ''}
    ${p.apoyo.items.map(i => `<div class="apoyo-item"><p class="apoyo-t">${esc(i.t)}</p><p class="apoyo-c">${esc(i.cuando)}</p>
      ${(i.partes || [{ video: i.video, url: i.url }]).map(pt => `${pt.titulo ? `<p class="apoyo-parte">${esc(pt.titulo)}</p>` : ''}<div class="apoyo-links">${pt.video ? `<button class="mat" data-seek="${ytId(pt.video)}:0">${ICONO.video}<span>${esc(pt.tv || 'Ver el video')}</span></button>` : ''}${pt.url ? `<a class="mat" href="${esc(pt.url)}" target="_blank" rel="noopener">${ICONO.doc}<span>${esc(pt.td || 'Leer el documento')}</span></a>` : ''}</div>`).join('')}</div>`).join('')}</div>`;
}
function dificultadesHTML(difs) {
  if (!difs.length) return '';
  return `<div class="dificultades"><h4>Dificultades comunes</h4>${difs.map(q => `<div class="dif"><p class="dif-q">${esc(q.q)}</p>${textoHTML(q.fix)}
    ${q.url ? linkHTML('Ver esa parte del video', esc(q.url)) : ''}
    ${q.doc ? `<a href="${esc(q.doc.url)}" target="_blank" rel="noopener">${esc(q.doc.t)}</a>` : ''}</div>`).join('')}</div>`;
}

function standardHTML(st) {
  const elegido = st.standard || '';
  const item = STANDARDS.find(x => x.t === elegido);
  return `<div class="pregunta"><h4>¿Con qué tema vas a trabajar?</h4>
    <div class="standards" role="radiogroup" aria-label="Standards">${STANDARDS.map(x => `<button role="radio" aria-checked="${x.t === elegido}" class="chip-op ${x.t === elegido ? 'sel' : ''}" data-standard="${esc(x.t)}">${esc(x.t)}</button>`).join('')}</div>
    <form class="otro-standard" data-form-standard="1"><input name="otro" aria-label="Otro tema" placeholder="Otro tema" value="${item || !elegido ? '' : esc(elegido)}"><button class="secundario">Elegir este</button></form>
    ${elegido ? `<div class="respuesta resp-ok festejo" role="status"><span class="resp-ico">${ICONO.ok}</span><div><p class="resp-tit">Elegiste ${esc(elegido)}</p><p>¡Ya estás muy cerca de agendar el inicio de tus encuentros sincrónicos en Ajuste Elástico!</p>${item && item.pdf ? `<a href="${esc(item.pdf)}" target="_blank" rel="noopener">Descargar la parte para trabajar (PDF)</a>` : '<p class="suave chico">Te paso la parte del tema para trabajar.</p>'}</div></div>` : ''}
  </div>`;
}

function preguntaHTML(st, p) {
  if (p.tipo === 'standard') return standardHTML(st);
  const sel = opcionElegida(st, p);
  const ayuda = ayudaPara(p, sel);
  return `<div class="pregunta"><h4>${esc(p.pregunta || '¿Cómo te fue?')}</h4>
    <div class="ops" role="radiogroup" aria-label="${esc(p.pregunta || 'Cómo te fue')}">
      ${opcionesProgreso(p).map(o => `<button role="radio" aria-checked="${sel === o}" class="op nivel-${o.nivel} ${sel === o ? 'sel' : ''}" data-op="${p.id}:${o.id}"><span class="op-punto"></span>${esc(o.label)}</button>`).join('')}
    </div>
    ${sel && sel.resp ? respuestaHTML(sel) : ''}
    ${ayuda.apoyo ? apoyoHTML(p) : ''}
    ${dificultadesHTML(ayuda.difs)}
  </div>`;
}

/* Respuesta según cómo le fue: verde con tilde si va bien, recuadro de recomendación si no */
function respuestaHTML(sel) {
  const ok = sel.nivel === 'listo';
  return `<div class="respuesta ${ok ? 'resp-ok' : 'resp-rec nivel-' + sel.nivel}" role="status">
    <span class="resp-ico">${ok ? ICONO.ok : ICONO.idea}</span>
    <div><p class="resp-tit">${ok ? 'Muy bien' : 'Recomendación'}</p>${textoHTML(sel.resp)}${sel.url ? linkHTML('Volver a ver el ejemplo', esc(sel.url)) : ''}</div>
  </div>`;
}
/* Segunda pregunta de un paso, que depende de lo que contestó en otro (p. ej. cómo viene la transcripción) */
function seguimientoHTML(st, p) {
  const sg = p.seguimiento; if (!sg) return '';
  const prev = st.prog[sg.segun]?.op || '';
  const caso = sg.casos[prev] || sg.casos._;
  if (caso.tip) return `<div class="tip-paso">${ICONO.idea}<p>${enLinea(caso.tip)}</p></div>`;
  const elegida = caso.opciones.find(o => o.id === st.prog[p.id + '_seg']?.op);
  return `<div class="pregunta"><h4>${esc(sg.pregunta)}</h4>
    <div class="ops" role="radiogroup" aria-label="${esc(sg.pregunta)}">
      ${caso.opciones.map(o => `<button role="radio" aria-checked="${elegida === o}" class="op nivel-${o.nivel} ${elegida === o ? 'sel' : ''}" data-seg="${p.id}:${o.id}"><span class="op-punto"></span>${esc(o.label)}</button>`).join('')}
    </div>
    ${elegida && elegida.resp ? respuestaHTML(elegida) : ''}
  </div>`;
}
function videoAnterior(id) { const i = ORDEN.indexOf(id); for (let j = i - 1; j >= 0; j--) if (PASO[ORDEN[j]].video) return PASO[ORDEN[j]].video.id; return null; }
function siguienteDe(id) { const i = ORDEN.indexOf(id), sig = ORDEN[i + 1]; return sig && ST && pasoHabilitado(ST, sig) ? PASO[sig] : null; }

function tarjetaHTML(st, e, p) {
  const sel = opcionElegida(st, p);
  const sig = siguienteDe(p.id);
  const respondido = p.tipo === 'standard' ? !!st.standard : !!sel;
  const necesario = e.faltan.includes(p.id);
  return `<div class="tarjeta">
    <div class="chips">${p.entrega ? `<span class="chip">${ICONO.enviar}${p.opcional ? 'Podés mandarme' : 'Mandame'} un ${esc(p.entrega)}</span>` : ''}${necesario ? `<span class="chip ${e.tipo === 'meterle' ? 'chip-oxido' : ''}">Para la clase ${Math.min(e.k, 4)}</span>` : ''}</div>
    <div class="consigna">${textoHTML(p.detalle)}</div>
    ${panelHTML(p)}
    ${materialHTML(p)}
    ${p.nota ? `<p class="nota-paso">${esc(p.nota)}</p>` : ''}
    ${p.tip ? `<div class="tip-paso">${ICONO.idea}<p>${esc(p.tip)}</p></div>` : ''}
    ${seguimientoHTML(st, p)}
    ${preguntaHTML(st, p)}
    ${respondido && p.entrega && !sel?.saltea ? envioHTML(st, p) : ''}
    ${respondido && sig && (!p.entrega || p.opcional || st.prog[p.id]?.envio || sel?.saltea) ? `<div class="seguir">
        ${sel && sel.nivel === 'cuesta'
          ? `<button class="secundario" data-abrir="${sig.id}">Seguir igual con lo que viene</button>`
          : `<button class="primario" data-abrir="${sig.id}"><span>Seguir</span><small>${esc(sig.titulo)}</small>${ICONO.abajo}</button>`}
      </div>` : ''}
  </div>`;
}

function envioHTML(st, p) {
  const pr = st.prog[p.id] || {};
  const envia = opcionElegida(st, p)?.envia || p.envia;
  const ok = !!pr.envio;
  const vids = pr.videos || [];
  const conVideo = /video/.test(p.entrega || '');
  const wa = typeof WHATSAPP_ANDY !== 'undefined' && WHATSAPP_ANDY ? `<a class="secundario boton" href="https://wa.me/${WHATSAPP_ANDY}" target="_blank" rel="noopener">${ICONO.enviar}Abrir WhatsApp</a>` : '';
  const pend = modo === 'alumno' ? pendientes(p.id) : [];
  const listaPend = pend.length ? `<p class="vid-pend"><span class="sp-anillo"></span>${pend.length === 1 ? 'Se está mandando tu video.' : 'Se están mandando tus videos.'} Podés seguir usando el aula; si la cerrás, se termina de mandar cuando la vuelvas a abrir.</p>` : '';
  const lista = vids.length ? `<ul class="vids">${vids.map((v, i) => `<li>${ICONO.check}<span>Video del ${fechaCorta(v.t)}${v.seg ? ' · ' + duracion(v.seg) : ''}</span>
      ${modo === 'admin-vista' ? `<button class="link" data-ver-video="${p.id}:${i}">${v.visto ? 'Ver' : 'Ver (nuevo)'}</button>` : ''}</li>`).join('')}</ul>` : '';
  const botonesVideo = conVideo && modo !== 'admin-vista' ? `<button class="primario boton-grabar" data-grabar="${p.id}"><i></i>${vids.length ? 'Grabar otro video' : 'Grabar el video acá'}</button>

  return `<div class="envio ${ok ? 'envio-ok' : ''}">
    <p class="envio-t">${ok ? ICONO.check : ICONO.enviar}<strong>${ok && pend.length && !vids.length ? 'Mandándome tu video…' : ok ? `Listo, ya me lo mandaste` : `${p.opcional ? 'Podés mandarme' : 'Mandame'} ${esc(envia || 'el ' + p.entrega)}`}</strong></p>
    ${ok || !primerasEntregas(p.id) ? '' : `<p class="envio-c">${conVideo ? 'Grabalo acá mismo o mandámelo por WhatsApp.' : 'Mandámelo por WhatsApp.'} Así lo veo antes de la clase y te devuelvo lo que haga falta. El paso siguiente se abre cuando lo mandes.</p>`}
    ${lista}${listaPend}

    ${vids.length || pend.length ? '' : `<div class="fila-botones">${ok ? '' : wa}<label class="envio-check"><input type="checkbox" data-envio="${p.id}" ${ok ? 'checked' : ''}><span>${conVideo ? 'Ya te lo mandé por WhatsApp' : 'Ya te lo mandé'}</span></label></div>`}
